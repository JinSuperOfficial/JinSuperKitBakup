<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>811 工具箱 · 八年(11)班</title>
<style>
  /* 圆角规范：.Skills/theme-plus/references/circle_angle.md
     默认 rounded-md / rounded-lg，窗口最多 rounded-xl，禁止 rounded-2xl / rounded-3xl
     以及按钮/输入框/卡片的 rounded-full；只有状态点、开关才用胶囊。 */
  :root{
    color-scheme: light dark;

    /* ---------- 圆角 token ---------- */
    --radius-xs:4px;
    --radius-sm:6px;
    --radius-md:8px;
    --radius-lg:10px;
    --radius-xl:12px;
    --radius-pill:999px;

    --radius-control:var(--radius-md);
    --radius-card:var(--radius-lg);
    --radius-badge:var(--radius-sm);

    /* ---------- 浅色模式基准 ---------- */
    --bg:#F8F3EC;
    --paper:#FFFCF7;
    --ink:#2E2A26;
    --ink-soft:#6B635A;
    --oak:#8D6959;
    --olive:#8E9867;
    --clay:#D97757;
    --line:rgba(46,42,38,.12);
    --line-strong:rgba(46,42,38,.18);
    --accent:#B0552F;
    --accent-soft:rgba(217,119,87,.10);
    --glow-1:hsl(28 40% 68% / .20);
    --glow-2:hsl(84 24% 62% / .16);
    --shadow-1:rgba(46,42,38,.05);
    --shadow-2:rgba(46,42,38,.34);

    /* 窗口专用 */
    --titlebar-tint:linear-gradient(to bottom, rgba(46,42,38,.015), rgba(46,42,38,.05));
    --window-shadow:
      0 0 0 1px var(--shadow-1),
      0 1px 2px rgba(46,42,38,.04),
      0 18px 38px -20px rgba(46,42,38,.22),
      0 42px 72px -44px rgba(46,42,38,.28);
    --window-highlight:inset 0 1px 0 rgba(255,255,255,.55);

    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14120E;
      --paper:#1E1B17;
      --ink:#EDE7DF;
      --ink-soft:#A29A8E;
      --oak:#B89B85;
      --olive:#A8B57C;
      --clay:#E88B6D;
      --line:rgba(237,231,223,.12);
      --line-strong:rgba(237,231,223,.20);
      --accent:#E88B6D;
      --accent-soft:rgba(217,119,87,.16);
      --glow-1:hsl(28 44% 52% / .26);
      --glow-2:hsl(84 26% 46% / .22);
      --shadow-1:rgba(0,0,0,.40);
      --shadow-2:rgba(0,0,0,.70);

      --titlebar-tint:linear-gradient(to bottom, rgba(255,255,255,.012), rgba(0,0,0,.14));
      --window-shadow:
        0 0 0 1px rgba(255,255,255,.045),
        0 1px 2px rgba(0,0,0,.35),
        0 22px 44px -20px rgba(0,0,0,.55),
        0 48px 84px -44px rgba(0,0,0,.65);
      --window-highlight:inset 0 1px 0 rgba(255,255,255,.06);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    background:
      radial-gradient(880px 520px at 12% -8%, var(--glow-1), transparent 62%),
      radial-gradient(760px 480px at 92% 4%, var(--glow-2), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:clamp(24px,5vw,64px) clamp(14px,4vw,40px) clamp(40px,8vw,88px);
    transition:background .5s ease, color .3s ease;
  }

  .page{max-width:820px;margin:0 auto}

  /* ---------- 窗口外壳 ---------- */
  .window{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    box-shadow:var(--window-shadow);
    overflow:hidden;
  }
  .window::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    box-shadow:var(--window-highlight);
  }

  /* ---------- 标题栏 ---------- */
  .titlebar{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
    height:44px;
    padding:0 14px;
    border-bottom:1px solid var(--line);
    background-image:var(--titlebar-tint);
    user-select:none;
  }

  .traffic{display:flex;align-items:center;gap:8px;justify-self:start}
  .traffic .dot{
    width:12px;height:12px;
    border-radius:50%;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);
  }
  .traffic .close{background:#FF5F57}
  .traffic .min{background:#FEBC2E}
  .traffic .max{background:#28C840}

  .titlebar-title{
    justify-self:center;
    font-family:var(--serif);
    font-size:13px;
    font-weight:500;
    letter-spacing:.08em;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .titlebar-actions{
    justify-self:end;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .ghost-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:26px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--ink-soft);
    font-size:12px;
    letter-spacing:.04em;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .22s ease, color .22s ease, background .22s ease;
  }
  .ghost-btn svg{width:13px;height:13px;flex:none}
  .ghost-btn:hover{
    border-color:var(--clay);
    color:var(--ink);
    background:var(--accent-soft);
  }
  .ghost-btn:focus-visible{outline:2px solid var(--clay);outline-offset:2px}

  /* ---------- 窗口内容 ---------- */
  .window-body{
    padding:clamp(26px,4.2vw,40px) clamp(20px,3.4vw,32px) clamp(22px,3.2vw,28px);
  }

  .head{margin-bottom:clamp(20px,3.2vw,28px)}

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--oak);
  }
  .kicker::before{
    content:"";
    width:24px;height:1px;
    background:var(--clay);
    flex:none;
  }

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(26px,4.6vw,36px);
    line-height:1.25;
    letter-spacing:-.005em;
  }

  .subtitle{
    margin-top:10px;
    padding-left:13px;
    border-left:2px solid var(--clay);
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(14px,2vw,16px);
    line-height:1.65;
    letter-spacing:.03em;
    color:var(--ink-soft);
  }

  /* ---------- 工具卡片 ---------- */
  .grid{
    display:grid;
    gap:10px;
    margin-top:clamp(20px,3.2vw,26px);
  }

  .card{
    display:grid;
    grid-template-columns:42px 1fr 18px;
    align-items:center;
    gap:15px;
    padding:15px clamp(14px,2.4vw,20px);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    color:inherit;
    text-decoration:none;
    box-shadow:0 1px 2px var(--shadow-1);
    transition:border-color .22s ease, background .22s ease, transform .15s ease, box-shadow .22s ease;
  }
  .card:hover{
    border-color:var(--clay);
    background:color-mix(in srgb, var(--paper) 94%, var(--clay) 6%);
    transform:translateY(-2px);
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 12px 26px -18px var(--shadow-2);
  }
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

  .card-ico{
    width:42px;height:42px;
    display:grid;
    place-items:center;
    border-radius:var(--radius-control);
    background:var(--accent-soft);
    border:1px solid var(--line);
    color:var(--accent);
    transition:background .22s ease, border-color .22s ease;
  }
  .card-ico svg{width:20px;height:20px}
  .card:hover .card-ico{border-color:var(--clay)}

  .card-body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .card-title{
    font-family:var(--serif);
    font-size:17px;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .card-desc{
    font-size:13px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .card-go{
    color:var(--ink-soft);
    opacity:.45;
    transition:opacity .22s ease, transform .22s ease, color .22s ease;
  }
  .card-go svg{width:17px;height:17px;display:block}
  .card:hover .card-go{opacity:1;color:var(--accent);transform:translateX(2px)}

  /* ---------- 页脚 ---------- */
  .foot{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:clamp(22px,3.4vw,30px);
    padding-top:clamp(16px,2.4vw,20px);
    border-top:1px solid var(--line);
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .foot a{
    color:var(--ink-soft);
    text-decoration:none;
    border-radius:var(--radius-xs);
    transition:color .18s ease;
  }
  .foot a:hover{color:var(--accent)}
  .foot .sep{width:1px;height:12px;background:var(--line)}

  @supports (corner-shape: squircle){
    .card,
    .card-ico,
    .ghost-btn{
      corner-shape:squircle;
    }
  }

  @media (prefers-reduced-motion: reduce){
    body{transition:none}
    .card,.card-ico,.card-go,.ghost-btn,.foot a{transition:none}
    .card:hover{transform:none}
    .card:hover .card-go{transform:none}
  }

  @media (max-width:560px){
    .titlebar{height:42px;padding:0 12px;grid-template-columns:auto 1fr auto}
    .titlebar-title{justify-self:start;margin-left:4px;font-size:12.5px}
    .traffic{gap:6px}
    .traffic .dot{width:11px;height:11px}
    .card{grid-template-columns:38px 1fr;gap:13px;padding:14px}
    .card-ico{width:38px;height:38px}
    .card-ico svg{width:18px;height:18px}
    .card-go{display:none}
    .card-title{font-size:16px}
  }
</style>
</head>
<body>

<main class="page">
  <section class="window" role="region" aria-label="811 工具箱">

    <!-- 标题栏 -->
    <header class="titlebar">
      <div class="traffic" aria-hidden="true">
        <span class="dot close"></span>
        <span class="dot min"></span>
        <span class="dot max"></span>
      </div>

      <span class="titlebar-title">811 · Studio</span>

      <div class="titlebar-actions">
        <a class="ghost-btn" href="/Skills/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h10"/>
          </svg>
          <span>工具站</span>
        </a>
      </div>
    </header>

    <!-- 窗口内容 -->
    <div class="window-body">

      <header class="head">
        <p class="kicker">Class 8-11</p>
        <h1>811 工具箱</h1>
        <p class="subtitle">八年(11)班的日常都收在这儿：作业、课表，往后新做的小玩意也放这里。</p>
      </header>

      <section class="grid" id="tool-grid">
        <noscript>
          <p class="grid-empty">这份清单要用 JavaScript 渲染：
            <a href="/811/homework.html">作业</a> ·
            <a href="/811/classtable.html">课程表</a>
          </p>
        </noscript>
      </section>

      <footer class="foot">
        <a href="/">百宝箱首页</a>
        <span class="sep"></span>
        <a href="/Skills/">工具站</a>
        <span class="sep"></span>
        <a href="/p/docs.html">文档站</a>
      </footer>

    </div>

  </section>
</main>

<!-- 卡片模板 + 清单运行时：加工具只改 811/tools.json，不要动上面的 HTML（见 MANIFEST.md） -->
<template id="tpl-tool-card">
  <a class="card">
    <span class="card-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"></svg>
    </span>
    <span class="card-body">
      <span class="card-title"></span>
      <span class="card-desc"></span>
    </span>
    <span class="card-go" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13"/><path d="m13 6 6 6-6 6"/>
      </svg>
    </span>
  </a>
</template>

<script src="/lib/manifest.js"></script>
<script>
(function(){
  'use strict';

  const M = window.JSManifest;
  const grid = document.getElementById('tool-grid');

  function showEmpty(text){
    M.showEmpty(grid, text);
  }

  M.loadCollection('/811/tools.json', { collection: '811' }).then(function (col){
    M.logProblems(col.problems, '811');

    if (!col.ok){
      showEmpty('清单没加载出来，检查 tools.json 路径或用本地服务器打开。');
      return;
    }
    if (!col.items.length){ showEmpty('暂无工具'); return; }

    M.renderCards(grid, col.items, { template: '#tpl-tool-card' });
  });
})();
</script>

</body>
</html>
