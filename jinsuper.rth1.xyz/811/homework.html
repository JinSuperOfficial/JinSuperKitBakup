<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八年(11)班作业</title>
<style>
  :root{
    color-scheme: light dark;

    /* ---------- 浅色模式基准 ---------- */
    --bg:#F8F3EC;
    --paper:#FFFCF7;
    --ink:#2E2A26;
    --ink-soft:#6B635A;
    --oak:#8D6959;
    --olive:#8E9867;
    --clay:#D97757;
    --line:rgba(46,42,38,.12);
    --line-soft:rgba(46,42,38,.07);
    --check-mark:#FFFCF7;
    --done-text:#A9A29A;
    --empty-text:#B3ACA4;
    --foot-text:#A9A29A;
    --thead-bg:rgba(142,152,103,.07);
    --skeleton-1:rgba(46,42,38,.06);
    --skeleton-2:rgba(46,42,38,.11);
    --overlay:rgba(46,42,38,.34);
    --mark-bg:rgba(217,119,87,.13);
    --mark-border:rgba(217,119,87,.30);
    --cta-bg:#B0552F;
    --cta-bg-hover:#98462A;
    --shadow-1:rgba(46,42,38,.04);
    --shadow-2:rgba(46,42,38,.45);
    --shadow-3:rgba(46,42,38,.55);

    /* 动态色调（JS 按完成度重写）0% 冷灰蓝 → 100% 陶土橙 */
    --tint-accent: hsl(220 8% 60%);
    --tint-text:   hsl(220 8% 34%);
    --tint-soft:   hsl(220 8% 60% / .14);
    --tint-line:   hsl(220 8% 60% / .30);
    --tint-box:    hsl(220 8% 60% / .55);
    --tint-card:   hsl(220 8% 60% / .22);
    --tint-fill:   hsl(220 8% 60%);

    /* 背景光晕 */
    --glow-1: hsl(220 8% 60% / .16);
    --glow-2: hsl(220 8% 60% / .14);

    /* ---------- 圆角（macOS 风格：小半径 + 层级化 + 同心嵌套） ----------
       规范：.Skills/theme-plus/references/circle_angle.md
       默认 rounded-md / rounded-lg，窗口最多 rounded-xl，禁止 rounded-2xl / rounded-3xl
       以及按钮/输入框/卡片的 rounded-full；只有头像、开关、状态点才用胶囊。 */
    --radius-xs:4px;      /* 标签、徽章（≤6px） */
    --radius-sm:6px;      /* 小控件、行内代码块 */
    --radius-md:8px;      /* 按钮、输入框 */
    --radius-lg:10px;     /* 卡片、便签、浮层 */
    --radius-xl:12px;     /* 窗口、弹窗 */
    --radius-pill:999px;  /* 仅圆点、开关、状态标记 */

    --radius-control:var(--radius-md);
    --radius-button:var(--radius-md);
    --radius-card:var(--radius-lg);
    --radius-modal:var(--radius-xl);
    --radius-badge:var(--radius-sm);
    --radius-dot:var(--radius-pill);

    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }

  /* ---------- 深色模式（跟随系统） ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14120E;
      --paper:#1E1B17;
      --ink:#EDE7DF;
      --ink-soft:#A29A8E;
      --oak:#B89B85;
      --olive:#A8B57C;
      --clay:#E88B6D;
      --line:rgba(237,231,223,.14);
      --line-soft:rgba(237,231,223,.08);
      --check-mark:#1A1815;
      --done-text:#6B635A;
      --empty-text:#6B635A;
      --foot-text:#7A736A;
      --thead-bg:rgba(142,152,103,.12);
      --skeleton-1:rgba(237,231,223,.06);
      --skeleton-2:rgba(237,231,223,.12);
      --overlay:rgba(0,0,0,.60);
      --mark-bg:rgba(217,119,87,.20);
      --mark-border:rgba(217,119,87,.45);
      --cta-bg:#C9683D;
      --cta-bg-hover:#B0552F;
      --shadow-1:rgba(0,0,0,.40);
      --shadow-2:rgba(0,0,0,.70);
      --shadow-3:rgba(0,0,0,.80);

      --glow-1: hsl(220 12% 60% / .30);
      --glow-2: hsl(220 12% 60% / .26);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}

  /* ---------- 页面背景：四张底纹随机拼一条（见 JS 的 paintPageBg） ----------
     底色挪到 html 上、body 只留两团光晕 —— 这样 .bg 层（z-index:-1）
     才露得出来（body 上再压一层不透明底色的话它会整个被盖住）。 */
  html{ background-color:var(--bg); }

  body{
    min-height:100vh;
    background-image:
      radial-gradient(880px 520px at 12% -8%, var(--glow-1), transparent 62%),
      radial-gradient(760px 480px at 92% 4%, var(--glow-2), transparent 60%);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:clamp(28px,6vw,76px) clamp(16px,5vw,40px) clamp(48px,8vw,100px);
    transition:background-color .5s ease, color .3s ease;
  }

  /* 底纹层：四张 1:1 的图，单张按 tile 宽铺；屏幕比一张宽就接下一张，
     每张都向下平铺（repeat-y）。位置/尺寸由 JS 按视口宽度算。
     图片本身已经很淡，再压一层纸张薄纱 —— 只当纹理看，不抢正文。 */
  .bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-repeat:repeat-y;
    background-position:0 0;
    background-size:var(--bg-tile,720px) auto;
  }
  .bg::after{
    content:''; position:absolute; inset:0;
    background:color-mix(in srgb, var(--bg) var(--bg-veil,62%), transparent);
  }
  @media (prefers-color-scheme: dark){
    /* 深色下底图还是浅色纸，必须压得更狠，不然浅底 + 浅字没法看 */
    .bg::after{ --bg-veil:90%; }
  }

  /* 游戏壁纸（整张 cover 铺满）：比四张底纹花得多，纱要厚一点 ——
     直接压在页面底色上的小字（meta / foot）才稳过 4.5:1。
     （class 由 JS 按当前档位加减，见「页面背景」一节。） */
  .bg.is-cover::after{ --bg-veil:70%; }
  @media (prefers-color-scheme: dark){
    .bg.is-cover::after{ --bg-veil:92%; }
  }

  .page{max-width:820px;margin:0 auto}

  /* ---------- 头部 ---------- */
  .head{margin-bottom:clamp(22px,3.6vw,36px)}
  .head-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }

  /* 头部右上角：切换背景 + 更多工具，两个按钮同排，窄屏自动换行 */
  .head-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--oak);
    margin-bottom:0;
  }
  .kicker::before{
    content:"";
    width:26px;height:1px;
    background:var(--tint-accent);
    flex:none;
    transition:background .5s ease;
  }

  /* ---------- 更多 811 工具（跳 /811/index.html） ---------- */
  .more-btn{
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    min-height:34px;
    padding:0 14px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--tint-soft);
    color:var(--tint-text);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.03em;
    text-decoration:none;
    white-space:nowrap;
    transition:
      background .22s ease,
      border-color .22s ease,
      color .22s ease,
      transform .15s ease;
  }
  .more-btn svg{width:15px;height:15px;flex:none}
  .more-btn:hover{
    background:var(--tint-card);
    border-color:var(--tint-accent);
    color:var(--ink);
    transform:translateY(-1px);
  }
  .more-btn:active{transform:translateY(0) scale(.985)}
  .more-btn:focus-visible{outline:2px solid var(--tint-accent);outline-offset:3px}

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(27px,5.4vw,42px);
    line-height:1.26;
    letter-spacing:-.01em;
  }

  /* ---------- 子标题（来自 JSON 的 title） ---------- */
  .subtitle{
    margin-top:12px;
    padding-left:13px;
    border-left:2px solid var(--tint-accent);
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(14px,2.2vw,17px);
    line-height:1.65;
    letter-spacing:.03em;
    color:var(--ink-soft);
    white-space:pre-line;
    word-break:break-word;
    transition:border-color .5s ease, color .3s ease;
  }
  .subtitle[hidden]{display:none}

  .meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:16px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .meta .sep{width:1px;height:12px;background:var(--line)}

  /* ---------- 进度条 ---------- */
  .progress-track{
    margin-top:16px;
    height:5px;
    border-radius:var(--radius-xs);
    background:rgba(46,42,38,.08);
    overflow:hidden;
  }
  @media (prefers-color-scheme: dark){
    .progress-track{ background:rgba(237,231,223,.10); }
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:var(--radius-xs);
    background:var(--tint-fill);
    transition:
      width .5s cubic-bezier(.2,.7,.2,1),
      background .5s ease;
  }

  /* ---------- 进度徽章 ---------- */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:4px 12px;
    border-radius:var(--radius-badge);
    background:var(--tint-soft);
    border:1px solid var(--tint-line);
    color:var(--tint-text);
    font-size:12.5px;
    letter-spacing:.02em;
    transition:
      background .5s ease,
      border-color .5s ease,
      color .5s ease;
  }
  .badge.all-done{
    font-weight:500;
    letter-spacing:.05em;
  }

  /* 完成 ≥ 80% 且未全部完成 → 兴奋颤抖 */
  @keyframes excited-shake{
    0%, 60%, 100%{ transform:translate3d(0,0,0) rotate(0deg); }
    64%{ transform:translate3d(-2.4px,.8px,0) rotate(-1.2deg); }
    68%{ transform:translate3d(2.4px,-.8px,0) rotate(1.2deg); }
    72%{ transform:translate3d(-2px,.6px,0) rotate(-1deg); }
    76%{ transform:translate3d(1.8px,-.6px,0) rotate(.9deg); }
    80%{ transform:translate3d(-1.4px,.4px,0) rotate(-.7deg); }
    84%{ transform:translate3d(1.1px,-.4px,0) rotate(.55deg); }
    88%{ transform:translate3d(-.7px,.2px,0) rotate(-.35deg); }
    92%{ transform:translate3d(.4px,-.15px,0) rotate(.2deg); }
  }
  .badge.excited{
    animation:excited-shake 3.2s cubic-bezier(.4,0,.2,1) infinite;
    will-change:transform;
  }
  @media (prefers-reduced-motion: reduce){
    .badge.excited{ animation:none; }
    .progress-fill{ transition:none; }
  }

  /* ---------- 提示条 ---------- */
  .notice{
    display:none;
    align-items:flex-start;
    gap:11px;
    padding:14px 18px;
    margin-bottom:18px;
    border-radius:var(--radius-card);
    background:rgba(192,138,62,.11);
    border:1px solid rgba(192,138,62,.28);
    color:#7A5619;
    font-size:13.5px;
    line-height:1.75;
  }
  @media (prefers-color-scheme: dark){
    .notice{
      background:rgba(192,138,62,.16);
      border-color:rgba(192,138,62,.36);
      color:#E0B57A;
    }
  }
  .notice.show{display:flex}
  .notice .ico{flex:none;font-size:15px;line-height:1.5}
  .notice code{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;
    background:rgba(122,86,25,.10);
    padding:1px 6px;
    border-radius:var(--radius-xs);
  }
  @media (prefers-color-scheme: dark){
    .notice code{ background:rgba(224,181,122,.14); }
  }

  /* ---------- 表格卡片 ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--tint-card);
    border-radius:var(--radius-card);
    overflow:hidden;
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 26px 52px -34px var(--shadow-2);
    transition:border-color .5s ease, background .3s ease, box-shadow .3s ease;
  }

  table{width:100%;border-collapse:collapse}

  thead th{
    text-align:left;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--oak);
    padding:15px clamp(16px,2.6vw,26px);
    background:var(--thead-bg);
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    transition:background .3s ease, border-color .3s ease, color .3s ease;
  }
  thead th:first-child{width:132px}

  tbody td{
    padding:clamp(15px,2.2vw,20px) clamp(16px,2.6vw,26px);
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
    transition:border-color .3s ease;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .22s}
  tbody tr:hover{background:rgba(142,152,103,.045)}
  @media (prefers-color-scheme: dark){
    tbody tr:hover{background:rgba(142,152,103,.06)}
  }

  .subject{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-family:var(--serif);
    font-size:15.5px;
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .subject .dot{
    width:9px;height:9px;
    border-radius:var(--radius-dot);
    background:var(--c);
    flex:none;
    box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent);
    transition:filter .3s ease;
  }
  @media (prefers-color-scheme: dark){
    .subject .dot{ filter:brightness(1.15) saturate(1.05); }
  }

  /* ---------- 科目背景图（可以没有，没有也好看） ----------
     图由脚本登记（见 JS 里的 HW_ART）→ /asset/homework/*.jpg，1:1 方图。
     这里只管怎么摆。从下往上三层，缺任何一层都有下一层接着：

       1) background-color  --hw-tint  科目色混纸张   ← 图没来 / 图挂了 / 高对比度模式
       2) --hw-img          科目背景图（cover 裁切）
       3) --hw-scrim        顶部纸张渐变               ← 科目名压在图上也要够对比

     自动拓展出来的科目（EXTRA_COLORS 那套）没有图，落在第 1 层，
     不需要为它们改 CSS。 */
  :root{
    --hw-scrim: linear-gradient(180deg,
      color-mix(in srgb, var(--paper) 90%, transparent) 0%,
      color-mix(in srgb, var(--paper) 54%, transparent) 36%,
      color-mix(in srgb, var(--paper) 8%,  transparent) 100%);
  }
  tbody tr{
    /* 半透明：行 hover 的高亮还能透出来（纸张色在 .card 上，底下是同一张纸） */
    --hw-tint: color-mix(in srgb, var(--c, var(--olive)) 13%, transparent);
  }
  tbody td:first-child{
    background-color: var(--hw-tint);
    background-image:
      var(--hw-scrim, none),
      var(--hw-img, none);
    background-repeat: no-repeat, no-repeat;
    background-position: center top, center center;
    background-size: 100% 100%, cover;
  }
  /* 脚本探到图不在盘上 → 撤掉那一层，退回「底色 + 科目色点纹」 */
  tbody tr.hw-noimg{ --hw-img: none; }
  tbody tr.hw-noimg td:first-child{
    background-image:
      var(--hw-scrim, none),
      radial-gradient(color-mix(in srgb, var(--c, var(--olive)) 20%, transparent) 1px, transparent 1.4px);
    background-repeat: no-repeat, repeat;
    background-size: 100% 100%, 9px 9px;
  }
  /* 要更高对比度 / 要打印：留底色，别让图掺进来 */
  @media (prefers-contrast: more){
    tbody td:first-child{ background-image: none; }
  }
  @media print{
    tbody td:first-child{ background-image: none; }
  }

  .hw-list{list-style:none;display:grid;gap:11px}

  .hw-item{
    display:flex;
    align-items:flex-start;
    gap:11px;
    cursor:pointer;
    padding:2px 0;
    border-radius:var(--radius-sm);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .hw-item:focus-visible{
    outline:2px solid var(--tint-accent);
    outline-offset:3px;
  }

  .box{
    flex:none;
    width:17px;height:17px;
    margin-top:4px;
    border:1.5px solid var(--tint-box);
    border-radius:var(--radius-xs);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:
      background .2s,
      border-color .5s ease,
      transform .2s;
  }
  .box svg{
    width:10px;height:10px;
    opacity:0;
    transform:scale(.6);
    transition:opacity .18s, transform .18s;
  }
  .box svg path{ stroke:var(--check-mark); }
  .hw-item:hover .box{border-color:var(--tint-accent)}
  .hw-item.done .box{background:var(--olive);border-color:var(--olive)}
  .hw-item.done .box svg{opacity:1;transform:scale(1)}
  .hw-item:active .box{transform:scale(.9)}

  .text{
    font-size:15px;
    line-height:1.78;
    color:var(--ink);
    white-space:pre-line;
    transition:color .22s;
    word-break:break-word;
    min-width:0;
  }
  .hw-item.done .text{
    color:var(--done-text);
    text-decoration:line-through;
    text-decoration-thickness:1px;
    text-decoration-color:currentColor;
  }
  
  /* 新增：支持 Markdown 行内元素渲染 */
  .text strong { font-weight: 600; }
  .text code { 
    font-family: "SF Mono", Menlo, Consolas, monospace; 
    font-size: 0.9em; 
    background: rgba(142,152,103,.1); 
    padding: 2px 5px; 
    border-radius: var(--radius-xs); 
  }

  .empty{font-size:14.5px;color:var(--empty-text);letter-spacing:.04em}

  /* 骨架屏 */
  .skeleton{
    height:15px;
    border-radius:var(--radius-sm);
    background:linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
    background-size:200% 100%;
    animation:shimmer 1.3s ease-in-out infinite;
  }
  .skeleton + .skeleton{margin-top:11px}
  @keyframes shimmer{
    0%{background-position:180% 0}
    100%{background-position:-80% 0}
  }

  /* ---------- 便签（Notes） ---------- */
  .note{
    position:relative;
    margin-top:18px;
    padding:14px 18px 15px 22px;
    background:#FDF7D9;
    border:1px solid rgba(190,155,65,.28);
    border-radius:var(--radius-card);
    box-shadow:
      0 1px 2px rgba(150,120,40,.06),
      0 8px 20px -14px rgba(150,120,40,.30);
    transition:background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .note[hidden]{ display:none; }

  .note::before{
    content:"";
    position:absolute;
    left:0; top:12px; bottom:12px;
    width:3px;
    border-radius:0 var(--radius-xs) var(--radius-xs) 0;
    background:#E8C560;
    transition:background .3s ease;
  }

  .note-label{
    display:inline-block;
    font-size:10px;
    font-weight:500;
    letter-spacing:.20em;
    text-transform:uppercase;
    color:#9C7B2A;
    margin-bottom:5px;
  }

  .note-text{
    font-size:14.5px;
    line-height:1.75;
    color:#5C4A1C;
    white-space:pre-line;
    word-break:break-word;
  }

  /* 新增：笔记支持 Markdown 表格及列表样式 */
  .note-text p { margin-bottom: 6px; }
  .note-text p:last-child { margin-bottom: 0; }
  .note-text ul { padding-left: 20px; margin-bottom: 6px; }
  .note-text table { 
    border-collapse: collapse; 
    width: 100%; 
    margin: 10px 0; 
    font-size: 14px;
  }
  .note-text th, .note-text td { 
    border: 1px solid rgba(190,155,65,.28); 
    padding: 6px 12px; 
    text-align: left; 
    color: #5C4A1C;
  }
  .note-text th { background: rgba(232, 197, 96, 0.15); font-weight: 500; }

  @media (prefers-color-scheme: dark){
    .note{
      background:#2A2414;
      border-color:rgba(200,170,80,.22);
      box-shadow:
        0 1px 2px rgba(0,0,0,.30),
        0 8px 20px -14px rgba(0,0,0,.60);
    }
    .note::before{ background:#C9A84C; }
    .note-label{ color:#C9A84C; }
    .note-text{ color:#E8DBA8; }
    .note-text th, .note-text td { 
      border-color: rgba(200,170,80,.22); 
      color: #E8DBA8;
    }
    .note-text th { background: rgba(201, 168, 76, 0.1); }
    .note-text code { background: rgba(224,181,122,.14); }
  }

  .foot{
    margin-top:22px;
    text-align:center;
    font-size:12.5px;
    color:var(--foot-text);
    letter-spacing:.06em;
  }

  /* ---------- 恭喜弹窗 ---------- */
  .congrats{
    position:fixed;
    inset:0;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--overlay);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, visibility 0s linear .22s, background .3s ease;
  }
  .congrats.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity .22s ease, visibility 0s, background .3s ease;
  }

  .congrats-card{
    width:min(360px,100%);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-modal);
    padding:clamp(26px,5.4vw,34px);
    text-align:center;
    box-shadow:0 30px 64px -32px var(--shadow-3);
    transform:translateY(14px) scale(.97);
    transition:transform .3s cubic-bezier(.2,.7,.2,1), background .3s ease, border-color .3s ease;
  }
  .congrats.show .congrats-card{transform:none}

  .congrats-mark{
    width:54px;height:54px;
    margin:0 auto 16px;
    border-radius:var(--radius-dot);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--mark-bg);
    border:1px solid var(--mark-border);
    transition:background .3s ease, border-color .3s ease;
  }
  .congrats-mark svg{width:24px;height:24px}

  .congrats-title{
    font-family:var(--serif);
    font-weight:500;
    font-size:20px;
    line-height:1.4;
    letter-spacing:.02em;
    color:var(--ink);
  }

  .congrats-text{
    margin-top:9px;
    font-size:14px;
    line-height:1.8;
    color:var(--ink-soft);
    white-space:pre-line;
    word-break:break-word;
  }

  /* 彩蛋模式：弹窗整体冷下来，和喜庆版形成反差 */
  .congrats.easter .congrats-mark{
    background:rgba(120,120,120,.13);
    border-color:rgba(120,120,120,.30);
  }
  .congrats.easter .congrats-mark svg path{
    stroke:#8C8C8C;
  }
  .congrats.easter .congrats-title{
    color:var(--ink-soft);
    font-weight:400;
  }
  .congrats.easter .congrats-text{
    color:var(--ink-soft);
    font-style:italic;
  }
  .congrats.easter .congrats-btn{
    background:#5A5A5A;
  }
  .congrats.easter .congrats-btn:hover{
    background:#4A4A4A;
  }

  .congrats-btn{
    margin-top:22px;
    min-height:44px;
    padding:0 28px;
    border:0;
    border-radius:var(--radius-button);
    background:var(--cta-bg);
    color:#FFFCF7;
    font-family:inherit;
    font-size:14.5px;
    letter-spacing:.05em;
    cursor:pointer;
    transition:background .18s ease, transform .15s ease;
  }
  .congrats-btn:hover{background:var(--cta-bg-hover);transform:translateY(-1px)}
  .congrats-btn:active{transform:translateY(0) scale(.98)}
  .congrats-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* ---------- 更新日志（悬浮窗） ----------
     数据在 /811/data/hwk-log/（和 homework.json 同级）：
       index.json = 目录，每条日志一个文件 —— 页面只读，从不写、也不改历史。
     样式和「恭喜弹窗」同一套：遮罩 + 纸卡片，这里左边多一列日期、右边是正文。 */
  .logwin{
    position:fixed;
    inset:0;
    z-index:70;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,3.4vw,30px);
    background:var(--overlay);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, visibility 0s linear .22s, background .3s ease;
  }
  .logwin.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity .22s ease, visibility 0s, background .3s ease;
  }

  .logwin-card{
    width:min(720px,100%);
    max-height:min(80vh,700px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-modal);
    box-shadow:0 30px 64px -32px var(--shadow-3);
    transform:translateY(12px) scale(.98);
    transition:transform .3s cubic-bezier(.2,.7,.2,1), background .3s ease, border-color .3s ease;
  }
  .logwin.show .logwin-card{transform:none}

  .logwin-head{
    flex:none;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 12px 13px 18px;
    background:var(--thead-bg);
    border-bottom:1px solid var(--line);
    transition:background .3s ease, border-color .3s ease;
  }
  .logwin-head .ico{width:16px;height:16px;flex:none;color:var(--oak)}
  .logwin-title{
    font-family:var(--serif);
    font-weight:500;
    font-size:15.5px;
    letter-spacing:.06em;
    color:var(--ink);
  }
  .logwin-count{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
  .logwin-close{
    margin-left:auto;
    flex:none;
    width:30px;height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid transparent;
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .logwin-close:hover{background:var(--tint-soft);border-color:var(--tint-line);color:var(--ink)}
  .logwin-close:active{transform:scale(.94)}
  .logwin-close:focus-visible{outline:2px solid var(--tint-accent);outline-offset:2px}
  .logwin-close svg{width:14px;height:14px}

  .logwin-body{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:186px minmax(0,1fr);
  }

  .logwin-list{
    min-height:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:10px;
    border-right:1px solid var(--line-soft);
  }
  .log-item{
    display:flex;
    flex-direction:column;
    gap:2px;
    width:100%;
    text-align:left;
    padding:8px 10px;
    border:1px solid transparent;
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    line-height:1.5;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .log-item .d{font-size:11px;letter-spacing:.06em;color:var(--oak)}
  .log-item:hover{background:var(--tint-soft);color:var(--ink)}
  .log-item[aria-selected="true"]{
    background:var(--tint-soft);
    border-color:var(--tint-line);
    color:var(--ink);
  }
  .log-item:focus-visible{outline:2px solid var(--tint-accent);outline-offset:1px}

  .logwin-detail{
    min-height:0;
    overflow:auto;
    padding:18px clamp(16px,2.6vw,24px) 24px;
    outline:none;
  }
  .logwin-detail:focus-visible{outline:2px solid var(--tint-accent);outline-offset:-2px}

  .log-h{
    font-family:var(--serif);
    font-weight:500;
    font-size:19px;
    line-height:1.45;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .log-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:9px;
    padding-bottom:13px;
    border-bottom:1px solid var(--line-soft);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .log-ver{
    padding:2px 8px;
    border-radius:var(--radius-badge);
    background:var(--mark-bg);
    border:1px solid var(--mark-border);
    color:var(--clay);
    font-size:11.5px;
    letter-spacing:.06em;
  }
  .log-tag{
    padding:2px 8px;
    border-radius:var(--radius-badge);
    background:var(--tint-soft);
    border:1px solid var(--tint-line);
    color:var(--tint-text);
    font-size:11.5px;
  }
  .log-sum{margin-top:11px;font-size:14px;line-height:1.8;color:var(--ink-soft)}
  .log-sec{margin-top:16px}
  .log-sec h4{
    margin-bottom:7px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--oak);
  }
  .log-sec ul{list-style:none;display:grid;gap:6px}
  .log-sec li{
    position:relative;
    padding-left:16px;
    font-size:14px;
    line-height:1.75;
    color:var(--ink);
    word-break:break-word;
  }
  .log-sec li::before{
    content:"";
    position:absolute;
    left:2px; top:.62em;
    width:5px;height:5px;
    border-radius:var(--radius-dot);
    background:var(--tint-accent);
  }
  .log-sec li code,.log-sum code,.log-note code{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:.9em;
    background:rgba(142,152,103,.1);
    padding:1px 5px;
    border-radius:var(--radius-xs);
  }
  .log-note{
    margin-top:16px;
    padding:11px 14px;
    border-left:2px solid var(--tint-accent);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    background:var(--tint-soft);
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink-soft);
  }
  .log-state{
    padding:26px 4px;
    text-align:center;
    font-size:13.5px;
    line-height:1.8;
    color:var(--empty-text);
    letter-spacing:.04em;
  }

  @media (max-width:640px){
    .logwin-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .logwin-list{
      flex-direction:row;
      gap:6px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:9px 10px;
      border-right:0;
      border-bottom:1px solid var(--line-soft);
    }
    .log-item{flex:none;width:auto;max-width:190px}
  }
  @media (prefers-reduced-motion: reduce){
    .logwin{transition-duration:1ms}
    .logwin-card{transition:none}
    .log-item,.logwin-close{transition:none}
  }

  /* ---------- 连续曲率：支持时启用 squircle，不支持就退回小半径 ---------- */
  @supports (corner-shape: squircle){
    .card,
    .note,
    .notice,
    .congrats-card,
    .congrats-btn,
    .more-btn,
    .badge,
    .box,
    .hw-item,
    .logwin-card,
    .log-item,
    .logwin-close,
    .skeleton{
      corner-shape:squircle;
    }
  }

  /* ---------- 彩蛋：全屏书堆底图 + 两侧竖排字 ----------
     默认 opacity:0 + visibility:hidden（不用 display:none —— 那样没法淡入），
     命中条件时 JS 给这个容器加上 .show-easter-egg → 1.5s 淡入。

     它是**底图层**（z-index:-1，在 .bg 之后所以盖住随机底纹、在正文之下）：
     书堆只占四边，正中留白让作业卡片照常浮在上面，字也贴着左右边缘，
     所以彩蛋出现时作业依然完全可读。
     字一律 HTML + CSS 叠上去，绝不让 AI 往图里画字（中文必糊）。 */
  .easter{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    opacity:0; visibility:hidden;
    transition:opacity 1.5s ease, visibility 0s linear 1.5s;
    background:
      url('../asset/homework/egg_background.jpg') center / cover no-repeat,
      var(--bg);
  }
  .easter.show-easter-egg{
    opacity:1; visibility:visible;
    transition:opacity 1.5s ease, visibility 0s;
  }
  /* 深色模式：底图还是浅色纸，压一层深色薄纱，免得浅字压浅底 */
  .easter::after{
    content:''; position:absolute; inset:0; z-index:0;
    background:color-mix(in srgb, var(--bg) var(--egg-veil,0%), transparent);
  }
  @media (prefers-color-scheme: dark){
    .easter::after{ --egg-veil:88%; }
  }

  /* 竖排字：贴着左右边缘、落在四周的书堆上，中间大片留白留给作业卡片 */
  .easter-text{
    position:absolute; z-index:1; top:50%; transform:translateY(-50%);
    margin:0;
    writing-mode:vertical-rl;
    font-family:var(--serif);
    font-size:clamp(16px,2.6vw,24px);
    letter-spacing:.34em;
    /* 浅色下就是规范里点名的 #8D6959 / #D97757；深色下自动换成亮一档的 */
    color:var(--oak);
    text-shadow:
      0 1px 6px color-mix(in srgb, var(--bg) 92%, transparent),
      0 0 16px color-mix(in srgb, var(--bg) 78%, transparent);
  }
  .easter-text.left{ left:clamp(14px,3.4vw,58px); }
  .easter-text.right{ right:clamp(14px,3.4vw,58px); color:var(--clay); }
  @media (prefers-color-scheme: dark){
    .easter-text.left{ color:#EBD8C4; }
    .easter-text.right{ color:#F0A98F; }
  }

  /* 屏太矮：字缩小，别顶出屏幕 */
  @media (max-height:520px){
    .easter-text{ font-size:13.5px; letter-spacing:.2em; }
  }

  @media (prefers-reduced-motion: reduce){
    .congrats{transition-duration:1ms}
    .congrats-card{transition-duration:1ms}
    .more-btn{transition:none}
    .more-btn:hover{transform:none}
    tbody tr{transition:none}
    .note{transition:none}
    .easter{transition-duration:1ms}
  }

  @media (max-width:600px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tbody tr{
      border-bottom:1px solid var(--line);
      padding:6px 0 12px;
    }
    tbody tr:last-child{border-bottom:none}
    tbody td{border:none;padding:6px clamp(16px,5vw,22px)}
    tbody td:first-child{padding-top:16px;padding-bottom:2px}
    tbody td:last-child{padding-bottom:16px}
    .subject{font-size:14.5px}
    /* 窄屏：科目格子从「竖条」变成「窄横幅」，图跟着换裁切 */
    tbody tr[data-subject] td:first-child{
      min-height:86px;
      padding-top:15px;
      padding-bottom:12px;
    }
  }
</style>
</head>
<body>

<!-- 页面底纹层：档位由 JS 决定 —— 默认是四张 bg_*.jpg 随机拼一条；
     data/homework.json 里写 "bg" 可以指定「游戏-MC / 游戏-UT / 彩蛋」等（见「页面背景」一节）；
     右上角「切换背景」按钮可在本机覆盖。 -->
<div class="bg" id="bgLayer" aria-hidden="true"></div>

<main class="page">

  <header class="head">
    <div class="head-top">
      <p class="kicker">Homework · 每日清单</p>

      <div class="head-acts">
        <!-- ★ 切换页面背景：默认(跟随 JSON) → 网格 → 水墨 → 地图 → 植物 → 游戏-MC → 游戏-UT → 默认
             彩蛋不在这一圈里（只有 homework.json 写 "bg":"egg" 才会亮） -->
        <button class="more-btn" id="bgBtn" type="button" title="点一下换一张背景">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
            <path d="M3.5 15.5 9 10l4.5 4.5L17 11l3.5 3.5"/>
            <circle cx="9" cy="8" r="1.4"/>
          </svg>
          <span id="bgBtnText">背景：随机</span>
        </button>

        <!-- ★ 更新日志 → 悬浮窗里读 /811/data/hwk-log/（只读，不改历史） -->
        <button class="more-btn" id="logBtn" type="button" title="这个页面改过什么">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.9 9.1A8.6 8.6 0 1 1 3.9 14.9"/>
            <path d="M3.3 5.1v4.2h4.2"/>
            <path d="M12 8.4V12l2.7 1.7"/>
          </svg>
          <span>更新日志</span>
        </button>

        <!-- ★ 更多 811 工具 → /811/index.html -->
        <a class="more-btn" href="/811/index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
          </svg>
          <span>更多811工具</span>
        </a>
      </div>
    </div>

    <h1>八年(11)班作业</h1>

    <!-- ★ 子标题：来自 JSON 的 "title" 字段；没有就不显示 -->
    <p class="subtitle" id="subtitle" hidden></p>

    <div class="meta">
      <span id="dateText">—</span>
      <span class="sep"></span>
      <span id="progressText" aria-live="polite" aria-atomic="true">加载中…</span>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </header>

  <div class="notice" id="notice">
    <span class="ico">🍂</span>
    <span id="noticeText"></span>
  </div>

  <section class="card">
    <table>
      <thead>
        <tr>
          <th>科目</th>
          <th>内容</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr>
          <td><div class="skeleton" style="width:52px"></div></td>
          <td>
            <div class="skeleton" style="width:82%"></div>
            <div class="skeleton" style="width:64%"></div>
          </td>
        </tr>
        <tr>
          <td><div class="skeleton" style="width:52px"></div></td>
          <td><div class="skeleton" style="width:70%"></div></td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- 便签：从 JSON 的 "笔记" 键读取；没有就不显示 -->
  <div class="note" id="note" hidden>
    <span class="note-label">Notes</span>
    <div class="note-text" id="noteText"></div>
  </div>

  <p class="foot">点一下前面的方框，就能打勾 ✦ 勾完自动保存</p>

</main>

<!-- ★ 彩蛋底图：默认隐藏（.easter 是 opacity:0 + visibility:hidden），
     命中条件时 JS 加 .show-easter-egg → 1.5s 淡入。
     它是 z-index:-1 的**底图层**（盖住随机底纹、在作业卡片之下）：
     书堆只占四边，正中留白，所以作业照常浮在上面、完全可读。
     字是 HTML 叠上去的竖排文本，不靠 AI 画。 -->
<div class="easter" id="easterEgg" aria-hidden="true">
  <p class="easter-text left">恭喜你看到了个彩蛋</p>
  <p class="easter-text right">希望你可以写完作业</p>
</div>

<div class="congrats" id="congrats" role="dialog" aria-modal="true"
     aria-labelledby="congratsTitle" aria-describedby="congratsText">
  <div class="congrats-card">
    <span class="congrats-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4.5 12.5 9.5 17.5 19.5 6.5" stroke="#D97757" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <h2 class="congrats-title" id="congratsTitle">今日作业...已清零!好样的伙计!</h2>
    <p class="congrats-text" id="congratsText">WONDERFUL！</p>
    <button class="congrats-btn" id="congratsBtn" type="button">朕知晓了</button>
  </div>
</div>

<!-- ★ 更新日志悬浮窗：数据在 /811/data/hwk-log/（和 homework.json 同级），
     index.json 是目录、每条日志一个文件。页面**只读** —— 从不写日志，也不改历史条目。 -->
<div class="logwin" id="logWin" role="dialog" aria-modal="true" aria-labelledby="logWinTitle">
  <div class="logwin-card">
    <div class="logwin-head">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.9 9.1A8.6 8.6 0 1 1 3.9 14.9"/>
        <path d="M3.3 5.1v4.2h4.2"/>
        <path d="M12 8.4V12l2.7 1.7"/>
      </svg>
      <span class="logwin-title" id="logWinTitle">更新日志</span>
      <span class="logwin-count" id="logCount"></span>
      <button class="logwin-close" id="logClose" type="button" aria-label="关闭更新日志">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="logwin-body">
      <div class="logwin-list" id="logList" role="tablist" aria-orientation="vertical"
           aria-label="日志日期"></div>
      <div class="logwin-detail" id="logDetail" role="tabpanel" tabindex="0"></div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============ 基础科目配置（固定 5 科，顺序不变） ============ */
  const BASE_SUBJECTS = [
    { name:'语文', color:'#D97757', keys:['语文','chinese','yuwen'] },
    { name:'数学', color:'#8E9867', keys:['数学','math','shuxue'] },
    { name:'英语', color:'#8D6959', keys:['英语','english','yingyu'] },
    { name:'科学', color:'#6E8B8B', keys:['科学','science','kexue'] },
    { name:'社会', color:'#C08A3E', keys:['社会','social','shehui'] }
  ];

  /* ============ 科目背景图 ============
     图放 /asset/homework/，1:1 方图，1024×1024。
     只在这里登记一次（CSS 只管怎么摆）；没登记的科目就没有图，只拿底色。
     图不在盘上时 probeSubjectArt() 会给那一行加 .hw-noimg，
     CSS 换成「底色 + 点纹」——不会开天窗，也不会一直报 404。 */
  const HW_ART = {
    '语文': '../asset/homework/chinese.jpg',
    '数学': '../asset/homework/math.jpg',
    '英语': '../asset/homework/english.jpg',
    '科学': '../asset/homework/science.jpg',
    '社会': '../asset/homework/social.jpg'
  };

  /* 行的内联样式：科目色 + （有图才有的）背景图变量 */
  function subjectStyle(sub){
    const url = HW_ART[sub.name];
    return `--c:${sub.color}` + (url ? `;--hw-img:url('${url}')` : '');
  }

  const artProbed = {};
  function probeSubjectArt(){
    Object.keys(HW_ART).forEach(name => {
      if(artProbed[name]) return;
      artProbed[name] = true;
      const img = new Image();
      img.onerror = () => {
        tbody.querySelectorAll('tr[data-subject]').forEach(tr => {
          if(tr.dataset.subject === name) tr.classList.add('hw-noimg');
        });
      };
      img.src = HW_ART[name];
    });
  }

  /* ============ 自动拓展科目的配色循环池 ============ */
  const EXTRA_COLORS = [
    '#A47864', // 摩卡慕斯
    '#6B7D5A', // 砂绿
    '#3A6B8C', // 石青
    '#C43A2A', // 朱砂红
    '#C9A84C', // 描金
    '#539DB6', // 泳池蓝
    '#7EC8C8', // 薄荷蓝
    '#B35A3E', // 锈红
    '#8E6B9E', // 灰紫
    '#E8703A', // 生动橙
    '#AEB73A', // 酸性绿
    '#2D4A3E'  // 森林绿
  ];

  /* ★ 保留字：title / id / bg 也被占用了，别当成科目 */
  const RESERVED_KEYS = ['笔记', 'date', 'homework', 'title', 'id', 'bg'];

  function isKnownKey(key){
    const lower = String(key).toLowerCase();
    for(const rk of RESERVED_KEYS){
      if(String(rk).toLowerCase() === lower) return true;
    }
    for(const sub of BASE_SUBJECTS){
      for(const alias of sub.keys){
        if(String(alias).toLowerCase() === lower) return true;
      }
    }
    return false;
  }

  function collectExtraSubjects(src){
    const extras = [];
    Object.keys(src).forEach(key => {
      if(isKnownKey(key)) return;
      extras.push({
        name: key,
        color: EXTRA_COLORS[extras.length % EXTRA_COLORS.length],
        keys: [key]
      });
    });
    return extras;
  }

  const PATHS = ['./data/homework.json', '/811/data/homework.json', '/data/homework.json'];

/*         读取失败显示的默认作业          */
  const DEMO = {
    'id':    'demo',
    'title': '示例清单 · 请把 homework.json 放到 data/ 文件夹',
    '笔记':  '家庭的作业非常好完成啊',
    '语文':  '写一篇能把孔子吓死的文言文',
    '数学':  '算完圆周率\n随便选一个数学未解之谜求解并且发在论文平台',
    '英语':  '完成中美签证\n背诵蛋白质英文和贝多芬全名',
    '科学':  '将自己的DNA打散然后重组一次\n复活任意名字作为单位的科学家',
    '社会':  '当上美国总统\n当上日本首相\n当上俄罗斯沙皇\n测量地球表面积'
  };

  /* ============ 页面背景 ============
     三处来源，优先级从低到高：
       ① data/homework.json 的 "bg" 字段（站点作者说了算）
       ② 右上角「切换背景」按钮（只覆盖本机，记在 localStorage）
       ③ 都没有 → 默认：四张底纹随机拼一条（老行为，一点没变）

     JSON 的 "bg" 认这些值（大小写、空格都不敏感）：
       ""/不写/"default"/"auto"/"随机"   默认 —— 四张底纹随机拼一条
       "game-mc"                        游戏-MC —— MC 风格壁纸，按视口自动挑最接近的一档
       "game-ut"                        游戏-UT —— UT 那张壁纸，单张 cover 自适应
       "egg"                            彩蛋（**只有显式写才亮**；不再随机触发，也不进切换表）
       "bg_grid"/"bg_ink"/"bg_map"/"bg_botanical"  旧的四张（保留可用）
     不认识的值 → 按默认处理，并在控制台提醒一句。

     图都在 **项目根 asset/background/**（部署时镜像进 dist/asset/，见 project.md §10.3）：
       · MC：asset/background/mc/<宽x高>/wallpaper.png —— 一个尺寸一个文件夹，
             加一档 = 丢个「宽x高」文件夹（里面叫 wallpaper.png）+ 在 MC_SIZES 里加一行
       · UT：asset/background/ut.png —— 单张，cover 自适应
     页面路径从 /811/homework.html 出发，所以是 ../asset/background/… */
  const BG_SLUGS = ['bg_grid', 'bg_ink', 'bg_map', 'bg_botanical'];
  const BG_TILE_MAX = 720;                        /* 单张底纹最多铺这么宽 */
  const BG_KEY = 'homework.bg';                   /* 记住本机手动选的那一档 */
  const TILE_BASE = '../asset/homework/';         /* 四张底纹 */
  const BG_BASE   = '../asset/background/';       /* 游戏壁纸 */
  const UT_URL    = BG_BASE + 'ut.png';

  /* MC 的尺寸档（文件夹名就是「宽x高」） */
  const MC_SIZES = [
    { w:1080, h:1920 },
    { w:1920, h:1080 },
    { w:2048, h:2048 },
    { w:2058, h:1440 },
    { w:2560, h:1440 }
  ];
  const mcUrl = s => `${BG_BASE}mc/${s.w}x${s.h}/wallpaper.png`;

  /* JSON 的值 → 内部档位 */
  const BG_ALIAS = {
    '': 'auto', 'auto': 'auto', 'default': 'auto', 'dafault': 'auto',
    '默认': 'auto', '随机': 'auto',
    'game-mc': 'game-mc', 'gamemc': 'game-mc', 'mc': 'game-mc', '游戏-mc': 'game-mc',
    'game-ut': 'game-ut', 'gameut': 'game-ut', 'ut': 'game-ut', '游戏-ut': 'game-ut',
    'egg': 'egg', '彩蛋': 'egg',
    'bg_grid': 'bg_grid', 'bg_ink': 'bg_ink', 'bg_map': 'bg_map', 'bg_botanical': 'bg_botanical'
  };
  const BG_LABEL = {
    auto: '随机', egg: '彩蛋', 'game-mc': '游戏-MC', 'game-ut': '游戏-UT',
    bg_grid: '网格', bg_ink: '水墨', bg_map: '地图', bg_botanical: '植物'
  };
  function normalizeBg(v){
    const key = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
    return BG_ALIAS[key] || null;
  }

  /* 切换表的第 0 档是「默认」= 跟随 JSON 的 bg（JSON 没写就是四张随机）；
     后面是能手选的几档 —— 游戏壁纸在这里，彩蛋不在（只能在 JSON 里指定）。 */
  const BG_STOPS = [
    { slug:'auto',         label:'默认' },
    { slug:'bg_grid',      label:'网格' },
    { slug:'bg_ink',       label:'水墨' },
    { slug:'bg_map',       label:'地图' },
    { slug:'bg_botanical', label:'植物' },
    { slug:'game-mc',      label:'游戏-MC' },
    { slug:'game-ut',      label:'游戏-UT' }
  ];

  /* JSON 里声明的档；数据还没到手时先当默认 */
  let bgFromJson = 'auto';

  /* 本机停在第几档：0 = 默认（跟随 JSON），> 0 = 手选的那张。
     以前存过 'egg_background' 之类已经不在表里的值 → 落回默认。 */
  let bgStop = (() => {
    try{
      const v = localStorage.getItem(BG_KEY);
      if(v){
        const i = BG_STOPS.findIndex(s => s.slug === v);
        if(i > 0) return i;
      }
    }catch(e){}
    return 0;
  })();

  /* 当前真正生效的档 */
  function currentBg(){
    return bgStop === 0 ? bgFromJson : BG_STOPS[bgStop].slug;
  }

  /* 默认档的随机顺序：每次打开摇一次，resize 不再重摇，免得来回变 */
  const BG_ORDER = (() => {
    const a = BG_SLUGS.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  })();

  /* MC：挑一档最接近当前视口的壁纸。形状（宽高比）优先，像素量当次要项；
     高分屏最多按 2× 算，免得为了那点清晰度去拉一张用不上的大图。 */
  function pickMcSize(vw, vh){
    const dpr  = Math.min(window.devicePixelRatio || 1, 2);
    const need = Math.max(1, vw) * Math.max(1, vh) * dpr * dpr;
    const want = Math.max(1, vw) / Math.max(1, vh);
    let best = MC_SIZES[0], bestScore = Infinity;
    MC_SIZES.forEach(s => {
      const shape = Math.abs(Math.log((s.w / s.h) / want));       /* 形状差（主） */
      const pixel = Math.abs(Math.log((s.w * s.h) / need)) * 0.35; /* 像素量差（次） */
      const score = shape + pixel;
      if(score < bestScore){ bestScore = score; best = s; }
    });
    return best;
  }

  function viewport(){
    return {
      w: Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0) || 1024,
      h: Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0) || 768
    };
  }

  function paintPageBg(){
    const el = document.getElementById('bgLayer');
    if(!el) return;
    const vp   = viewport();
    const slug = currentBg();

    /* 游戏壁纸：整张铺满（cover），不平铺 */
    if(slug === 'game-mc' || slug === 'game-ut'){
      const url = slug === 'game-mc' ? mcUrl(pickMcSize(vp.w, vp.h)) : UT_URL;
      el.classList.add('is-cover');                  /* 纱加厚，见 CSS */
      el.style.backgroundImage    = `url('${url}')`;
      el.style.backgroundRepeat   = 'no-repeat';
      el.style.backgroundSize     = 'cover';
      el.style.backgroundPosition = 'center center';
      console.log(`[homework] 页面底图：${BG_LABEL[slug]} → ${url}（视口 ${vp.w}×${vp.h}）`);
      return;
    }

    /* 底纹档（默认 / 旧四张）：单张按 tile 宽铺；视口比一张宽就接下一张，向下平铺 */
    const tile = Math.min(BG_TILE_MAX, vp.w);
    const need = Math.max(1, Math.ceil(vp.w / tile));
    const seq  = slug === 'auto' ? BG_ORDER : [slug];
    const imgs = [], sizes = [], poss = [];
    for(let i = 0; i < need; i++){
      imgs.push(`url('${TILE_BASE}${seq[i % seq.length]}.jpg')`);
      sizes.push(`${tile}px`);                 /* 单值 = 宽 tile、高 auto（图是 1:1） */
      poss.push(`${i * tile}px 0`);
    }
    el.classList.remove('is-cover');
    el.style.backgroundImage    = imgs.join(', ');
    el.style.backgroundRepeat   = 'repeat-y';
    el.style.backgroundSize     = sizes.join(', ');
    el.style.backgroundPosition = poss.join(', ');
    console.log('[homework] 页面底纹：' + seq.join(' / ') + ' → 铺 ' + need + ' 张 · 每张 ' + tile + 'px（视口 ' + vp.w + 'px）');
  }

  /* ============ 彩蛋 ============
     只剩一条触发条件：data/homework.json 里写了 "bg":"egg"。
     原来是「作业 ≥ 2 条 或 10% 随机」—— 那条随机概率已经删掉，彩蛋也不再出现在
     「切换背景」的轮换里（正常情况下它就是不该冒出来）。 */
  function syncEggLayer(){
    const egg = document.getElementById('easterEgg');
    if(!egg) return;
    const on = currentBg() === 'egg';
    egg.classList.toggle('show-easter-egg', on);
    if(on) console.log('[homework] 彩蛋：JSON 里写了 "bg":"egg"，亮起来');
  }

  /* 背景层 + 彩蛋层 + 按钮文案按当前档位同步 */
  function applyBg(){
    paintPageBg();
    syncEggLayer();
    const txt = document.getElementById('bgBtnText');
    if(txt) txt.textContent = '背景：' + (BG_LABEL[currentBg()] || '随机');
    const btn = document.getElementById('bgBtn');
    if(btn) btn.title = bgStop === 0
      ? '点一下换一张背景（现在跟随 homework.json 的 bg，没写就是随机）'
      : '点一下换一张背景';
  }

  function cycleBg(){
    bgStop = (bgStop + 1) % BG_STOPS.length;
    try{ localStorage.setItem(BG_KEY, BG_STOPS[bgStop].slug); }catch(e){}
    applyBg();
    console.log('[homework] 切换到背景：' + BG_STOPS[bgStop].label + '（' + BG_STOPS[bgStop].slug + '）');
  }

  const bgBtn = document.getElementById('bgBtn');
  if(bgBtn) bgBtn.addEventListener('click', cycleBg);


  /* ============ 色调系统 ============ */
  const STEPS = 15;
  const H0 = 220, H1 = 14;
  const S0 = 8,   S1 = 65;
  const L0 = 60,  L1 = 58;

  const lerp = (a, b, t) => a + (b - a) * t;
  const r0   = n => Math.round(n);

  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  let lastStep = -1;

  function computeStep(done, total){
    if(total <= 0) return 0;
    return Math.min(STEPS, Math.round((done / total) * STEPS));
  }

  function applyTint(done, total){
    const step = computeStep(done, total);

    const fill = document.getElementById('progressFill');
    if(fill){
      fill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    if(step === lastStep) return;
    lastStep = step;

    const t    = step / STEPS;
    const dark = darkQuery.matches;
    const root = document.documentElement.style;

    const h = lerp(H0, H1, t);
    const s = lerp(S0, S1, t);
    const l = lerp(L0, L1, t);

    const ts = dark ? lerp(24, 90, t) : lerp(8, 58, t);
    const tl = dark ? lerp(74, 78, t) : lerp(34, 38, t);

    const softA = dark ? 0.22 : 0.14;
    const lineA = dark ? 0.42 : 0.30;
    const boxL  = dark ? lerp(70, 68, t) : l;
    const boxA  = dark ? 0.62 : 0.55;
    const cardA = dark ? 0.36 : 0.22;

    root.setProperty('--tint-accent', `hsl(${r0(h)} ${r0(s)}% ${r0(l)}%)`);
    root.setProperty('--tint-text',   `hsl(${r0(h)} ${r0(ts)}% ${r0(tl)}%)`);
    root.setProperty('--tint-soft',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}% / ${softA})`);
    root.setProperty('--tint-line',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}% / ${lineA})`);
    root.setProperty('--tint-box',    `hsl(${r0(h)} ${r0(s)}% ${r0(boxL)}% / ${boxA})`);
    root.setProperty('--tint-card',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}% / ${cardA})`);
    root.setProperty('--tint-fill',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}%)`);

    const g1h = r0(h + 12);
    const g1s = r0(s * 0.85);
    const g1l = r0(Math.min(78, l + 6));
    const g1a = dark ? lerp(0.32, 0.62, t) : lerp(0.16, 0.38, t);

    const g2h = r0(h - 18);
    const g2s = r0(s * 1.10);
    const g2l = r0(l);
    const g2a = dark ? lerp(0.26, 0.52, t) : lerp(0.14, 0.32, t);

    root.setProperty('--glow-1', `hsl(${g1h} ${g1s}% ${g1l}% / ${g1a})`);
    root.setProperty('--glow-2', `hsl(${g2h} ${g2s}% ${g2l}% / ${g2a})`);
  }

  /* ============ DOM ============ */
  const tbody        = document.getElementById('tbody');
  const dateText     = document.getElementById('dateText');
  const progressText = document.getElementById('progressText');
  const notice       = document.getElementById('notice');
  const noticeText   = document.getElementById('noticeText');
  const noteEl       = document.getElementById('note');
  const noteTextEl   = document.getElementById('noteText');
  const subtitleEl   = document.getElementById('subtitle');
  const congrats     = document.getElementById('congrats');
  const congratsBtn  = document.getElementById('congratsBtn');
  const congratsText = document.getElementById('congratsText');
  const congratsTitle = document.getElementById('congratsTitle');

  let currentDate   = '';
  let currentId     = '';
  let hasCelebrated = false;
  let isDemoMode    = false;

  /* ============ 工具 ============ */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }

  function toISODate(s){
    const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!m) return todayStr();
    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }

  function fmtDate(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return String(d);
    const w = ['日','一','二','三','四','五','六'][dt.getDay()];
    return `${dt.getFullYear()} 年 ${dt.getMonth()+1} 月 ${dt.getDate()} 日 · 星期${w}`;
  }

  function splitLines(v){
    if(v === null || v === undefined) return [];
    return String(v)
      .replace(/\\n/g, '\n')
      .split(/\r?\n/)
      .map(s => s.trim())
      .filter(Boolean);
  }

  function toList(v){
    if(v === null || v === undefined) return [];
    if(Array.isArray(v)) return v.flatMap(splitLines);
    return splitLines(v);
  }

  function fnv1a(str){
    let h = 0x811c9dc5;
    for(let i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  function itemHash(subjectName, index, text){
    return fnv1a('hw1|' + subjectName + '|' + index + '|' + text);
  }

  /* ============ Markdown 轻量解析器 ============ */
  // 解析行内 Markdown (加粗、斜体、行内代码)
  function parseInlineMD(text) {
    if (!text) return '';
    return esc(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>');
  }

  // 解析块级 Markdown (主要用于笔记中的表格、列表、段落)
  function parseBlockMD(raw) {
    if (!raw) return '';
    const lines = String(raw).replace(/\\n/g, '\n').split('\n');
    let html = '';
    let inTable = false;
    let inList = false;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) {
        if (inTable) { html += '</table>'; inTable = false; }
        if (inList) { html += '</ul>'; inList = false; }
        continue;
      }

      // 表格判断
      if (line.startsWith('|') && line.endsWith('|')) {
        if (!inTable) { html += '<table>'; inTable = true; }
        if (line.includes('---')) continue; // 跳过表头分隔线
        
        const cells = line.split('|').slice(1, -1).map(c => `<td>${parseInlineMD(c.trim())}</td>`).join('');
        html += `<tr>${cells}</tr>`;
        continue;
      } else {
        if (inTable) { html += '</table>'; inTable = false; }
      }

      // 列表判断
      if (line.startsWith('- ') || line.startsWith('* ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${parseInlineMD(line.substring(2))}</li>`;
        continue;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
      }

      // 普通段落
      html += `<p>${parseInlineMD(line)}</p>`;
    }

    if (inTable) html += '</table>';
    if (inList) html += '</ul>';
    return html;
  }

  /* ============ 渲染便签 ============ */
  function renderNote(raw){
    if(raw === null || raw === undefined || String(raw).trim() === ''){
      noteEl.hidden = true;
      noteTextEl.innerHTML = '';
      return;
    }
    noteTextEl.innerHTML = parseBlockMD(raw);
    noteEl.hidden = false;
  }

  /* ============ 读取数据 ============ */
  async function loadData(){
    for(const p of PATHS){
      try{
        const res = await fetch(p, { cache:'no-store' });
        if(!res.ok) continue;

        let text = await res.text();
        text = text.replace(/,\s*([}\]])/g, '$1');

        const json = JSON.parse(text);
        return { data: json, demo:false };
      }catch(e){ /* 换下一个路径再试 */ }
    }
    return { data: DEMO, demo:true };
  }

  /* ============ 渲染 ============ */
  function render(data){
    let src = data;
    let topNote = null;

    if(data && typeof data === 'object' && data.homework && typeof data.homework === 'object'){
      src = data.homework;
      currentDate = data.date ? toISODate(data.date) : todayStr();
      if(data['笔记'] !== null && data['笔记'] !== undefined) topNote = data['笔记'];
    }else{
      currentDate = todayStr();
    }
    if(!src || typeof src !== 'object') src = DEMO;

    /* JSON 的 "bg"：默认档跟着它走（取值与含义见上面「页面背景」一节） */
    const bgRaw = (data && data.bg !== undefined && data.bg !== null)
                    ? data.bg
                    : (src.bg !== undefined ? src.bg : '');
    const bgParsed = normalizeBg(bgRaw);
    if(bgParsed === null){
      bgFromJson = 'auto';
      console.warn('[homework] 不认识的 bg 值：' + JSON.stringify(bgRaw) + '，按默认（四张底纹随机）处理');
    }else{
      bgFromJson = bgParsed;
    }
    applyBg();

    const titleRaw = (data && data.title !== null && data.title !== undefined)
                       ? data.title
                       : src.title;

    const idRaw    = (data && data.id !== null && data.id !== undefined)
                       ? data.id
                       : src.id;

    currentId = (idRaw !== null && idRaw !== undefined && String(idRaw).trim() !== '')
                  ? String(idRaw).trim()
                  : currentDate;

    if(titleRaw !== null && titleRaw !== undefined && String(titleRaw).trim() !== ''){
      subtitleEl.textContent = String(titleRaw);
      subtitleEl.hidden = false;
    }else{
      subtitleEl.textContent = '';
      subtitleEl.hidden = true;
    }

    let noteRaw = topNote;
    if(noteRaw === null && src['笔记'] !== null && src['笔记'] !== undefined){
      noteRaw = src['笔记'];
    }
    renderNote(noteRaw);

    dateText.textContent = fmtDate(currentDate) || '—';

    const allSubjects = BASE_SUBJECTS.concat(collectExtraSubjects(src));

    let html = '';

    allSubjects.forEach(sub => {
      let raw = null;
      for(const k of sub.keys){
        if(src[k] !== null && src[k] !== undefined){ raw = src[k]; break; }
      }
      const list = toList(raw);

      let contentHTML;
      if(list.length === 0){
        contentHTML = '<span class="empty">今天没有 · 休息一下</span>';
      }else{
        contentHTML = '<ul class="hw-list">' + list.map((item, i) => {
          const h    = itemHash(sub.name, i, item);
          const key  = `hw:${currentId}:${h}`;
          const done = isDone(key);
          return `
            <li class="hw-item${done ? ' done' : ''}" data-key="${esc(key)}" data-h="${h}"
                role="checkbox" aria-checked="${done}" tabindex="0">
              <span class="box">
                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                  <path d="M1.8 6.2 4.5 9 10.2 3.2" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="text">${parseInlineMD(item)}</span>
            </li>`;
        }).join('') + '</ul>';
      }

      html += `
        <tr data-subject="${esc(sub.name)}" style="${subjectStyle(sub)}">
          <td><span class="subject" style="--c:${sub.color}">
            <span class="dot"></span>${esc(sub.name)}
          </span></td>
          <td>${contentHTML}</td>
        </tr>`;
    });

    tbody.innerHTML = html;

    /* 图在不在盘上，探一次（不在就把行标成 .hw-noimg，走兜底样式） */
    probeSubjectArt();

    lastStep = -1;
    updateProgress(false);
  }

  /* ============ 打勾状态 ============ */
  function isDone(key){
    try{ return localStorage.getItem(key) === '1'; }catch(e){ return false; }
  }
  function setDone(key, val){
    try{
      if(val) localStorage.setItem(key, '1');
      else localStorage.removeItem(key);
    }catch(e){}
  }

  /* ============ 进度 / 色调 / 兴奋 ============ */
  function updateProgress(fromUser){
    const items = tbody.querySelectorAll('.hw-item');
    const total = items.length;
    const done  = tbody.querySelectorAll('.hw-item.done').length;

    if(total === 0){
      progressText.textContent = '今天没有作业 🎉';
      applyTint(0, 1);
      return;
    }

    const allDone = done === total;
    const ratio   = done / total;
    const excited = !allDone && ratio >= 0.8;

    if(allDone){
      progressText.innerHTML =
        `<span class="badge all-done">全部完成 ✦ ${done} / ${total}</span>`;
    }else{
      progressText.innerHTML =
        `<span class="badge${excited ? ' excited' : ''}">已完成 ${done} / ${total}</span>`;
    }

    applyTint(done, total);

    if(allDone){
      if(fromUser && !hasCelebrated){
        hasCelebrated = true;
        setTimeout(() => {
          const now = tbody.querySelectorAll('.hw-item');
          if(now.length && tbody.querySelectorAll('.hw-item.done').length === now.length){
            openCongrats(now.length);
          }
        }, 300);
      }
    }else{
      hasCelebrated = false;
    }
  }

  function toggle(el){
    if(!el || !el.classList.contains('hw-item')) return;
    const key = el.dataset.key;
    const now = !el.classList.contains('done');
    el.classList.toggle('done', now);
    el.setAttribute('aria-checked', now ? 'true' : 'false');
    setDone(key, now);
    updateProgress(true);
  }

  /* ============ 事件绑定 ============ */
  tbody.addEventListener('click', e => {
    const item = e.target.closest('.hw-item');
    if(item) toggle(item);
  });

  tbody.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('.hw-item');
    if(item){ e.preventDefault(); toggle(item); }
  });

  /* ============ 恭喜弹窗 ============ */
  let lastFocus = null;

  function lockScroll(on){
    if(on){
      const sw = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.overflow = 'hidden';
      if(sw > 0) document.body.style.paddingRight = sw + 'px';
    }else{
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  }

  function openCongrats(count){
    if(congrats.classList.contains('show')) return;
    lastFocus = document.activeElement;

    if(isDemoMode){
      congrats.classList.add('easter');
      congratsTitle.textContent = '完成了...?';
      congratsText.textContent  = '真牛啊，你怎么做到的...\n滚吧，不诚实的孩子';
      congratsBtn.textContent   = '奴知晓了';
    }else{
      congrats.classList.remove('easter');
      congratsTitle.textContent = '今日作业...已清零!好样的伙计!';
      congratsText.textContent  =
        `WONDERFUL！${count} 项全清了。合上本子，剩下的时间归你。`;
      congratsBtn.textContent   = '朕知晓了';
    }

    congrats.classList.add('show');
    lockScroll(true);
    congratsBtn.focus();
  }

  function closeCongrats(){
    if(!congrats.classList.contains('show')) return;
    congrats.classList.remove('show');
    lockScroll(false);
    if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  congratsBtn.addEventListener('click', closeCongrats);

  congrats.addEventListener('click', e => {
    if(e.target === congrats) closeCongrats();
  });

  congrats.addEventListener('keydown', e => {
    if(e.key === 'Tab'){ e.preventDefault(); congratsBtn.focus(); }
  });

  /* ============ 更新日志（悬浮窗） ============
     数据目录和 homework.json 同级：/811/data/hwk-log/
       · index.json —— 目录：一个数组，也可以写成 { "entries": [...] }；
                       新的写在**最前面**；每条要么在索引里直接写全，
                       要么只写个 file 指向同目录下的日志文件
       · 每条日志一个文件 —— 写好就不再动（历史只增不改）
     页面**只读**：从不写、从不改，历史条目永远是原样。
     条目字段：date / title / version / tags[] / summary / sections[{heading, items[]}] / note
     行内支持 **粗体**、*斜体*、`代码`（复用正文那套轻量 Markdown）。 */
  const LOG_DIR   = './data/hwk-log/';
  const LOG_INDEX = LOG_DIR + 'index.json';

  const logWin    = document.getElementById('logWin');
  const logList   = document.getElementById('logList');
  const logDetail = document.getElementById('logDetail');
  const logCount  = document.getElementById('logCount');
  const logBtn    = document.getElementById('logBtn');
  const logClose  = document.getElementById('logClose');

  let logEntries  = null;   /* 目录（懒加载一次，之后不再请求） */
  let logActive   = 0;      /* 现在看的是第几条 */
  let logLastFocus = null;

  /* 和 homework.json 一样宽容：允许多余的逗号（手写的 JSON 常犯） */
  async function fetchJson(url){
    const res = await fetch(url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = (await res.text()).replace(/,\s*([}\]])/g, '$1');
    return JSON.parse(text);
  }

  async function loadLogIndex(){
    if(logEntries) return logEntries;
    const json = await fetchJson(LOG_INDEX);
    const list = Array.isArray(json) ? json
               : (json && Array.isArray(json.entries) ? json.entries : []);
    logEntries = list.filter(e => e && typeof e === 'object');
    return logEntries;
  }

  /* 索引里只写了 file 的，按需把那一条读进来（只在内存里合并，不写回文件） */
  async function loadLogEntry(entry){
    if(entry.sections || entry.body || !entry.file) return entry;
    const one = await fetchJson(LOG_DIR + entry.file);
    return Object.assign({}, entry, one && typeof one === 'object' ? one : {});
  }

  function renderLogEntry(e){
    const out = [];
    out.push(`<h3 class="log-h">${esc(e.title || '（无标题）')}</h3>`);

    const meta = [];
    if(e.version) meta.push(`<span class="log-ver">${esc(e.version)}</span>`);
    if(e.date)    meta.push(`<span>${esc(e.date)}</span>`);
    (Array.isArray(e.tags) ? e.tags : []).forEach(t => meta.push(`<span class="log-tag">${esc(t)}</span>`));
    if(meta.length) out.push(`<div class="log-meta">${meta.join('')}</div>`);

    if(e.summary) out.push(`<p class="log-sum">${parseInlineMD(String(e.summary))}</p>`);

    const secs = Array.isArray(e.sections) ? e.sections : [];
    secs.forEach(sec => {
      if(!sec || typeof sec !== 'object') return;
      const items = Array.isArray(sec.items) ? sec.items
                  : (sec.items === undefined || sec.items === null ? [] : [sec.items]);
      out.push('<section class="log-sec">');
      if(sec.heading) out.push(`<h4>${esc(sec.heading)}</h4>`);
      if(items.length){
        out.push('<ul>' + items.map(it => `<li>${parseInlineMD(String(it))}</li>`).join('') + '</ul>');
      }
      out.push('</section>');
    });

    /* 没写 sections 的，也可以直接给一段 body（空行分段，段内换行当空格） */
    if(!secs.length && e.body){
      String(e.body).split(/\n{2,}/).map(s => s.trim()).filter(Boolean)
        .forEach(p => out.push(`<p class="log-sum">${parseInlineMD(p.replace(/\s*\n\s*/g, ' '))}</p>`));
    }

    if(e.note) out.push(`<p class="log-note">${parseInlineMD(String(e.note))}</p>`);
    return out.join('');
  }

  async function selectLog(i){
    const list = logEntries || [];
    if(!list.length) return;
    logActive = Math.max(0, Math.min(i, list.length - 1));

    Array.prototype.forEach.call(logList.children, (el, k) => {
      el.setAttribute('aria-selected', k === logActive ? 'true' : 'false');
    });
    const cur = logList.children[logActive];
    if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest', inline:'nearest' });

    logDetail.innerHTML = '<p class="log-state">读取中…</p>';
    try{
      const entry = await loadLogEntry(list[logActive]);
      logDetail.innerHTML = renderLogEntry(entry);
      logDetail.scrollTop = 0;
    }catch(err){
      logDetail.innerHTML =
        `<p class="log-state">这条日志读不出来：${esc(err.message)}<br>` +
        `看看 ${esc(LOG_DIR + (list[logActive].file || 'index.json'))} 还在不在。</p>`;
    }
  }

  async function openLog(){
    logLastFocus = document.activeElement;
    logWin.classList.add('show');
    lockScroll(true);
    logClose.focus();
    if(logEntries) return;                       /* 已经读过了，直接看 */

    logDetail.innerHTML = '<p class="log-state">读取中…</p>';
    try{
      const list = await loadLogIndex();
      logCount.textContent = list.length ? list.length + ' 条' : '';
      if(!list.length){
        logList.innerHTML = '';
        logDetail.innerHTML =
          `<p class="log-state">还没有日志。<br>把条目写进 <code>${esc(LOG_DIR)}index.json</code>，这里就会列出来。</p>`;
        return;
      }
      logList.innerHTML = list.map((e, i) => `
        <button class="log-item" type="button" role="tab" aria-controls="logDetail"
                aria-selected="${i === 0 ? 'true' : 'false'}">
          <span class="d">${esc(e.date || '')}</span>
          <span>${esc(e.title || '（无标题）')}</span>
        </button>`).join('');
      Array.prototype.forEach.call(logList.children, (el, i) => {
        el.addEventListener('click', () => selectLog(i));
      });
      selectLog(0);
    }catch(err){
      logList.innerHTML = '';
      logCount.textContent = '';
      logDetail.innerHTML =
        `<p class="log-state">没读到 <code>${esc(LOG_INDEX)}</code>：${esc(err.message)}<br>` +
        `（用 file:// 直接打开页面时读不到，跑 部署.cmd serve 或看线上）</p>`;
    }
  }

  function closeLog(){
    if(!logWin.classList.contains('show')) return;
    logWin.classList.remove('show');
    lockScroll(false);
    if(logLastFocus && document.contains(logLastFocus)) logLastFocus.focus();
  }

  if(logBtn)   logBtn.addEventListener('click', openLog);
  if(logClose) logClose.addEventListener('click', closeLog);
  if(logWin)   logWin.addEventListener('click', e => { if(e.target === logWin) closeLog(); });
  if(logList)  logList.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if(!dir) return;
    e.preventDefault();
    selectLog(logActive + dir);
    const el = logList.children[logActive];
    if(el && el.focus) el.focus();
  });

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    closeLog();
    closeCongrats();
  });

  /* ============ 系统配色切换监听 ============ */
  function onSchemeChange(){
    lastStep = -1;
    const items = tbody.querySelectorAll('.hw-item');
    if(items.length){
      applyTint(tbody.querySelectorAll('.hw-item.done').length, items.length);
    }else{
      applyTint(0, 1);
    }
  }
  if(darkQuery.addEventListener){
    darkQuery.addEventListener('change', onSchemeChange);
  }else if(darkQuery.addListener){
    darkQuery.addListener(onSchemeChange);
  }

  /* ============ 启动 ============ */
  applyBg();                                       /* 按记忆的档位先铺好底纹（含彩蛋层），别等数据 */
  window.addEventListener('resize', (() => {       /* 视口变了重算「拼几张」 */
    let t = null;
    return () => { clearTimeout(t); t = setTimeout(paintPageBg, 180); };
  })());

  loadData().then(({ data, demo }) => {
    isDemoMode = demo;
    render(data);

    if(demo){
      noticeText.innerHTML =
        '没读到 <code>data/homework.json</code>，下面是示例内容。' +
        '把 JSON 放到与网页同级的 <code>data/</code> 文件夹里刷新即可。';
      notice.classList.add('show');
    }
  }).catch(err => {
    isDemoMode = true;
    render(DEMO);
    noticeText.textContent = '读取作业数据出错，已显示示例内容：' + err.message;
    notice.classList.add('show');
  });

})();
</script>
