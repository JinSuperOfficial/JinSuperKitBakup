/* ═══════════ 外壳：顶栏 + 两列布局 + 侧栏目录 + 页脚 ═══════════
   ---------------------------------------------------
   这一份住在 build/template/post-chrome.css，只此一份：
   构建期（这一页）和控制台烘的归档稿（/p/archive/**）共用，
   别在这儿另抄一份。见 build/lib/chrome.mjs。 */
/* ═══════════════════════════════════════════════════
   文章外壳的样式（顶栏 + 两列布局 + 侧栏目录 + 上下篇 + 页脚）
   ---------------------------------------------------
   这一份被两处共用，**不要再抄第二遍**：
     · 构建期的静态文章页 `/p/post/*.html`（build/build.mjs 注入）
     · 控制台烘的归档稿 `/p/archive/*.html`（console/lib/render.mjs）
   正文排版在 docs-md.css（阅读器与这两处共用），这里只管外壳。
   配色 token 不在这儿：从 build/template/docs.html 抠（build/lib/theme.mjs）。
   ═══════════════════════════════════════════════════ */

/* 这一页的顶栏本身就是站点的栏（--bar-h），没有额外的 --nav-h */
:root{ --nav-h:0px }

*,*::before,*::after{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--md-ink);
  font-family:var(--sans);
  font-size:var(--fs-md);
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{ color:var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-xs); }

/* ---------- 顶栏 ---------- */
.top{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:14px;
  min-height:var(--bar-h);
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:var(--bar-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  background-blend-mode:var(--glass-blend);
}
.brand{
  display:flex; align-items:center; gap:9px;
  min-width:0;
  color:var(--ink);
  text-decoration:none;
  font-weight:640;
  letter-spacing:-.01em;
  white-space:nowrap;
}
.brand svg{ width:20px; height:20px; flex:none; color:var(--accent); }
.brand-sub{
  color:var(--faint);
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:400;
  overflow:hidden; text-overflow:ellipsis;
}
.top-nav{
  margin-left:auto;
  display:flex; align-items:center; gap:4px;
  font-size:13px;
}
.top-nav a{
  padding:6px 10px;
  border-radius:var(--radius-control);
  color:var(--dim);
  text-decoration:none;
  transition:color .14s var(--ease), background .14s var(--ease);
}
.top-nav a:hover{ color:var(--ink); background:color-mix(in srgb,var(--ink) 6%,transparent); }

/* ---------- 正文区 ---------- */
/* 有目录时是「左一列侧栏目录 + 右边文章」，没有目录就整幅给文章。
   ---------------------------------------------------
   单列是**默认**，两列才是有目录的例外：没有目录时如果还摆着两列网格，
   文章会掉进 212px 的第一列里被挤成一条（`.has-toc` 由生成方决定）。 */
.wrap{
  --toc-w:212px;
  max-width:1120px;
  margin:0 auto;
  padding:0 20px 80px;
  display:block;
}
.wrap.has-toc{
  display:grid;
  grid-template-columns:var(--toc-w) minmax(0,1fr);
  gap:8px 34px;
  align-items:start;
}

/* ---------- 侧栏目录 ---------- */
.ptoc{
  position:sticky;
  top:calc(var(--bar-h) + 20px);
  max-height:calc(100dvh - var(--bar-h) - 44px);
  overflow-y:auto;
  padding:44px 0 24px;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
.ptoc-title{
  margin:0 0 10px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);
}
.ptoc ul{ list-style:none;margin:0;padding:0 }
.ptoc li{ margin:0 }
.ptoc a{
  display:block;
  padding:4px 8px;
  font-size:12.5px;line-height:1.5;
  color:var(--dim);
  text-decoration:none;
  border-left:2px solid transparent;
  border-radius:0 var(--radius-xs) var(--radius-xs) 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .13s var(--ease),border-color .13s var(--ease),background .13s var(--ease);
}
/* 层级：按标题级别缩进 + 字号递减（层级由 normalizeTocLevels 归一，
   最浅的一级就是 lv-1，所以「从 h2 起」的文章也不会平白缩进一整格） */
.ptoc .lv-1 a{ font-weight:620; color:var(--ink) }
.ptoc .lv-2 a{ padding-left:16px }
.ptoc .lv-3 a{ padding-left:30px; font-size:12px; color:var(--faint) }
.ptoc a:hover{ color:var(--ink); background:color-mix(in srgb,var(--ink) 5%,transparent) }
.ptoc a.active{ color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft) }
.ptoc .lv-3 a:hover,
.ptoc .lv-3 a.active{ color:var(--accent) }

/* ---------- 正文 ---------- */
.md{
  max-width:820px;
  margin:0 auto;
  padding:44px 0 40px;
  font-size:var(--fs-md);
  line-height:1.78;
  color:var(--md-ink);
  word-wrap:break-word;
}
/* 阅读器里的 .md 自带 40px 左右内边距（那是它嵌在面板里的缘故）；
   这里页面本身就是留白，所以收窄一点，窄屏不再二次缩进。 */
@media (max-width:640px){
  .md{ padding:28px 0 32px; font-size:14.5px }
  .top{ padding:0 14px }
  .wrap{ padding:0 16px 60px }
}

/* ---------- 文章头（frontmatter 元数据）用的间距微调 ---------- */
.md .md-fm{ margin-top:0 }

/* 目录里「没有小节」时的兜底条目指向正文容器本身，跳回来别被吸顶栏盖住 */
#post{ scroll-margin-top:calc(var(--bar-h) + 14px) }

/* ---------- 上下篇 ---------- */
.pn{
  grid-column:2;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:8px auto 0;
  padding:20px 0 0;
  border-top:1px solid var(--line-soft);
  max-width:820px;
}
.pn a{
  display:block;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  background:var(--panel);
  text-decoration:none;
  color:var(--ink);
  transition:border-color .14s var(--ease), transform .14s var(--ease);
}
.pn a:hover{ border-color:var(--accent-line); transform:translateY(-2px) }
.pn .pn-k{
  display:block;
  margin-bottom:4px;
  font-family:var(--mono);
  font-size:11px;

html:not(.has-js) .md .md-spoiler-body,

}

<script>
/* 文章页的小增强（选项卡 / 代码组 / 复制按钮 / 剧透 / 目录高亮）住在
   build/template/post-script.js —— 归档稿共用同一份，别另抄。 */
/* ═══════════════════════════════════════════════════
   文章页的小增强（选项卡 / 代码组 / 复制按钮 / 剧透 / 目录高亮）
   ---------------------------------------------------
   这一份被两处共用，**不要再抄第二遍**：
     · 构建期的静态文章页 `/p/post/*.html`（build/build.mjs 注入）
     · 控制台烘的归档稿 `/p/archive/*.html`（console/lib/render.mjs）

   只做「让静态页面用起来像阅读器」这几件事，不引入任何库。
   脚本挂了页面照样能读：没有它时代码组全都摊开、剧透直接打开
   （见 post-chrome.css 里 html:not(.has-js) 那几条）。
   ═══════════════════════════════════════════════════ */
(function(){
  'use strict';
  var root = document.getElementById('post');
  if (!root) return;

  /* ── 选项卡 ::: tabs ── */
  root.querySelectorAll('.tabs-tabs-wrapper').forEach(function(box){
    var btns = box.querySelectorAll('.tabs-tab-button');
    var panes = box.querySelectorAll('.tabs-tab-content');
    function activate(i){
      btns.forEach(function(b, j){
        var on = j === i;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
      });
      panes.forEach(function(p, j){ p.classList.toggle('active', j === i); });
    }
    btns.forEach(function(b, i){
      b.addEventListener('click', function(){ activate(i); });
      b.addEventListener('keydown', function(e){
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var next = (i + (e.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length;
        activate(next);
        if (btns[next]) btns[next].focus();
      });
    });
  });

  /* ── 代码组 ::: code-group：标签按钮按真实面板数生成 ── */
  root.querySelectorAll('.code-group').forEach(function(group){
    var tabs = group.querySelector('.cg-tabs');
    var panels = group.querySelectorAll('.cg-panel');
    if (!tabs || panels.length < 2) return;
    function activate(i){
      panels.forEach(function(p, j){ p.hidden = j !== i; });
      tabs.querySelectorAll('.cg-tab').forEach(function(b, j){
        b.classList.toggle('is-active', j === i);
        b.setAttribute('aria-selected', j === i ? 'true' : 'false');
      });
    }
    panels.forEach(function(panel, i){
      var label = panel.getAttribute('data-label') || panel.getAttribute('data-lang') || ('代码 ' + (i + 1));
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cg-tab' + (i === 0 ? ' is-active' : '');
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      btn.textContent = label;
      btn.addEventListener('click', function(){ activate(i); });
      tabs.appendChild(btn);
    });
    activate(0);
  });

  /* ── 复制代码：每个代码块（含代码组里的面板）各给一个按钮 ── */
  root.querySelectorAll('pre > code').forEach(function(code){
    var pre = code.parentNode;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'md-copy';
    btn.textContent = '复制';
    btn.addEventListener('click', function(){
      var text = code.innerText;
      var done = function(ok){
        btn.textContent = ok ? '已复制' : '复制失败';
        setTimeout(function(){ btn.textContent = '复制'; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
        return;
      }
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      } catch (e) { done(false); }
    });
    pre.appendChild(btn);
  });

  /* ── 剧透块 >! ── */
  root.querySelectorAll('.md-spoiler').forEach(function(box){
    var head = box.querySelector('.md-spoiler-head');
    if (!head) return;
    function set(open){
      box.setAttribute('data-open', open ? 'true' : 'false');
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    set(box.getAttribute('data-open') === 'true');
    head.addEventListener('click', function(){ set(box.getAttribute('data-open') !== 'true'); });
  });

  /* ── 侧栏目录：滚动时高亮当前小节（目录是生成期写好的，
        没有目录时这一整块就不存在，脚本什么都不用做） ── */
  var toc = document.getElementById('ptoc');
  var tocList = document.getElementById('ptocList');
  if (toc && tocList && tocList.children.length){
    var links = Array.prototype.slice.call(tocList.querySelectorAll('a'));
    var barH = document.querySelector('.top');
    barH = barH ? barH.offsetHeight : 52;
    function onScroll(){
      var line = barH + 24;
      var current = null;
      for (var i = 0; i < links.length; i++){
        var target = document.getElementById(links[i].dataset.target);
        if (!target) continue;
        if (target.getBoundingClientRect().top <= line) current = links[i];
        else break;
      }
      links.forEach(function(a){ a.classList.toggle('active', a === current); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    onScroll();
  }

  /* ── 顶栏副标题：把「第几篇 / 共几篇」这类位置感补上（纯装饰） ── */
  var meta = document.querySelector('meta[name="x-post-index"]');
  if (meta){
    var sub = document.getElementById('brandSub');
    if (sub) sub.textContent = meta.getAttribute('content');
  }
})();

</script>
