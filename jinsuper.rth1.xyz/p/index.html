<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="JinSuper 网站的随笔与手稿栏目，收录以 Markdown 存放的文章，支持在线阅读、编辑与上传。">
<title>para/ — 随笔与手稿</title>
<style>
:root{
  --paper:#F7F2EA;
  --paper-2:#FBF8F2;
  --paper-3:#F3EDE2;
  --ink:#2E2723;
  --ink-soft:#6B5D52;
  --ink-faint:#9C8D80;
  --line:#E3D9CC;
  --olive:#8E9867;
  --clay:#D97757;
  --clay-dark:#C96848;
  --ease:cubic-bezier(.2,.7,.2,1);
  --serif: ui-serif, Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
}

*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* 极淡的纸面颗粒 */
body::after{
  content:"";
  position:fixed; inset:0; z-index:2; pointer-events:none;
  opacity:.03;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}

::selection{ background:#EBD8CC; }

/* ---------- 顶栏 ---------- */
.app{ position:relative; z-index:3; height:100dvh; height:100vh; display:flex; flex-direction:column; }

.topbar{
  position:relative;
  height:56px; flex:0 0 56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px 0 20px;
  border-bottom:1px solid var(--line);
  background:rgba(251,248,242,.88);
  backdrop-filter:blur(10px);
}
.brand{ display:flex; align-items:baseline; gap:8px; user-select:none; }
.brand-mark{
  font-family:var(--serif);
  font-size:19px; font-weight:600; letter-spacing:-.01em;
}
.brand-slash{ color:var(--clay); font-weight:600; font-size:19px; }
.brand-sub{
  font-size:12px; color:var(--ink-faint);
  letter-spacing:.04em;
  padding-left:6px;
  border-left:1px solid var(--line);
}
.top-actions{ display:flex; align-items:center; gap:8px; }

.menu-btn{
  display:none;
  align-items:center; justify-content:center;
  width:34px; height:34px;
  border:1px solid var(--line); border-radius:4px;
  background:transparent; color:var(--ink-soft); cursor:pointer;
  transition:border-color .15s var(--ease), color .15s var(--ease);
}
.menu-btn:hover{ border-color:var(--ink-faint); color:var(--ink); }

/* 进度条 */
.progress{
  position:absolute; left:0; bottom:-1px; height:2px; width:100%;
  background:var(--clay);
  transform:scaleX(0); transform-origin:0 50%;
  transition:transform .08s linear;
  z-index:5;
}

/* ---------- 按钮 ---------- */
.btn{
  font:inherit; font-size:14px;
  border:1px solid transparent; background:transparent; color:var(--ink);
  padding:7px 14px; border-radius:3px; cursor:pointer;
  transition:background .15s var(--ease), border-color .15s var(--ease),
             color .15s var(--ease), transform .12s var(--ease);
}
.btn:active{ transform:translateY(1px); }
.btn:focus-visible{ outline:2px solid var(--clay); outline-offset:2px; }

.btn-primary{
  background:var(--clay); color:#fff;
  border-radius:999px; padding:8px 20px; font-weight:500;
  letter-spacing:.01em;
}
.btn-primary:hover{ background:var(--clay-dark); }

.btn-quiet{ border-color:var(--line); color:var(--ink-soft); }
.btn-quiet:hover{ border-color:var(--ink-faint); color:var(--ink); background:var(--paper-3); }
.btn-quiet.danger:hover{ border-color:#C0432F; color:#C0432F; background:#FBEDE8; }

.btn-mini{
  border:1px solid var(--line); border-radius:3px;
  padding:6px 10px; font-size:13px; color:var(--ink-soft);
}
.btn-mini:hover{ border-color:var(--ink-faint); color:var(--ink); }

/* ---------- 布局 ---------- */
.layout{
  flex:1; min-height:0;
  display:grid;
  grid-template-columns:288px 1fr;
}

/* ---------- 侧栏 ---------- */
.sidebar{
  border-right:1px solid var(--line);
  background:var(--paper-2);
  display:flex; flex-direction:column; min-height:0;
}
.sidebar-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 18px 10px;
}
.sidebar-head h2{
  margin:0; font-size:12px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
}
.count{
  font-size:11px; color:var(--ink-faint);
  background:var(--paper-3); border-radius:999px;
  padding:2px 8px; font-variant-numeric:tabular-nums;
}
.search-wrap{ padding:0 14px 10px; }
#search{
  width:100%; font:inherit; font-size:13.5px;
  padding:8px 11px;
  background:var(--paper-3);
  border:1px solid transparent; border-radius:4px;
  color:var(--ink);
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
#search:focus{ outline:none; border-color:var(--olive); background:var(--paper-2); }
#search::placeholder{ color:var(--ink-faint); }

.post-list{ flex:1; overflow-y:auto; padding:4px 8px 8px; }
.post-list::-webkit-scrollbar{ width:8px; }
.post-list::-webkit-scrollbar-thumb{ background:#E0D5C6; border-radius:4px; }

.post-item{
  position:relative;
  display:block; width:100%; text-align:left;
  font:inherit;
  border:0; background:transparent;
  padding:11px 12px 11px 14px;
  border-radius:4px; cursor:pointer;
  transition:background .15s var(--ease);
  animation:rise .32s var(--ease) both;
  animation-delay:calc(var(--i, 0) * 22ms);
}
.post-item:hover{ background:var(--paper-3); }
.post-item.is-active{ background:#F0E9DC; }
.post-item.is-active::before{
  content:""; position:absolute; left:4px; top:11px; bottom:11px;
  width:2px; border-radius:2px; background:var(--clay);
}
.post-title{
  display:block;
  font-size:14.5px; line-height:1.45; color:var(--ink);
  font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding-right:44px;
}
.post-meta{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:4px;
  font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.post-meta .sep{ opacity:.5; }
.src-badge{
  position:absolute; right:10px; top:11px;
  font-size:10px; letter-spacing:.04em;
  color:var(--olive);
  border:1px solid #D5DCC2; background:#F0F3E7;
  padding:1px 5px; border-radius:3px;
}
.list-empty{
  padding:24px 14px; font-size:13px; line-height:1.7;
  color:var(--ink-faint);
}

/* 侧栏底部 para 面板 */
.para-panel{
  border-top:1px solid var(--line);
  padding:12px 14px 14px;
  background:#F8F4EC;
}
.para-hint{
  font-size:11.5px; line-height:1.65; color:var(--ink-faint);
  margin-bottom:9px;
}
.para-hint code{
  font-family:var(--mono); font-size:11px;
  background:var(--paper-3); padding:1px 4px; border-radius:3px;
  color:var(--ink-soft);
}
.para-manual{ display:flex; gap:6px; }
.para-manual input{
  flex:1; min-width:0; font:inherit; font-size:12.5px;
  padding:6px 9px;
  background:var(--paper-2);
  border:1px solid var(--line); border-radius:3px;
  color:var(--ink);
}
.para-manual input:focus{ outline:none; border-color:var(--olive); }
.para-manual input::placeholder{ color:#B9AA9B; }

/* ---------- 主舞台 ---------- */
.stage{
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--paper);
}
.stage::-webkit-scrollbar{ width:10px; }
.stage::-webkit-scrollbar-thumb{ background:#E0D5C6; border-radius:5px; border:3px solid var(--paper); }

/* ---------- 阅读 ---------- */
.reader-inner{
  max-width:716px;
  margin:0 auto;
  padding:68px 32px 140px;
  animation:rise .42s var(--ease) both;
}
.reader-kicker{
  display:flex; align-items:center; gap:10px;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint);
  margin-bottom:20px;
}
.kicker-line{ display:block; width:26px; height:1px; background:var(--clay); }
.reader-title{
  font-family:var(--serif);
  font-size:clamp(28px, 4vw, 44px);
  line-height:1.24; letter-spacing:-.015em;
  font-weight:600;
  margin:0 0 18px;
  color:#241E1A;
}
.reader-meta{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
  margin-bottom:22px;
}
.reader-meta .dot{
  width:3px; height:3px; border-radius:50%;
  background:var(--ink-faint); opacity:.5;
}
.reader-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:26px; }
.tag{
  font-size:11.5px; letter-spacing:.02em;
  color:var(--olive);
  background:#F0F3E7;
  border:1px solid #DCE2CB;
  padding:2px 9px; border-radius:999px;
}

.reader-body{
  font-size:17px; line-height:1.86; color:#3A322C;
  word-wrap:break-word;
}
.reader-body > *:first-child{ margin-top:0; }
.reader-body p{ margin:0 0 1.35em; }
.reader-body h1{ font-family:var(--serif); font-size:30px; margin:1.8em 0 .6em; font-weight:600; line-height:1.3; }
.reader-body h2{ font-family:var(--serif); font-size:25px; margin:1.8em 0 .6em; font-weight:600; line-height:1.35; }
.reader-body h3{ font-size:19px; margin:1.7em 0 .55em; font-weight:600; }
.reader-body h4{ font-size:16.5px; margin:1.5em 0 .5em; font-weight:600; color:var(--ink-soft); }
.reader-body a{
  color:var(--clay);
  text-decoration:none;
  border-bottom:1px solid rgba(215,119,87,.35);
  transition:border-color .15s var(--ease);
}
.reader-body a:hover{ border-bottom-color:var(--clay); }
.reader-body strong{ font-weight:600; color:#241E1A; }
.reader-body code{
  font-family:var(--mono);
  font-size:.87em;
  background:var(--paper-3);
  padding:.16em .42em;
  border-radius:3px;
  color:#8A4A32;
}
.reader-body pre{
  background:#2E2723;
  color:#EFE8DC;
  padding:18px 20px;
  border-radius:6px;
  overflow-x:auto;
  font-size:13.5px;
  line-height:1.7;
  margin:1.6em 0;
}
.reader-body pre code{
  background:none; padding:0; color:inherit; font-size:inherit;
}
.reader-body blockquote{
  margin:1.6em 0;
  padding:.15em 0 .15em 20px;
  border-left:2px solid var(--olive);
  color:var(--ink-soft);
  font-style:italic;
}
.reader-body blockquote p:last-child{ margin-bottom:0; }
.reader-body ul,.reader-body ol{ padding-left:1.45em; margin:0 0 1.35em; }
.reader-body li{ margin:.42em 0; }
.reader-body hr{ border:0; border-top:1px solid var(--line); margin:2.6em 0; }
.reader-body img{ max-width:100%; height:auto; border-radius:4px; display:block; margin:1.6em 0; }
.reader-body table{
  width:100%; border-collapse:collapse;
  font-size:14.5px; margin:1.6em 0;
  border-top:1px solid var(--line);
}
.reader-body th,.reader-body td{
  border-bottom:1px solid var(--line);
  padding:10px 12px; text-align:left; vertical-align:top;
}
.reader-body th{ font-weight:600; background:var(--paper-3); color:var(--ink-soft); }

.reader-foot{
  display:flex; gap:8px; flex-wrap:wrap;
  margin-top:64px; padding-top:24px;
  border-top:1px solid var(--line);
}

/* ---------- 空状态 ---------- */
.empty{
  height:100%;
  display:flex; align-items:center;
  padding:0 32px 0 clamp(32px, 12vw, 160px);
}
.empty-inner{ max-width:420px; animation:rise .5s var(--ease) both; }
.empty-mark{
  font-family:var(--serif);
  font-size:52px; line-height:1; color:#DDD0BE;
  margin-bottom:20px;
}
.empty h2{
  font-family:var(--serif);
  font-size:26px; font-weight:600;
  margin:0 0 12px;
}
.empty p{
  font-size:14.5px; line-height:1.85; color:var(--ink-soft);
  margin:0 0 26px;
}
.empty code{
  font-family:var(--mono); font-size:13px;
  background:var(--paper-3); padding:1px 5px; border-radius:3px;
  color:#8A4A32;
}
.empty-actions{ display:flex; gap:10px; align-items:center; }

/* ---------- 编辑器 ---------- */
.editor{ display:flex; flex-direction:column; height:100%; }
.editor-head{
  padding:26px 30px 14px;
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.ed-title{
  width:100%; font:inherit;
  font-family:var(--serif);
  font-size:clamp(22px, 3vw, 30px); font-weight:600;
  border:0; background:transparent; color:var(--ink);
  padding:2px 0; letter-spacing:-.01em;
}
.ed-title:focus{ outline:none; }
.ed-title::placeholder{ color:#C4B5A5; }
.ed-tags{
  width:100%; font:inherit; font-size:13px;
  border:0; background:transparent; color:var(--ink-soft);
  padding:8px 0 0;
}
.ed-tags:focus{ outline:none; }
.ed-tags::placeholder{ color:#C4B5A5; }

.editor-body{
  flex:1; min-height:0;
  display:grid; grid-template-columns:1fr 1fr;
}
.pane{ display:flex; flex-direction:column; min-height:0; }
.pane-write{ border-right:1px solid var(--line); }
.pane-label{
  flex:0 0 auto;
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint);
  padding:12px 30px 4px;
}
#edContent{
  flex:1; width:100%; resize:none;
  border:0; background:transparent;
  font-family:var(--mono);
  font-size:14.5px; line-height:1.85;
  color:var(--ink);
  padding:8px 30px 48px;
  tab-size:2;
}
#edContent:focus{ outline:none; }
#edContent::placeholder{ color:#C4B5A5; line-height:1.85; }

.md-preview{
  flex:1; overflow-y:auto;
  padding:8px 30px 48px;
  font-size:15.5px;
}
.md-preview::-webkit-scrollbar{ width:9px; }
.md-preview::-webkit-scrollbar-thumb{ background:#E0D5C6; border-radius:5px; border:3px solid var(--paper); }
.preview-empty{ color:#C4B5A5; font-size:14px; }

.editor-foot{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 30px;
  border-top:1px solid var(--line);
  background:var(--paper-2);
}
.ed-status{ font-size:12.5px; color:var(--ink-faint); }
.ed-buttons{ display:flex; gap:8px; }

/* ---------- 拖拽遮罩 ---------- */
.drop-overlay{
  position:fixed; inset:0; z-index:60;
  display:none;
  align-items:center; justify-content:center;
  background:rgba(247,242,234,.86);
  backdrop-filter:blur(3px);
}
body.dragging .drop-overlay{ display:flex; animation:fade .18s var(--ease) both; }
.drop-overlay-inner{
  border:1.5px dashed var(--clay);
  border-radius:6px;
  padding:46px 62px;
  font-family:var(--serif);
  font-size:20px; color:var(--ink);
  background:var(--paper-2);
}
.drop-overlay-inner small{
  display:block; margin-top:10px;
  font-family:-apple-system,"PingFang SC",sans-serif;
  font-size:12.5px; color:var(--ink-faint);
}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:34px; z-index:80;
  transform:translate(-50%, 14px);
  background:#2E2723; color:#F3EDE2;
  font-size:13px; padding:9px 18px; border-radius:999px;
  opacity:0; pointer-events:none;
  transition:opacity .22s var(--ease), transform .22s var(--ease);
  box-shadow:0 10px 30px -12px rgba(46,39,35,.5);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

/* ---------- 动效 ---------- */
@keyframes rise{
  from{ opacity:0; transform:translateY(12px); }
  to{ opacity:1; transform:none; }
}
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* ---------- 响应式 ---------- */
@media (max-width: 900px){
  .editor-body{ grid-template-columns:1fr; }
  .pane-write{ border-right:0; }
  .pane-preview{ display:none; }
}

@media (max-width: 860px){
  .layout{ grid-template-columns:1fr; }
  .menu-btn{ display:inline-flex; }
  .brand-sub{ display:none; }
  .sidebar{
    position:fixed; top:56px; bottom:0; left:0; z-index:50;
    width:290px; max-width:84vw;
    transform:translateX(-102%);
    transition:transform .26s var(--ease);
    box-shadow:30px 0 70px -40px rgba(46,39,35,.55);
  }
  .sidebar.open{ transform:none; }
  .reader-inner{ padding:44px 22px 110px; }
  .empty{ padding:0 24px; align-items:flex-start; padding-top:14vh; }
  .editor-head{ padding:20px 20px 12px; }
  #edContent{ padding:8px 20px 40px; }
  .pane-label{ padding:12px 20px 4px; }
  .editor-foot{ padding:12px 20px; }
  .md-preview{ padding:8px 20px 40px; }
}
</style>
</head>
<body>

<noscript>
  <main>
    <h1>para/ — 随笔与手稿</h1>
    <p>
      这是 JinSuper 网站的随笔与手稿栏目，文章以 Markdown 文件存放在 <code>p/para/</code> 目录下。
      页面默认在浏览器中动态读取并渲染这些文章；当前浏览器未启用 JavaScript，因此无法在此处自动显示正文。
    </p>
    <p>可直接访问的文章（纯文本 Markdown，任何环境都能阅读）：</p>
    <ul>
      <li><a href="/p/para/First.md">欢迎来到该网站</a> —— /p/para/First.md</li>
      <li><a href="/p/SKILL.md">SKILL.md</a> —— 设计规范</li>
      <li><a href="/p/color-theme.md">color-theme.md</a> —— 配色库</li>
      <li><a href="/p/TEST.md">TEST.md</a></li>
    </ul>
    <p><a href="/">返回网站首页</a> · <a href="/p/docs.html">查看文档栏目</a></p>
  </main>
</noscript>

<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="menu-btn" id="btnMenu" aria-label="打开文章列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <div class="brand">
        <span class="brand-mark">para</span><span class="brand-slash">/</span>
        <span class="brand-sub">随笔与手稿</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn btn-quiet" id="btnUpload">上传 .md</button>
      <button class="btn btn-primary" id="btnNew">写一篇</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple hidden>
    </div>

    <div class="progress" id="progress"></div>
  </header>

  <!-- 主体 -->
  <main class="layout">

    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2>文章</h2>
        <span class="count" id="postCount">0</span>
      </div>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜标题，或者搜正文…" autocomplete="off">
      </div>

      <nav class="post-list" id="postList"></nav>

      <div class="para-panel">
        <div class="para-hint" id="paraHint">正在翻 <code>para/</code> …</div>
        <div class="para-manual">
          <input id="paraFile" type="text" placeholder="para/notes.md" autocomplete="off">
          <button class="btn btn-mini" id="btnFetchPara" title="拉取这个文件">拉取</button>
        </div>
      </div>
    </aside>

    <!-- 舞台 -->
    <section class="stage" id="stage">

      <!-- 阅读 -->
      <article class="reader" id="reader" hidden></article>

      <!-- 编辑 -->
      <div class="editor" id="editor" hidden>
        <div class="editor-head">
          <input id="edTitle" class="ed-title" type="text" placeholder="标题…" autocomplete="off">
          <input id="edTags" class="ed-tags" type="text" placeholder="标签，逗号隔开（可选）" autocomplete="off">
        </div>

        <div class="editor-body">
          <div class="pane pane-write">
            <div class="pane-label">Markdown</div>
            <textarea id="edContent" spellcheck="false"
              placeholder="# 从这儿开始&#10;&#10;支持标题、**加粗**、`行内代码`、列表、引用、表格、代码块、图片。&#10;&#10;> 写点具体的。别写“提升用户体验”。"></textarea>
          </div>
          <div class="pane pane-preview">
            <div class="pane-label">预览</div>
            <div class="md-preview reader-body" id="edPreview"></div>
          </div>
        </div>

        <div class="editor-foot">
          <span class="ed-status" id="edStatus"></span>
          <div class="ed-buttons">
            <button class="btn btn-quiet" id="btnCancelEdit">取消</button>
            <button class="btn btn-primary" id="btnSave">保存这篇</button>
          </div>
        </div>
      </div>

      <!-- 空 -->
      <div class="empty" id="empty" hidden>
        <div class="empty-inner">
          <div class="empty-mark">¶</div>
          <h2>这儿还是空的</h2>
          <p>
            写一篇新的，或者把 <code>.md</code> 直接拖进窗口。<br>
            页面也会自动去读同目录下 <code>para/</code> 里的文件 ——<br>
            放个 <code>index.json</code> 列出文件名，就能全部读到。
          </p>
          <div class="empty-actions">
            <button class="btn btn-primary" id="btnNew2">写第一篇</button>
            <button class="btn btn-quiet" id="btnUpload2">上传 .md</button>
          </div>
        </div>
      </div>

    </section>
  </main>
</div>

<!-- 拖拽遮罩 -->
<div class="drop-overlay">
  <div class="drop-overlay-inner">
    松手，就收下
    <small>支持 .md / .markdown / .txt</small>
  </div>
</div>

<script>
/* =========================================================
   0. 工具
   ========================================================= */
const $ = s => document.querySelector(s);

function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function uid(){
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function fmtDate(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}

function countWords(text){
  const cn = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  const en = (text.replace(/[\u4e00-\u9fa5]/g,' ').match(/[A-Za-z0-9]+/g) || []).length;
  return cn + en;
}

let toastTimer;
function flash(msg){
  let el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =========================================================
   1. Markdown 渲染器（零依赖）
   ========================================================= */
function inlineMd(s){
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s;
}

function mdToHtml(src){
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;

  const isTableSep = l =>
    /\|/.test(l) === false
      ? /^\s*:?-{2,}:?(\s*\|?\s*:?-{2,}:?)*\s*$/.test(l)
      : /^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(l);

  while (i < lines.length){
    const line = lines[i];

    /* 代码块 */
    let m = line.match(/^\s*```\s*(\S*)\s*$/);
    if (m){
      const lang = m[1];
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(
        `<pre data-lang="${escapeHtml(lang)}"><code>${escapeHtml(buf.join('\n'))}</code></pre>`
      );
      continue;
    }

    /* 标题 */
    m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (m){
      const lv = m[1].length;
      out.push(`<h${lv}>${inlineMd(m[2])}</h${lv}>`);
      i++;
      continue;
    }

    /* 分割线 */
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)){
      out.push('<hr>');
      i++;
      continue;
    }

    /* 引用 */
    if (/^\s*>\s?/.test(line)){
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])){
        buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      }
      out.push(`<blockquote>${mdToHtml(buf.join('\n'))}</blockquote>`);
      continue;
    }

    /* 表格 */
    if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i+1])){
      const cells = l => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '')
                          .split('|').map(s => s.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(cells(lines[i++]));
      }
      out.push(
        '<table><thead><tr>' +
        head.map(h => `<th>${inlineMd(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>'
      );
      continue;
    }

    /* 无序列表 */
    if (/^\s*[-*+]\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
        items.push(lines[i++].replace(/^\s*[-*+]\s+/, ''));
      }
      out.push('<ul>' + items.map(t => `<li>${inlineMd(t)}</li>`).join('') + '</ul>');
      continue;
    }

    /* 有序列表 */
    if (/^\s*\d+\.\s+/.test(line)){
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
        items.push(lines[i++].replace(/^\s*\d+\.\s+/, ''));
      }
      out.push('<ol>' + items.map(t => `<li>${inlineMd(t)}</li>`).join('') + '</ol>');
      continue;
    }

    /* 空行 */
    if (!line.trim()){ i++; continue; }

    /* 段落 */
    const buf = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^\s*(#{1,6}\s|>|```|[-*+]\s|\d+\.\s)/.test(lines[i])
    ){
      buf.push(lines[i++]);
    }
    if (!buf.length) buf.push(lines[i++]); // 保险
    out.push(`<p>${inlineMd(buf.join(' '))}</p>`);
  }

  return out.join('\n');
}

/* =========================================================
   2. 数据
   ========================================================= */
const LS_KEY = 'para.posts.v1';

let posts = [];
let activeId = null;
let mode = 'empty';       // read | edit | empty
let editingId = null;

function loadStore(){
  try { posts = JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { posts = []; }
}

function saveStore(){
  try {
    localStorage.setItem(
      LS_KEY,
      JSON.stringify(posts.filter(p => p.source === 'local'))
    );
  } catch {
    flash('本地存储满了，先下载几篇吧');
  }
}

/* front-matter */
function parseFrontMatter(text){
  const m = String(text).match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
  if (!m) return { meta:{}, body:String(text) };
  const meta = {};
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0){
      const k = line.slice(0, idx).trim().toLowerCase();
      const v = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
      if (k) meta[k] = v;
    }
  });
  return { meta, body: String(text).slice(m[0].length) };
}

function importMd(filename, raw){
  const { meta, body } = parseFrontMatter(raw);
  const hm = body.match(/^\s*#\s+(.+)$/m);
  const title = (
    meta.title ||
    (hm ? hm[1].trim() : '') ||
    filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ')
  ).trim() || '无题';

  const tags = meta.tags
    ? meta.tags.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean)
    : [];

  const d = meta.date ? new Date(meta.date) : new Date();

  const post = {
    id: uid(),
    title,
    tags,
    date: (isNaN(d) ? new Date() : d).toISOString(),
    content: (body.trim() || String(raw).trim()),
    source: 'local'
  };
  posts.push(post);
  return post;
}

/* 从 para/ 构造只读文章 */
function makeParaPost(filename, raw){
  const { meta, body } = parseFrontMatter(raw);
  const hm = body.match(/^\s*#\s+(.+)$/m);
  const title = (
    meta.title ||
    (hm ? hm[1].trim() : '') ||
    filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ')
  ).trim() || '未命名';

  const tags = meta.tags
    ? meta.tags.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean)
    : [];

  const d = meta.date ? new Date(meta.date) : new Date();

  return {
    id: 'para:' + filename,
    title,
    tags,
    date: (isNaN(d) ? new Date() : d).toISOString(),
    content: body.trim() || String(raw).trim(),
    source: 'para',
    file: filename
  };
}

/* =========================================================
   3. 渲染
   ========================================================= */
function sortedPosts(){
  return [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));
}

function renderList(){
  const q = ($('#search').value || '').trim().toLowerCase();
  const list = $('#postList');

  const items = sortedPosts().filter(p =>
    !q ||
    p.title.toLowerCase().includes(q) ||
    p.content.toLowerCase().includes(q)
  );

  $('#postCount').textContent = items.length;

  if (!items.length){
    list.innerHTML = `<div class="list-empty">${
      q ? '没找着。换个词试试？'
        : '还没有文章。<br>点右上角「写一篇」，或者把 .md 拖进来。'
    }</div>`;
    return;
  }

  list.innerHTML = items.map((p, idx) => `
    <button class="post-item ${p.id === activeId ? 'is-active' : ''}"
            data-id="${p.id}" style="--i:${Math.min(idx, 10)}">
      <span class="post-title">${escapeHtml(p.title)}</span>
      <span class="post-meta">
        <span>${fmtDate(p.date)}</span>
        ${p.tags.length
          ? `<span class="sep">·</span><span>${p.tags.slice(0,2).map(t => escapeHtml(t)).join(' / ')}</span>`
          : ''}
      </span>
      ${p.source === 'para' ? '<span class="src-badge">para/</span>' : ''}
    </button>
  `).join('');

  list.querySelectorAll('.post-item').forEach(btn => {
    btn.addEventListener('click', () => {
      openReader(btn.dataset.id);
      $('#sidebar').classList.remove('open');
    });
  });
}

function renderStage(){
  $('#reader').hidden = mode !== 'read';
  $('#editor').hidden = mode !== 'edit';
  $('#empty').hidden  = mode !== 'empty';
  $('#stage').scrollTop = 0;
  $('#progress').style.transform = 'scaleX(0)';
}

function renderReader(){
  const p = posts.find(x => x.id === activeId);
  if (!p){ mode = 'empty'; renderStage(); return; }

  const words = countWords(p.content);
  const mins  = Math.max(1, Math.round(words / 350));

  $('#reader').innerHTML = `
    <div class="reader-inner">
      <div class="reader-kicker">
        <span class="kicker-line"></span>
        <span>${p.source === 'para' ? 'para/' + escapeHtml(p.file || '') : '本地草稿'}</span>
      </div>

      <h1 class="reader-title">${escapeHtml(p.title)}</h1>

      <div class="reader-meta">
        <span>${fmtDate(p.date)}</span>
        <span class="dot"></span>
        <span>${words} 字</span>
        <span class="dot"></span>
        <span>约 ${mins} 分钟</span>
      </div>

      ${p.tags.length
        ? `<div class="reader-tags">${p.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`
        : ''}

      <div class="reader-body">${mdToHtml(p.content)}</div>

      <div class="reader-foot">
        <button class="btn btn-quiet" data-act="copy">复制 Markdown</button>
        <button class="btn btn-quiet" data-act="download">下载 .md</button>
        ${p.source === 'local'
          ? `<button class="btn btn-quiet" data-act="edit">编辑</button>
             <button class="btn btn-quiet danger" data-act="delete">删除</button>`
          : `<button class="btn btn-quiet" data-act="fork">拷到本地再改</button>`}
      </div>
    </div>
  `;
}

/* =========================================================
   4. 视图切换
   ========================================================= */
function openReader(id){
  const p = posts.find(x => x.id === id);
  if (!p) return;
  activeId = id;
  mode = 'read';
  renderReader();
  renderStage();
  renderList();
}

function openEditor(id){
  const p = id ? posts.find(x => x.id === id) : null;

  editingId = (p && p.source === 'local') ? p.id : null;
  activeId  = p ? p.id : null;

  $('#edTitle').value   = p ? p.title : '';
  $('#edTags').value    = p ? p.tags.join(', ') : '';
  $('#edContent').value = p ? p.content : '';

  if (!p)                  $('#edStatus').textContent = '新的一篇';
  else if (p.source === 'para') $('#edStatus').textContent = '从 para/ 拷来的副本，保存后归你';
  else                     $('#edStatus').textContent = '';

  updatePreview();
  mode = 'edit';
  renderStage();
  renderList();
  setTimeout(() => $('#edTitle').focus(), 40);
}

function updatePreview(){
  const html = mdToHtml($('#edContent').value).trim();
  $('#edPreview').innerHTML = html || '<p class="preview-empty">预览会出现在这儿…</p>';
}

/* =========================================================
   5. 交互
   ========================================================= */
$('#search').addEventListener('input', renderList);

$('#btnNew').addEventListener('click', () => openEditor(null));
$('#btnNew2').addEventListener('click', () => openEditor(null));

$('#btnMenu').addEventListener('click', () => {
  $('#sidebar').classList.toggle('open');
});

/* 上传 */
$('#btnUpload').addEventListener('click', () => $('#fileInput').click());
$('#btnUpload2').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  if (e.target.files?.length) handleFiles(e.target.files);
  e.target.value = '';
});

async function handleFiles(fileList){
  const files = [...fileList].filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (!files.length){ flash('只认 .md / .markdown / .txt'); return; }

  const loaded = await Promise.all(files.map(f => new Promise(resolve => {
    const r = new FileReader();
    r.onload  = () => resolve({ name: f.name, text: String(r.result) });
    r.onerror = () => resolve(null);
    r.readAsText(f, 'utf-8');
  })));

  let last = null;
  let ok = 0;
  loaded.filter(Boolean).forEach(({ name, text }) => {
    last = importMd(name, text);
    ok++;
  });

  if (!ok){ flash('这几个文件读不出来'); return; }

  saveStore();
  renderList();
  if (last) openReader(last.id);
  flash(`收了 ${ok} 篇`);
}

/* 拖拽 */
let dragDepth = 0;
addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragging');
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('dragleave', () => {
  dragDepth--;
  if (dragDepth <= 0){ dragDepth = 0; document.body.classList.remove('dragging'); }
});
addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
});

/* 编辑器 */
$('#edContent').addEventListener('input', updatePreview);

$('#btnSave').addEventListener('click', () => {
  const title = $('#edTitle').value.trim() || '无题';
  const content = $('#edContent').value;

  if (!content.trim()){
    flash('正文空着呢，写两句再存');
    $('#edContent').focus();
    return;
  }

  const tags = $('#edTags').value
    .split(/[,，]/).map(s => s.trim()).filter(Boolean);

  let p = editingId ? posts.find(x => x.id === editingId) : null;

  if (p){
    p.title   = title;
    p.tags    = tags;
    p.content = content;
    p.date    = new Date().toISOString();
  } else {
    p = {
      id: uid(),
      title, tags, content,
      date: new Date().toISOString(),
      source: 'local'
    };
    posts.push(p);
  }

  saveStore();
  flash('存好了');
  openReader(p.id);
});

$('#btnCancelEdit').addEventListener('click', () => {
  if (activeId && posts.find(x => x.id === activeId)) openReader(activeId);
  else { mode = 'empty'; activeId = null; renderStage(); renderList(); }
});

/* 阅读器底部按钮 */
$('#reader').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;

  const p = posts.find(x => x.id === activeId);
  if (!p) return;
  const act = btn.dataset.act;

  if (act === 'copy'){
    navigator.clipboard
      .writeText(p.content)
      .then(() => flash('Markdown 已复制'))
      .catch(() => flash('复制失败，手动选一下吧'));
  }

  if (act === 'download'){
    const blob = new Blob([p.content], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.title || 'untitled').replace(/[\\/:*?"<>|]/g, '_') + '.md';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash('下载好了，扔进 para/ 就是一篇');
  }

  if (act === 'edit') openEditor(p.id);

  if (act === 'delete'){
    if (!confirm(`删掉「${p.title}」？删了就找不回来了。`)) return;
    posts = posts.filter(x => x.id !== p.id);
    saveStore();
    activeId = null;
    mode = posts.length ? 'read' : 'empty';
    renderList();
    if (posts.length) openReader(sortedPosts()[0].id);
    else renderStage();
    flash('删了');
  }

  if (act === 'fork'){
    const copy = {
      id: uid(),
      title: p.title + '（副本）',
      tags: [...p.tags],
      date: new Date().toISOString(),
      content: p.content,
      source: 'local'
    };
    posts.push(copy);
    saveStore();
    renderList();
    openReader(copy.id);
    flash('拷过来了，现在随便改');
  }
});

/* =========================================================
   6. 读取 para/
   ========================================================= */
async function tryFetchText(url){
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('text/html')) return null;  // 多半是服务器的 404 页面
    return await res.text();
  } catch {
    return null;
  }
}

async function initPara(){
  const hint = $('#paraHint');
  let files = [];

  // 1) 优先读 index.json
  try {
    const res = await fetch('./para/index.json', { cache: 'no-store' });
    if (res.ok){
      const data = await res.json();
      if (Array.isArray(data)) files = data;
      else if (Array.isArray(data.files)) files = data.files;
    }
  } catch { /* 静默 */ }

  // 2) 没有索引，就碰碰运气
  if (!files.length){
    files = ['hello.md', 'demo.md', 'post.md'];
  }

  const found = [];
  for (const f of files){
    const name = String(f).trim().replace(/^\.?\/*/, '');
    if (!name || !/\.(md|markdown|txt)$/i.test(name)) continue;
    const text = await tryFetchText('./para/' + name);
    if (text === null) continue;
    found.push(makeParaPost(name, text));
  }

  if (found.length){
    posts = posts.filter(p => p.source !== 'para').concat(found);
    hint.innerHTML = `从 <code>para/</code> 读到 ${found.length} 篇。`;
  } else {
    hint.innerHTML =
      `没读到 <code>para/</code> 里的文件。放个 <code>index.json</code>：` +
      `<br><code>{"files":["a.md","b.md"]}</code>`;
  }

  renderList();

  if (mode === 'empty' && posts.length){
    openReader(sortedPosts()[0].id);
  }
}

/* 手动拉单个文件 */
$('#btnFetchPara').addEventListener('click', async () => {
  let name = $('#paraFile').value.trim();
  if (!name) return;
  if (!/\.(md|markdown|txt)$/i.test(name)) name += '.md';
  name = name.replace(/^\.?\/*/, '').replace(/^para\//i, '');

  const text = await tryFetchText('./para/' + name);
  if (text === null){ flash('没找到 para/' + name); return; }

  const p = makeParaPost(name, text);
  posts = posts.filter(x => x.id !== p.id).concat(p);
  $('#paraFile').value = '';
  renderList();
  openReader(p.id);
  flash('读到了');
});

$('#paraFile').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('#btnFetchPara').click();
});

/* =========================================================
   7. 滚动进度
   ========================================================= */
$('#stage').addEventListener('scroll', () => {
  const el = $('#stage');
  const max = el.scrollHeight - el.clientHeight;
  const ratio = max > 0 ? el.scrollTop / max : 0;
  $('#progress').style.transform = `scaleX(${ratio})`;
}, { passive: true });

/* =========================================================
