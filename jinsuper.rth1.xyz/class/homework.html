<script>
(function(){
  'use strict';

  /* ============ 基础科目配置（固定 5 科，顺序不变） ============ */
  const BASE_SUBJECTS = [
    { name:'语文', color:'#D97757', keys:['语文','chinese','yuwen'] },
    { name:'数学', color:'#8E9867', keys:['数学','math','shuxue'] },
    { name:'英语', color:'#8D6959', keys:['英语','english','yingyu'] },
    { name:'科学', color:'#6E8B8B', keys:['科学','science','kexue'] },
    { name:'社会', color:'#C08A3E', keys:['社会','social','shehui'] }
  ];

  /* ============ 科目图标（已经取代原来的小光点，也没有科目背景图了） ============
     全部内联 SVG：viewBox 0 0 24 24、stroke=currentColor、stroke-width=1.5、fill=none，
     无背景块、无阴影、无渐变、不用 Emoji、运行时不请求任何图标库 / 外部文件
     （项目 asset/icon 里那 600 个是 1024 网格的填充图标，跟这里的线性规格不兼容，所以自绘）。
     颜色走 currentColor：父级给 color:var(--c)（= 下面那份科目色），图标自动跟随 ——
     科目色只在这个文件的数据里定义一处，图标 / 行底色 / 滚动条刻度共用。 */
  const SUBJECT_ICONS = {
    /* 语文 · 一本摊开的书（两个页面 + 书脊） */
    '语文': '<path d="M12 6.3C10.2 4.9 7.9 4.4 4.5 4.8v13.4c3.4-.4 5.7.1 7.5 1.5 1.8-1.4 4.1-1.9 7.5-1.5V4.8c-3.4-.4-5.7.1-7.5 1.5z"/>'
          + '<path d="M12 6.3v13.4"/>',
    /* 数学 · 三角尺（外轮廓 + 中间的三角孔 + 两条刻度） */
    '数学': '<path d="M4.4 19.6h15.2L4.4 4.4z"/>'
          + '<path d="M8.4 16.4h4.2l-4.2-4.2z"/>'
          + '<path d="M7.4 19.6v-1.4M11.2 19.6v-1.4"/>',
    /* 英语 · ABC（自绘笔画，不依赖任何字体，也不会被系统字体换掉） */
    '英语': '<path d="M2.6 17.8 5.1 8.6l2.5 9.2"/>'
          + '<path d="M3.75 14.4h2.7"/>'
          + '<path d="M10.4 8.6v9.2"/>'
          + '<path d="M10.4 8.6h1.6a2.15 2.15 0 0 1 0 4.3h-1.6"/>'
          + '<path d="M10.4 12.9h2.05a2.45 2.45 0 0 1 0 4.9h-2.05"/>'
          + '<path d="M22 10.9a3.6 3.6 0 1 0 0 6.4"/>',
    /* 科学 · 三角试管（管口 + 管身 + 液面） */
    '科学': '<path d="M9.2 3.6h5.6"/>'
          + '<path d="M10.4 3.6v5.3L5.7 17.5a2.1 2.1 0 0 0 1.8 3.2h9a2.1 2.1 0 0 0 1.8-3.2l-4.7-8.6V3.6"/>'
          + '<path d="M7.6 14.6h8.8"/>',
    /* 社会 · 地球仪（圆 + 赤道 + 一条经线，经纬线只留 2 条） */
    '社会': '<circle cx="12" cy="12" r="8.2"/>'
          + '<path d="M3.8 12h16.4"/>'
          + '<path d="M12 3.8c2.4 2.5 3.6 5.2 3.6 8.2s-1.2 5.7-3.6 8.2c-2.4-2.5-3.6-5.2-3.6-8.2s1.2-5.7 3.6-8.2z"/>',
    /* 笔记 / NOTES · 便签（折角 + 两行字）—— 和上面五个科目拉开区分度 */
    '笔记': '<path d="M4.5 4.5h15v9.6l-5.4 5.4H4.5z"/>'
          + '<path d="M19.5 14.1h-5.4v5.4"/>'
          + '<path d="M8 8.6h7.4M8 11.8h4.6"/>'
  };

  /* 「其他」科目（JSON 里冒出来的、BASE_SUBJECTS 没登记的键，比如「班务」）：
     用几何形，**按科目名确定性映射** —— 同一个科目名每次渲染拿到同一个图形；
     这里绝不能出现 Math.random()，否则每次刷新图标都在换，会被当成 bug。 */
  const EXTRA_GLYPHS = [
    '<circle cx="12" cy="12" r="7.6"/>',                              /* 圆 */
    '<rect x="4.8" y="4.8" width="14.4" height="14.4" rx="1.6"/>',    /* 方 */
    '<path d="M12 4.6 20.2 19.4H3.8z"/>',                             /* 三角 */
    '<path d="M12 3.7 19.4 8v8L12 20.3 4.6 16V8z"/>',                 /* 六边形 */
    '<path d="M12 3.8 20.2 12 12 20.2 3.8 12z"/>'                      /* 菱形 */
  ];

  function subjectGlyph(name){
    const key = String(name);
    if(Object.prototype.hasOwnProperty.call(SUBJECT_ICONS, key)) return SUBJECT_ICONS[key];
    /* 复用文件里已有的 fnv1a（作业打勾的 key 也用它）：同一个名字 ⇒ 同一个下标 */
    const h = parseInt(fnv1a('icon|' + key), 16);
    return EXTRA_GLYPHS[(isNaN(h) ? 0 : h) % EXTRA_GLYPHS.length];
  }

  /* 装饰性图标：旁边永远有科目名的文字，所以对辅助技术 aria-hidden */
  function subjectIcon(name){
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
         + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'
         + ' aria-hidden="true">' + subjectGlyph(name) + '</svg>';
  }

  /* 行的内联样式：只留科目色（--c）—— 图标、行底色、滚动条刻度都从这一处取色 */
  function subjectStyle(sub){
    return '--c:' + sub.color;
  }

  /* ============ 自动拓展科目的配色循环池 ============ */
  const EXTRA_COLORS = [
    '#A47864', // 摩卡慕斯
    '#6B7D5A', // 砂绿
    '#3A6B8C', // 石青
    '#C43A2A', // 朱砂红
    '#C9A84C', // 描金
    '#539DB6', // 泳池蓝
    '#7EC8C8', // 薄荷蓝
    '#B35A3E', // 锈红
    '#8E6B9E', // 灰紫
    '#E8703A', // 生动橙
    '#AEB73A', // 酸性绿
    '#2D4A3E'  // 森林绿
  ];

  /* ★ 保留字：title / id / bg 也被占用了，别当成科目 */
  const RESERVED_KEYS = ['笔记', 'date', 'homework', 'title', 'id', 'bg'];

  function isKnownKey(key){
    const lower = String(key).toLowerCase();
    for(const rk of RESERVED_KEYS){
      if(String(rk).toLowerCase() === lower) return true;
    }
    for(const sub of BASE_SUBJECTS){
      for(const alias of sub.keys){
        if(String(alias).toLowerCase() === lower) return true;
      }
    }
    return false;
  }

  function collectExtraSubjects(src){
    const extras = [];
    Object.keys(src).forEach(key => {
      if(isKnownKey(key)) return;
      extras.push({
        name: key,
        color: EXTRA_COLORS[extras.length % EXTRA_COLORS.length],
        keys: [key]
      });
    });
    return extras;
  }

  /* 数据的读取路径写在下面「数据：一天一个文件」那一段（HWK_BASES + PATHS），这里不再重复 */

/*         读取失败显示的默认作业          */
  const DEMO = {
    'id':    'demo',
    'title': '示例清单 · 把当天记录放到 data/hwk/ 文件夹',
    '笔记':  '家庭的作业非常好完成啊',
    '语文':  '写一篇能把孔子吓死的文言文',
    '数学':  '算完圆周率\n随便选一个数学未解之谜求解并且发在论文平台',
    '英语':  '完成中美签证\n背诵蛋白质英文和贝多芬全名',
    '科学':  '将自己的DNA打散然后重组一次\n复活任意名字作为单位的科学家',
    '社会':  '当上美国总统\n当上日本首相\n当上俄罗斯沙皇\n测量地球表面积'
  };

  /* ============ 页面背景 ============
     三处来源，优先级从低到高：
       ① 当天记录 hwk-&lt;id&gt;.json 里的 "bg" 字段（站点作者说了算）
       ② 右上角「切换背景」按钮（只覆盖本机，记在 localStorage）
       ③ 都没有 → 默认：四张底纹随机拼一条（老行为，一点没变）

     JSON 的 "bg" 认这些值（大小写、空格都不敏感）：
       ""/不写/"default"/"auto"/"随机"   默认 —— 四张底纹随机拼一条
       "game-mc"                        游戏-MC —— MC 风格壁纸，按视口自动挑最接近的一档
       "game-ut"                        游戏-UT —— UT 那张壁纸，单张 cover 自适应
       "egg"                            彩蛋（**只有显式写才亮**；不再随机触发，也不进切换表）
       "bg_grid"/"bg_ink"/"bg_map"/"bg_botanical"  旧的四张（保留可用）
     不认识的值 → 按默认处理，并在控制台提醒一句。

     图都在 **项目根 asset/background/**（部署时镜像进 dist/asset/，见 project.md §10.3）：
       · MC：asset/background/mc/<宽x高>/wallpaper.png —— 一个尺寸一个文件夹，
             加一档 = 丢个「宽x高」文件夹（里面叫 wallpaper.png）+ 在 MC_SIZES 里加一行
       · UT：asset/background/ut.png —— 单张，cover 自适应
     页面路径从 /class/homework.html 出发，所以是 ../asset/background/… */
  const BG_SLUGS = ['bg_grid', 'bg_ink', 'bg_map', 'bg_botanical'];
  const BG_TILE_MAX = 720;                        /* 单张底纹最多铺这么宽 */
  const BG_KEY = 'homework.bg';                   /* 记住本机手动选的那一档 */
  const TILE_BASE = '../asset/homework/';         /* 四张底纹 */
  const BG_BASE   = '../asset/background/';       /* 游戏壁纸 */
  const UT_URL    = BG_BASE + 'ut.png';

  /* MC 的尺寸档（文件夹名就是「宽x高」） */
  const MC_SIZES = [
    { w:1080, h:1920 },
    { w:1920, h:1080 },
    { w:2048, h:2048 },
    { w:2058, h:1440 },
    { w:2560, h:1440 }
  ];
  const mcUrl = s => `${BG_BASE}mc/${s.w}x${s.h}/wallpaper.png`;

  /* JSON 的值 → 内部档位 */
  const BG_ALIAS = {
    '': 'auto', 'auto': 'auto', 'default': 'auto', 'dafault': 'auto',
    '默认': 'auto', '随机': 'auto',
    'game-mc': 'game-mc', 'gamemc': 'game-mc', 'mc': 'game-mc', '游戏-mc': 'game-mc',
    'game-ut': 'game-ut', 'gameut': 'game-ut', 'ut': 'game-ut', '游戏-ut': 'game-ut',
    'egg': 'egg', '彩蛋': 'egg',
    'bg_grid': 'bg_grid', 'bg_ink': 'bg_ink', 'bg_map': 'bg_map', 'bg_botanical': 'bg_botanical'
  };
  const BG_LABEL = {
    auto: '随机', egg: '彩蛋', 'game-mc': '游戏-MC', 'game-ut': '游戏-UT',
    bg_grid: '网格', bg_ink: '水墨', bg_map: '地图', bg_botanical: '植物'
  };
  function normalizeBg(v){
    const key = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
    return BG_ALIAS[key] || null;
  }

  /* 切换表的第 0 档是「默认」= 跟随 JSON 的 bg（JSON 没写就是四张随机）；
     后面是能手选的几档 —— 游戏壁纸在这里，彩蛋不在（只能在 JSON 里指定）。 */
  const BG_STOPS = [
    { slug:'auto',         label:'默认' },
    { slug:'bg_grid',      label:'网格' },
    { slug:'bg_ink',       label:'水墨' },
    { slug:'bg_map',       label:'地图' },
    { slug:'bg_botanical', label:'植物' },
    { slug:'game-mc',      label:'游戏-MC' },
    { slug:'game-ut',      label:'游戏-UT' }
  ];

  /* JSON 里声明的档；数据还没到手时先当默认 */
  let bgFromJson = 'auto';

  /* 本机停在第几档：0 = 默认（跟随 JSON），> 0 = 手选的那张。
     以前存过 'egg_background' 之类已经不在表里的值 → 落回默认。 */
  let bgStop = (() => {
    try{
      const v = localStorage.getItem(BG_KEY);
      if(v){
        const i = BG_STOPS.findIndex(s => s.slug === v);
        if(i > 0) return i;
      }
    }catch(e){}
    return 0;
  })();

  /* 当前真正生效的档 */
  function currentBg(){
    return bgStop === 0 ? bgFromJson : BG_STOPS[bgStop].slug;
  }

  /* 默认档的随机顺序：每次打开摇一次，resize 不再重摇，免得来回变 */
  const BG_ORDER = (() => {
    const a = BG_SLUGS.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  })();

  /* MC：挑一档最接近当前视口的壁纸。形状（宽高比）优先，像素量当次要项；
     高分屏最多按 2× 算，免得为了那点清晰度去拉一张用不上的大图。 */
  function pickMcSize(vw, vh){
    const dpr  = Math.min(window.devicePixelRatio || 1, 2);
    const need = Math.max(1, vw) * Math.max(1, vh) * dpr * dpr;
    const want = Math.max(1, vw) / Math.max(1, vh);
    let best = MC_SIZES[0], bestScore = Infinity;
    MC_SIZES.forEach(s => {
      const shape = Math.abs(Math.log((s.w / s.h) / want));       /* 形状差（主） */
      const pixel = Math.abs(Math.log((s.w * s.h) / need)) * 0.35; /* 像素量差（次） */
      const score = shape + pixel;
      if(score < bestScore){ bestScore = score; best = s; }
    });
    return best;
  }

  function viewport(){
    return {
      w: Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0) || 1024,
      h: Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0) || 768
    };
  }

  function paintPageBg(){
    const el = document.getElementById('bgLayer');
    if(!el) return;
    const vp   = viewport();
    const slug = currentBg();

    /* 游戏壁纸：整张铺满（cover），不平铺 */
    if(slug === 'game-mc' || slug === 'game-ut'){
      const url = slug === 'game-mc' ? mcUrl(pickMcSize(vp.w, vp.h)) : UT_URL;
      el.classList.add('is-cover');                  /* 纱加厚，见 CSS */
      el.style.backgroundImage    = `url('${url}')`;
      el.style.backgroundRepeat   = 'no-repeat';
      el.style.backgroundSize     = 'cover';
      el.style.backgroundPosition = 'center center';
      console.log(`[homework] 页面底图：${BG_LABEL[slug]} → ${url}（视口 ${vp.w}×${vp.h}）`);
      return;
    }

    /* 底纹档（默认 / 旧四张）：单张按 tile 宽铺；视口比一张宽就接下一张，向下平铺 */
    const tile = Math.min(BG_TILE_MAX, vp.w);
    const need = Math.max(1, Math.ceil(vp.w / tile));
    const seq  = slug === 'auto' ? BG_ORDER : [slug];
    const imgs = [], sizes = [], poss = [];
    for(let i = 0; i < need; i++){
      imgs.push(`url('${TILE_BASE}${seq[i % seq.length]}.jpg')`);
      sizes.push(`${tile}px`);                 /* 单值 = 宽 tile、高 auto（图是 1:1） */
      poss.push(`${i * tile}px 0`);
    }
    el.classList.remove('is-cover');
    el.style.backgroundImage    = imgs.join(', ');
    el.style.backgroundRepeat   = 'repeat-y';
    el.style.backgroundSize     = sizes.join(', ');
    el.style.backgroundPosition = poss.join(', ');
    console.log('[homework] 页面底纹：' + seq.join(' / ') + ' → 铺 ' + need + ' 张 · 每张 ' + tile + 'px（视口 ' + vp.w + 'px）');
  }

  /* ============ 彩蛋 ============
     只剩一条触发条件：当天记录里写了 "bg":"egg"。
     原来是「作业 ≥ 2 条 或 10% 随机」—— 那条随机概率已经删掉，彩蛋也不再出现在
     「切换背景」的轮换里（正常情况下它就是不该冒出来）。 */
  function syncEggLayer(){
    const egg = document.getElementById('easterEgg');
    if(!egg) return;
    const on = currentBg() === 'egg';
    egg.classList.toggle('show-easter-egg', on);
    if(on) console.log('[homework] 彩蛋：JSON 里写了 "bg":"egg"，亮起来');
  }

  /* 背景层 + 彩蛋层 + 按钮文案按当前档位同步 */
  function applyBg(){
    paintPageBg();
    syncEggLayer();
    const txt = document.getElementById('bgBtnText');
    if(txt) txt.textContent = '背景：' + (BG_LABEL[currentBg()] || '随机');
    const btn = document.getElementById('bgBtn');
    if(btn) btn.title = bgStop === 0
      ? '点一下换一张背景（现在跟随当天记录里的 bg，没写就是随机）'
      : '点一下换一张背景';
  }

  function cycleBg(){
    bgStop = (bgStop + 1) % BG_STOPS.length;
    try{ localStorage.setItem(BG_KEY, BG_STOPS[bgStop].slug); }catch(e){}
    applyBg();
    console.log('[homework] 切换到背景：' + BG_STOPS[bgStop].label + '（' + BG_STOPS[bgStop].slug + '）');
  }

  const bgBtn = document.getElementById('bgBtn');
  if(bgBtn) bgBtn.addEventListener('click', cycleBg);


  /* ============ 色调系统 ============ */
  const STEPS = 15;
  const H0 = 220, H1 = 14;
  const S0 = 8,   S1 = 65;
  const L0 = 60,  L1 = 58;

  const lerp = (a, b, t) => a + (b - a) * t;
  const r0   = n => Math.round(n);

  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  let lastStep = -1;

  function computeStep(done, total){
    if(total <= 0) return 0;
    return Math.min(STEPS, Math.round((done / total) * STEPS));
  }

  function applyTint(done, total){
    const step = computeStep(done, total);

    const fill = document.getElementById('progressFill');
    if(fill){
      fill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
    }

    if(step === lastStep) return;
    lastStep = step;

    const t    = step / STEPS;
    const dark = darkQuery.matches;
    const root = document.documentElement.style;

    const h = lerp(H0, H1, t);
    const s = lerp(S0, S1, t);
    const l = lerp(L0, L1, t);

    const ts = dark ? lerp(24, 90, t) : lerp(8, 58, t);
    const tl = dark ? lerp(74, 78, t) : lerp(34, 38, t);

    const softA = dark ? 0.22 : 0.14;
    const lineA = dark ? 0.42 : 0.30;
    const boxL  = dark ? lerp(70, 68, t) : l;
    const boxA  = dark ? 0.62 : 0.55;
    const cardA = dark ? 0.36 : 0.22;

    root.setProperty('--tint-accent', `hsl(${r0(h)} ${r0(s)}% ${r0(l)}%)`);
    root.setProperty('--tint-text',   `hsl(${r0(h)} ${r0(ts)}% ${r0(tl)}%)`);
    root.setProperty('--tint-soft',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}% / ${softA})`);
    root.setProperty('--tint-line',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}% / ${lineA})`);
    root.setProperty('--tint-box',    `hsl(${r0(h)} ${r0(s)}% ${r0(boxL)}% / ${boxA})`);
    root.setProperty('--tint-card',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}% / ${cardA})`);
    root.setProperty('--tint-fill',   `hsl(${r0(h)} ${r0(s)}% ${r0(l)}%)`);

    const g1h = r0(h + 12);
    const g1s = r0(s * 0.85);
    const g1l = r0(Math.min(78, l + 6));
    const g1a = dark ? lerp(0.32, 0.62, t) : lerp(0.16, 0.38, t);

    const g2h = r0(h - 18);
    const g2s = r0(s * 1.10);
    const g2l = r0(l);
    const g2a = dark ? lerp(0.26, 0.52, t) : lerp(0.14, 0.32, t);

    root.setProperty('--glow-1', `hsl(${g1h} ${g1s}% ${g1l}% / ${g1a})`);
    root.setProperty('--glow-2', `hsl(${g2h} ${g2s}% ${g2l}% / ${g2a})`);
  }

  /* ============ DOM ============ */
  const tbody        = document.getElementById('tbody');
  const dateText     = document.getElementById('dateText');
  const progressText = document.getElementById('progressText');
  const notice       = document.getElementById('notice');
  const noticeText   = document.getElementById('noticeText');
  const noteEl       = document.getElementById('note');
  const noteTextEl   = document.getElementById('noteText');
  const subtitleEl   = document.getElementById('subtitle');
  const congrats     = document.getElementById('congrats');
  const congratsBtn  = document.getElementById('congratsBtn');
  const congratsText = document.getElementById('congratsText');
  const congratsTitle = document.getElementById('congratsTitle');

  let currentDate   = '';
  let currentId     = '';
  let hasCelebrated = false;
  let isDemoMode    = false;

  /* ============================================================
     任务一 · 自绘滚动条
     ------------------------------------------------------------
     CSS 里那两条原生滚动条样式是**兜底**：没 JS、JS 报错、页面短到不用滚，
     用户看到的就是它。只有这里成功起来、且页面真的能滚时，才给 <html> 加 .hw-rail-on
     把原生那条让出来，换成下面这层悬浮轨道（科目刻度只可能长在自绘轨道上）。

     写这块时别破坏的约定：
       · thumb 位移只用 transform:translate3d；高度只在「重新布局」时改（不拿 top/height 做动画）
       · 滚动路径上一次布局都不读：行位置、轨道长度都是 layout() 时缓存好的
       · 不监听 wheel / keydown —— 滚轮、方向键、PageUp·PageDown、惯性滚动全是原生的
       · 除 thumb 和刻度按钮外 pointer-events:none，不影响正文的点击与选择
     ============================================================ */
  const railEl    = document.getElementById('rail');
  const railThumb = document.getElementById('railThumb');
  const railRoot  = document.documentElement;
  const reduceQuery = matchMedia('(prefers-reduced-motion: reduce)');
  const fineQuery   = matchMedia('(hover: hover) and (pointer: fine)');

  const railState = {
    max:0,        /* 还能滚多远 */
    track:0,      /* 轨道像素高 */
    thumbH:0,     /* thumb 像素高 */
    base:0,       /* 跳到某个科目时，顶部留的呼吸位 */
    rows:[],      /* [{ name, color, el, top, mark }]，顺序 = 科目在列表里的顺序 */
    active:-1,
    dragging:null
  };

  function scrollTopY(){
    return window.pageYOffset || window.scrollY || 0;
  }

  /* 元素在**文档里**的纵向位置：走 offsetTop 链，不用 getBoundingClientRect ——
     .card / .head 入场时带着十几 px 的 transform，rect 会把那段临时位移算进去，
     offsetTop 不会。它是布局值、也不含 scroll，正好直接跟 scrollY 比。 */
  function docTop(el){
    let t = 0, n = el;
    while(n && n.offsetParent){ t += n.offsetTop; n = n.offsetParent; }
    return t;
  }

  /* 刻度 = 科目数：一个科目一枚真 <button>（Tab 可达、Enter 触发、hover/focus 出科目名）。
     行是 render() 现画的，所以每次都按 DOM 顺序重建一遍。 */
  function railBuildMarks(){
    if(!railEl) return;
    [].forEach.call(railEl.querySelectorAll('.rail-mark'), m => {
      if(m.parentNode) m.parentNode.removeChild(m);
    });
    const rows = [];
    [].forEach.call(tbody.querySelectorAll('tr[data-subject]'), tr => {
      const name  = tr.getAttribute('data-subject') || '';
      const color = tr.style.getPropertyValue('--c') || '';
      const idx   = rows.length;
      const btn   = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rail-mark';
      btn.setAttribute('data-name', name);
      btn.setAttribute('aria-label', '跳到「' + name + '」');
      btn.style.setProperty('--c', color);
      btn.innerHTML = '<i></i>';
      btn.addEventListener('click', () => railJumpTo(idx));
      railEl.appendChild(btn);
      rows.push({ name:name, color:color, el:tr, top:0, mark:btn });
    });
    railState.rows   = rows;
    railState.active = -1;
  }

  /* 重算布局：能不能滚、要不要藏原生滚动条、thumb 多高、刻度摆哪。
     只在「尺寸变了 / 重新渲染 / 首帧」时跑，滚动时一次都不跑。 */
  function railLayout(){
    if(!railEl || !railThumb) return;
    const docH = railRoot.scrollHeight;
    const vh   = railRoot.clientHeight;
    const max  = Math.max(0, docH - vh);
    const canScroll = max > 2;
    const on = railRoot.classList.contains('hw-rail-on');

    /* 切换「藏不藏原生滚动条」：只在真切换的那一下量补偿宽，量完就固定。
       before - after = 原生滚动条让出来的宽（浏览器还留着轨道的话就是 0）。
       量完内容盒跟原来一模一样 —— 有没有滚动条都不跳。 */
    if(canScroll !== on){
      if(canScroll){
        const before = window.innerWidth - railRoot.clientWidth;
        railRoot.classList.add('hw-rail-on');
        const after = window.innerWidth - railRoot.clientWidth;
        railRoot.style.setProperty('--hw-gutter-comp', Math.max(0, before - after) + 'px');
      }else{
        railRoot.classList.remove('hw-rail-on');
      }
    }
    railEl.classList.toggle('on', canScroll);

    if(!canScroll){
      railState.max = 0; railState.track = 0; railState.thumbH = 0;
      return;
    }

    const track  = railEl.clientHeight || vh;
    const thumbH = Math.max(28, Math.min(track, Math.round(track * (vh / Math.max(1, docH)))));
    railState.max    = max;
    railState.track  = track;
    railState.thumbH = thumbH;
    railState.base   = Math.min(140, Math.round(vh * 0.14));
    railThumb.style.height = thumbH + 'px';          /* 高度只在布局里改 */

    /* 刻度位置 = 该科目在列表里的相对位置：换算成「跳过去之后 thumb 停在哪」，
       点了刻度 thumb 正好压在这枚刻度上；比例全部由数据算出来，resize / 数据变化都重算。
       算完再排一次队：相邻刻度至少留 12px —— 科目多了（或内容到底、后面几行跳不到顶部）
       位置会撞在一起，叠住的刻度鼠标点不到下面那枚。 */
    const span = Math.max(1, track - thumbH);
    const pos  = railState.rows.map(r => {
      r.top = Math.max(0, docTop(r.el));
      const y = Math.max(0, Math.min(max, r.top - railState.base));
      return (max ? y / max : 0) * span + thumbH / 2;
    });
    const gap    = 12;
    const halfMax = 9;                                  /* 粗指针档刻度按钮半高 */
    for(let i = 1; i < pos.length; i++){
      if(pos[i] < pos[i - 1] + gap) pos[i] = pos[i - 1] + gap;
    }
    if(pos.length && pos[pos.length - 1] > track - halfMax){
      for(let i = pos.length - 1; i >= 0; i--){
        const limit = (i === pos.length - 1) ? track - halfMax : pos[i + 1] - gap;
        if(pos[i] > limit) pos[i] = limit;
      }
    }
    railState.rows.forEach((r, i) => {
      const half = (r.mark.offsetHeight || 14) / 2;
      const cy   = Math.max(half, Math.min(track - half, pos[i]));
      r.mark.style.transform = 'translate3d(0,' + Math.round(cy - half) + 'px,0)';
    });
  }

  /* 跳转：点了刻度（或按 Enter）就滚到那个科目。
     平滑滚动只在「支持 scroll-behavior」且用户没要求减少动态效果时用；
     不支持就瞬时跳 —— 绝不给 scrollTo 塞 options 对象去赌。 */
  const canSmoothScroll = ('scrollBehavior' in railRoot.style);
  function railScrollTo(y, instant){
    if(!instant && canSmoothScroll && !reduceQuery.matches){
      try{ window.scrollTo({ top:y, behavior:'smooth' }); return; }catch(err){}
    }
    window.scrollTo(0, y);
  }
  function railJumpTo(i){
    const row = railState.rows[i];
    if(!row || !railState.max) return;
    railScrollTo(Math.max(0, Math.min(railState.max, row.top - railState.base)));
  }

  /* 滚动时每帧只干这一件事：挪 thumb + 换「当前科目」。
     不读布局、不写 top/height —— 只有一次 transform 写。 */
  function railSync(y){
    if(!railState.track || !railState.max || !railState.rows.length) return;
    const p   = Math.min(1, Math.max(0, y / railState.max));
    const top = p * (railState.track - railState.thumbH);
    railThumb.style.transform = 'translate3d(-50%,' + (Math.round(top * 10) / 10) + 'px,0)';

    /* 当前科目 = 「跳到哪儿，哪一行就算当前」：用的就是刻度跳转那条基准线（railState.base），
       再放 8px 余量。这样点了刻度之后，thumb 的颜色 / 高亮的那枚刻度正好是刚跳过去的科目，
       不会出现「跳到英语、拇指却变成科学」这种错位。 */
    const line = y + railState.base + 8;
    let idx = 0;
    for(let i = 0; i < railState.rows.length; i++){
      if(railState.rows[i].top <= line) idx = i; else break;
    }
    if(idx === railState.active) return;
    railState.active = idx;
    railState.rows.forEach((r, i) => {
      if(i === idx) r.mark.setAttribute('data-active', '1');
      else r.mark.removeAttribute('data-active');
    });
    const row = railState.rows[idx];
    /* thumb 的颜色跟着当前科目走：只改这一个变量，不用刷新页面 */
    if(row) railRoot.style.setProperty('--subject-color', row.color);
  }

  /* thumb 拖动：pointer 事件 + 指针捕获；只改滚动位置，滚动本身还是原生那套 */
  function railDragStart(e){
    if(!railState.max || (e.button !== undefined && e.button !== 0)) return;
    railState.dragging = { id:e.pointerId, y:e.clientY, scroll:scrollTopY() };
    railThumb.classList.add('is-dragging');
    try{ railThumb.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }
  function railDragMove(e){
    const d = railState.dragging;
    if(!d || e.pointerId !== d.id) return;
    const span = railState.track - railState.thumbH;
    if(span <= 0) return;
    const target = d.scroll + (e.clientY - d.y) / span * railState.max;
    railScrollTo(Math.max(0, Math.min(railState.max, Math.round(target))), true);
  }
  function railDragEnd(e){
    const d = railState.dragging;
    if(!d || (e.pointerId !== undefined && e.pointerId !== d.id)) return;
    railState.dragging = null;
    railThumb.classList.remove('is-dragging');
    try{ railThumb.releasePointerCapture(d.id); }catch(err){}
  }
  if(railEl && railThumb){
    railThumb.addEventListener('pointerdown', railDragStart);
    railThumb.addEventListener('pointermove', railDragMove);
    railThumb.addEventListener('pointerup', railDragEnd);
    railThumb.addEventListener('pointercancel', railDragEnd);
    railThumb.addEventListener('lostpointercapture', railDragEnd);
  }

  /* ============================================================
     任务三 ③ · 顶栏收缩
     滚过 <h1> 那一块 → 浮出一条细状态条；再往上滚 200px → 收一档。
     纯状态层（aria-hidden 的重复信息、pointer-events:none），不动布局高度、不抢焦点；
     单元素 transition，工具页按 interaction.md §8 走「时长 + ease-out」，不用 spring。
     ============================================================ */
  const sbEl    = document.getElementById('sb');
  const sbTitle = document.getElementById('sbTitle');
  const sbProg  = document.getElementById('sbProg');
  const sbFill  = document.getElementById('sbFill');
  let sbTrigger = 0, sbStage = 0;

  function sbLayout(){
    if(!sbEl) return;
    const head = document.querySelector('.head');
    if(head) sbTrigger = Math.max(120, docTop(head) + head.offsetHeight - 48);
    if(sbTitle && !sbTitle.textContent){
      const h1 = document.querySelector('.head h1');
      if(h1) sbTitle.textContent = h1.textContent;    /* 标题只写一处：从 <h1> 抄 */
    }
  }
  function sbSync(y){
    if(!sbEl) return;
    const stage = y > sbTrigger ? (y > sbTrigger + 200 ? 2 : 1) : 0;
    if(stage === sbStage) return;
    sbStage = stage;
    sbEl.classList.toggle('on', stage > 0);
    sbEl.classList.toggle('min', stage === 2);
  }

  /* ============================================================
     任务三 ① · 内容进入节奏（IntersectionObserver + CSS transition）
     为什么不用 animation-timeline:view()：view() 的进度是「元素在视口里的相对位置」，
     首屏本来就在视口里的元素一上来就落在 range 中段，会出现半透明的一帧 ——
     正文对比度会短暂掉下去；IO 这条路首屏就是「立刻补一场 460ms 淡入」，可控，
     而且 Safari 16 这类不支持 scroll-driven animations 的内核走的就是同一条路。
     ============================================================ */
  let revealIO = null, revealSeen = false;

  function revealNow(el){
    if(el) el.classList.add('rv-in');
  }
  function armReveal(){
    if(!railRoot.classList.contains('reveal-on')) return;
    [].forEach.call(document.querySelectorAll('.rv:not([data-rv]), .rv-tr:not([data-rv])'), el => {
      el.setAttribute('data-rv', '1');
      if(revealIO) revealIO.observe(el);
      else el.classList.add('rv-in');
    });
  }
  function disarmReveal(){
    railRoot.classList.remove('reveal-on');
    [].forEach.call(document.querySelectorAll('.rv, .rv-tr'), el => el.classList.add('rv-in'));
  }
  function initReveal(){
    if(!railRoot.classList.contains('reveal-on')) return;
    try{
      revealIO = new IntersectionObserver(entries => {
        revealSeen = true;
        entries.forEach(en => {
          if(!en.isIntersecting) return;
          en.target.classList.add('rv-in');
          revealIO.unobserve(en.target);
        });
      }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
    }catch(err){ revealIO = null; }
    armReveal();
    /* 兜底：IO 万一不回调（老内核 / 被扩展干扰），1.6s 后整页直接放行 ——
       内容永远比动画重要，绝不留下看不见的正文。 */
    setTimeout(() => { if(!revealSeen) disarmReveal(); }, 1600);
  }

  /* ============================================================
     任务三 ② · 背景随滚动轻微流动（JS 兜底那条）
     支持 animation-timeline:scroll() 的内核走 CSS（零 JS）；
     这里只管 Safari 16 这类不支持的：门控和 CSS 那条一模一样 ——
     桌面（hover:hover + pointer:fine）、允许动效、弹窗没锁滚动，三样都满足才动。
     ============================================================ */
  const bgLayerEl  = document.getElementById('bgLayer');
  const parallaxCSS = !!(window.CSS && CSS.supports && CSS.supports('animation-timeline', 'scroll()'));
  let wcTimer = 0;

  function parallaxOn(){
    return !parallaxCSS && !!bgLayerEl && !reduceQuery.matches && fineQuery.matches
           && document.body.style.overflow !== 'hidden';
  }
  function parallaxReset(){
    if(!bgLayerEl) return;
    bgLayerEl.classList.remove('is-drift');
    bgLayerEl.style.transform = '';
    bgLayerEl.style.willChange = '';
  }
  function bgParallax(y){
    if(!parallaxOn()){
      if(bgLayerEl && bgLayerEl.classList.contains('is-drift')) parallaxReset();
      return;
    }
    const max = Math.max(1, railRoot.scrollHeight - railRoot.clientHeight);
    const p   = Math.min(1, Math.max(0, y / max));
    bgLayerEl.classList.add('is-drift');
    /* 上下各 2.6% 视口高（和 CSS keyframes 同一个幅度），scale(1.06) 挡住平移露出来的边 */
    bgLayerEl.style.transform = 'translate3d(0,' + ((p - 0.5) * 5.2).toFixed(2) + '%,0) scale(1.06)';
    /* will-change 只在滚动前后临时挂，停下 200ms 就撤（规范硬要求：不常驻） */
    if(bgLayerEl.style.willChange !== 'transform') bgLayerEl.style.willChange = 'transform';
    if(wcTimer) clearTimeout(wcTimer);
    wcTimer = setTimeout(() => { if(bgLayerEl) bgLayerEl.style.willChange = ''; }, 200);
  }

  /* ============================================================
     一个 scroll 监听 + 一帧一次（thumb / 顶栏 / 视差共用）
     passive:true —— 不劫持滚轮、不 preventDefault，只读 scrollY。
     ============================================================ */
  let frameId = 0;
  function runFrame(){
    frameId = 0;
    const y = scrollTopY();
    railSync(y);
    sbSync(y);
    bgParallax(y);
  }
  function onScrollFrame(){
    if(frameId) return;
    frameId = requestAnimationFrame(runFrame);
  }

  /* 尺寸 / 内容变化统一走这里，一帧最多算一次（延到 rAF 里再改尺寸，
     免得 ResizeObserver 在同一轮里又收到自己的回调 —— 控制台会报 loop 警告）。 */
  let layoutId = 0;
  function scheduleLayout(){
    if(layoutId) return;
    layoutId = requestAnimationFrame(() => {
      layoutId = 0;
      railLayout();
      sbLayout();
      runFrame();
    });
  }

  window.addEventListener('scroll', onScrollFrame, { passive:true });
  window.addEventListener('resize', scheduleLayout, { passive:true });
  window.addEventListener('load', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if(window.ResizeObserver){
    try{ new ResizeObserver(scheduleLayout).observe(document.body); }catch(err){}
  }
  if(document.fonts && document.fonts.ready && document.fonts.ready.then){
    document.fonts.ready.then(scheduleLayout, () => {});
  }

  /* 用户中途改系统设置（减少动态效果 / 换到触屏）：立刻重算，不刷新页面 */
  function onMotionPrefChange(){
    if(reduceQuery.matches){
      disarmReveal();
      parallaxReset();
    }
    if(!fineQuery.matches) parallaxReset();
    scheduleLayout();
  }
  if(reduceQuery.addEventListener) reduceQuery.addEventListener('change', onMotionPrefChange);
  else if(reduceQuery.addListener) reduceQuery.addListener(onMotionPrefChange);
  if(fineQuery.addEventListener) fineQuery.addEventListener('change', onMotionPrefChange);
  else if(fineQuery.addListener) fineQuery.addListener(onMotionPrefChange);

  /* ============ 工具 ============ */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }

  function toISODate(s){
    const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!m) return todayStr();
    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }

  function fmtDate(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return String(d);
    const w = ['日','一','二','三','四','五','六'][dt.getDay()];
    return `${dt.getFullYear()} 年 ${dt.getMonth()+1} 月 ${dt.getDate()} 日 · 星期${w}`;
  }

  function splitLines(v){
    if(v === null || v === undefined) return [];
    return String(v)
      .replace(/\\n/g, '\n')
      .split(/\r?\n/)
      .map(s => s.trim())
      .filter(Boolean);
  }

  function toList(v){
    if(v === null || v === undefined) return [];
    if(Array.isArray(v)) return v.flatMap(splitLines);
    return splitLines(v);
  }

  function fnv1a(str){
    let h = 0x811c9dc5;
    for(let i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  function itemHash(subjectName, index, text){
    return fnv1a('hw1|' + subjectName + '|' + index + '|' + text);
  }

  /* ============ Markdown 轻量解析器 ============ */
  // 解析行内 Markdown (加粗、斜体、行内代码)
  function parseInlineMD(text) {
    if (!text) return '';
    return esc(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>');
  }

  // 解析块级 Markdown (主要用于笔记中的表格、列表、段落)
  function parseBlockMD(raw) {
    if (!raw) return '';
    const lines = String(raw).replace(/\\n/g, '\n').split('\n');
    let html = '';
    let inTable = false;
    let inList = false;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) {
        if (inTable) { html += '</table>'; inTable = false; }
        if (inList) { html += '</ul>'; inList = false; }
        continue;
      }

      // 表格判断
      if (line.startsWith('|') && line.endsWith('|')) {
        if (!inTable) { html += '<table>'; inTable = true; }
        if (line.includes('---')) continue; // 跳过表头分隔线
        
        const cells = line.split('|').slice(1, -1).map(c => `<td>${parseInlineMD(c.trim())}</td>`).join('');
        html += `<tr>${cells}</tr>`;
        continue;
      } else {
        if (inTable) { html += '</table>'; inTable = false; }
      }

      // 列表判断
      if (line.startsWith('- ') || line.startsWith('* ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${parseInlineMD(line.substring(2))}</li>`;
        continue;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
      }

      // 普通段落
      html += `<p>${parseInlineMD(line)}</p>`;
    }

    if (inTable) html += '</table>';
    if (inList) html += '</ul>';
    return html;
  }

  /* ============ 渲染便签 ============ */
  function renderNote(raw){
    if(raw === null || raw === undefined || String(raw).trim() === ''){
      noteEl.hidden = true;
      noteTextEl.innerHTML = '';
      return;
    }
    noteTextEl.innerHTML = parseBlockMD(raw);
    noteEl.hidden = false;
  }

  /* ============ 数据：一天一个文件 ============
     class/data/hwk/ 里：
       index.json      目录（裸数组，新的在前）—— 第一条就是「今天这份」
       hwk-<id>.json   当天记录：id / date / title / bg / notesId / eggId / subjects
       hwc-<id>.json   内容片：科目条目（kind:subject）/ 笔记（notes）/ 彩蛋（egg）
     旧的 data/homework.json 默认留作备份（拆分见 build/migrate-hwk.mjs）：
     新结构读不到就退回它，页面永远有东西显示。 */
  const HWK_BASES = ['./data/hwk/', '/class/data/hwk/', '/data/hwk/'];
  const PATHS = ['./data/homework.json', '/class/data/homework.json', '/data/homework.json'];
  /* 当天文件里这些键不算「科目」；其余顶层键（"语文": "…" 这种）一律当科目 */
  const INLINE_RESERVED = ['id', 'date', 'title', 'bg', 'subjects', 'notesId', 'eggId',
                           'homework', 'notes', 'egg', '彩蛋'];
  let hwkBase = null;                       /* 哪条基准读通了就记下来，后面几张片子都用它 */

  function parseLooseJson(text){
    return JSON.parse(String(text).replace(/,\s*([}\]])/g, '$1'));   /* 手写的 JSON 常有多余逗号 */
  }

  async function getJson(url, options){
    const res = await fetch(url, options || { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return parseLooseJson(await res.text());
  }

  /* bg 三种写法都认：字符串（旧）/ {value} / {slug,label} */
  function bgValue(bg){
    if(bg === null || bg === undefined) return '';
    if(typeof bg === 'object') return bg.value !== undefined ? bg.value : (bg.slug !== undefined ? bg.slug : '');
    return bg;
  }

  function isHwkName(name){
    return typeof name === 'string' && /^hwk-.+\.json$/.test(name);
  }

  /* 目录 → 排好序的作业文件列表（新的在前） */
  function normalizeIndex(json){
    const list = Array.isArray(json) ? json
               : (json && Array.isArray(json.entries) ? json.entries : null);
    if(!list) return null;
    const files = list
      .map(e => (typeof e === 'string' ? { name: e } : e))
      .filter(e => e && isHwkName(e.name))
      .map(e => ({
        name: e.name,
        id: String(e.id || e.name.replace(/^hwk-/, '').replace(/\.json$/, '')),
        date: String(e.date || ''),
        title: String(e.title || '')
      }));
    if(!files.length) return null;
    return files.sort((a, b) =>
      String(b.date || b.id).localeCompare(String(a.date || a.id)) || String(b.id).localeCompare(String(a.id)));
  }

  async function loadHwkNew(){
    /* ① 目录 */
    let files = null;
    for(const base of HWK_BASES){
      try{
        const list = normalizeIndex(await getJson(base + 'index.json'));
        if(list){ hwkBase = base; files = list; break; }
      }catch(e){ /* 换下一条基准 */ }
    }
    if(!files) return null;

    /* ② 当天记录 */
    let record = null;
    for(const base of [hwkBase].concat(HWK_BASES)){
      try{
        const one = await getJson(base + files[0].name);
        if(one && typeof one === 'object'){ record = one; hwkBase = base; break; }
      }catch(e){}
    }
    if(!record) return null;

    /* ③ 拼成 render() 认识的老形状：科目名 → 文本，外加 title / id / bg
       两种写法都认：
         · 默认（一天一个文件）：科目正文直接写在记录里 —— "语文": "…"、 "笔记": "…"
         · 抽共用内容片时才用：subjects: {语文: "<id>"} / notesId / eggId 指向 <id>.json */
    const subjects = (record.subjects && typeof record.subjects === 'object') ? record.subjects : null;
    const src = {};
    let egg = null;

    if(subjects){
      const ids = [];
      Object.keys(subjects).forEach(k => { if(typeof subjects[k] === 'string') ids.push(subjects[k]); });
      if(typeof record.notesId === 'string') ids.push(record.notesId);
      if(typeof record.eggId === 'string') ids.push(record.eggId);
      const uniq = ids.filter((v, i) => v && ids.indexOf(v) === i);

      const pieces = {};
      await Promise.all(uniq.map(async cid => {
        for(const base of [hwkBase].concat(HWK_BASES)){
          try{
            const one = await getJson(base + encodeURIComponent(cid) + '.json');
            if(one && typeof one === 'object'){ pieces[cid] = one; return; }
          }catch(e){}
        }
        pieces[cid] = null;
        console.warn('[homework] 内容片读不到：' + cid + '.json（这一片先当空的）');
      }));

      Object.keys(subjects).forEach(name => {
        const p = pieces[subjects[name]];
        if(p && typeof p.text === 'string') src[name] = p.text;
      });
      if(record.notesId && pieces[record.notesId] && typeof pieces[record.notesId].text === 'string'){
        src['笔记'] = pieces[record.notesId].text;
      }
      if(record.eggId && pieces[record.eggId] && typeof pieces[record.eggId].text === 'string'){
        egg = pieces[record.eggId].text;
      }
    }else{
      Object.keys(record).forEach(key => {
        if(INLINE_RESERVED.indexOf(key) >= 0 || key.slice(0, 2) === '__') return;   /* __ 开头是内部记账键 */
        if(record[key] === null || record[key] === undefined) return;
        src[key] = record[key];
      });
      if(typeof record['彩蛋'] === 'string') egg = record['彩蛋'];
    }

    if(record.title !== undefined) src.title = record.title;
    if(record.id !== undefined) src.id = record.id;
    if(record.bg !== undefined) src.bg = bgValue(record.bg);

    console.log('[homework] 读 ' + hwkBase + files[0].name + '（共 ' + files.length + ' 份历史）');
    return { data: src, egg: egg, demo:false };
  }

  /* ============ 读取数据 ============ */
  async function loadData(){
    try{
      const fresh = await loadHwkNew();
      if(fresh) return fresh;
    }catch(e){
      console.warn('[homework] data/hwk/ 没读通，退回 homework.json：' + e.message);
    }
    for(const p of PATHS){
      try{
        const json = await getJson(p);
        console.log('[homework] 用的是旧的 ' + p + '（备份）；拆分脚本见 build/migrate-hwk.mjs');
        return { data: json, demo:false, egg:null };
      }catch(e){ /* 换下一个路径再试 */ }
    }
    return { data: DEMO, demo:true, egg:null };
  }

  /* ============ 渲染 ============ */
  function render(data, eggText){
    let src = data;
    let topNote = null;

    if(data && typeof data === 'object' && data.homework && typeof data.homework === 'object'){
      src = data.homework;
      currentDate = data.date ? toISODate(data.date) : todayStr();
      if(data['笔记'] !== null && data['笔记'] !== undefined) topNote = data['笔记'];
    }else{
      currentDate = todayStr();
    }
    if(!src || typeof src !== 'object') src = DEMO;

    /* 彩蛋文案：JSON 里给了 eggId 就用它（第一行贴左边、第二行贴右边）；
       没给就保持页面里写死的那两行 —— 老行为一点没变。 */
    if(eggText){
      const lines = String(eggText).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const left  = document.querySelector('.easter-text.left');
      const right = document.querySelector('.easter-text.right');
      if(lines.length && left)  left.textContent  = lines[0];
      if(lines.length > 1 && right) right.textContent = lines[1];
    }

    /* JSON 的 "bg"：默认档跟着它走（取值与含义见上面「页面背景」一节） */
    const bgRaw = (data && data.bg !== undefined && data.bg !== null)
                    ? data.bg
                    : (src.bg !== undefined ? src.bg : '');
    const bgParsed = normalizeBg(bgRaw);
    if(bgParsed === null){
      bgFromJson = 'auto';
      console.warn('[homework] 不认识的 bg 值：' + JSON.stringify(bgRaw) + '，按默认（四张底纹随机）处理');
    }else{
      bgFromJson = bgParsed;
    }
    applyBg();

    const titleRaw = (data && data.title !== null && data.title !== undefined)
                       ? data.title
                       : src.title;

    const idRaw    = (data && data.id !== null && data.id !== undefined)
                       ? data.id
                       : src.id;

    currentId = (idRaw !== null && idRaw !== undefined && String(idRaw).trim() !== '')
                  ? String(idRaw).trim()
                  : currentDate;

    if(titleRaw !== null && titleRaw !== undefined && String(titleRaw).trim() !== ''){
      subtitleEl.textContent = String(titleRaw);
      subtitleEl.hidden = false;
    }else{
      subtitleEl.textContent = '';
      subtitleEl.hidden = true;
    }

    let noteRaw = topNote;
    if(noteRaw === null && src['笔记'] !== null && src['笔记'] !== undefined){
      noteRaw = src['笔记'];
    }
    renderNote(noteRaw);

    dateText.textContent = fmtDate(currentDate) || '—';

    const allSubjects = BASE_SUBJECTS.concat(collectExtraSubjects(src));

    let html = '';

    allSubjects.forEach((sub, si) => {
      let raw = null;
      for(const k of sub.keys){
        if(src[k] !== null && src[k] !== undefined){ raw = src[k]; break; }
      }
      const list = toList(raw);

      let contentHTML;
      if(list.length === 0){
        contentHTML = '<span class="empty">今天没有 · 休息一下</span>';
      }else{
        contentHTML = '<ul class="hw-list">' + list.map((item, i) => {
          const h    = itemHash(sub.name, i, item);
          const key  = `hw:${currentId}:${h}`;
          const done = isDone(key);
          return `
            <li class="hw-item${done ? ' done' : ''}" data-key="${esc(key)}" data-h="${h}"
                role="checkbox" aria-checked="${done}" tabindex="0">
              <span class="box">
                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                  <path d="M1.8 6.2 4.5 9 10.2 3.2" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="text">${parseInlineMD(item)}</span>
            </li>`;
        }).join('') + '</ul>';
      }

      /* 入场错峰：同屏最多错 6 个（第 7 个起不再往后拖），间隔 60ms，总量 ≤300ms */
      const rvDelay = Math.min(si, 5) * 60;

      html += `
        <tr class="rv-tr" data-subject="${esc(sub.name)}" style="${subjectStyle(sub)};--rv-d:${rvDelay}ms">
          <td><span class="subject" style="--c:${sub.color}">
            ${subjectIcon(sub.name)}${esc(sub.name)}
          </span></td>
          <td>${contentHTML}</td>
        </tr>`;
    });

    tbody.innerHTML = html;

    railBuildMarks();     /* 刻度 = 科目数：行刚画出来，这里按 DOM 顺序读一遍 */
    armReveal();          /* 新画出来的行也要排队入场 */
    scheduleLayout();     /* 行高变了 → 重算 thumb 高度 / 刻度位置 / 顶栏触发点 */

    lastStep = -1;
    updateProgress(false);
  }

  /* ============ 打勾状态 ============ */
  function isDone(key){
    try{ return localStorage.getItem(key) === '1'; }catch(e){ return false; }
  }
  function setDone(key, val){
    try{
      if(val) localStorage.setItem(key, '1');
      else localStorage.removeItem(key);
    }catch(e){}
  }

  /* ============ 进度 / 色调 / 兴奋 ============ */
  function updateProgress(fromUser){
    const items = tbody.querySelectorAll('.hw-item');
    const total = items.length;
    const done  = tbody.querySelectorAll('.hw-item.done').length;

    /* 顶栏状态条上的完成度：重复信息（整条 aria-hidden），只是滚动时看得见 */
    if(sbProg) sbProg.textContent = done + ' / ' + total;
    if(sbFill) sbFill.style.width = (total > 0 ? (done / total) * 100 : 0) + '%';

    if(total === 0){
      progressText.textContent = '今天没有作业 🎉';
      applyTint(0, 1);
      return;
    }

    const allDone = done === total;
    const ratio   = done / total;
    const excited = !allDone && ratio >= 0.8;

    if(allDone){
      progressText.innerHTML =
        `<span class="badge all-done">全部完成 ✦ ${done} / ${total}</span>`;
    }else{
      progressText.innerHTML =
        `<span class="badge${excited ? ' excited' : ''}">已完成 ${done} / ${total}</span>`;
    }

    applyTint(done, total);

    if(allDone){
      if(fromUser && !hasCelebrated){
        hasCelebrated = true;
        setTimeout(() => {
          const now = tbody.querySelectorAll('.hw-item');
          if(now.length && tbody.querySelectorAll('.hw-item.done').length === now.length){
            openCongrats(now.length);
          }
        }, 300);
      }
    }else{
      hasCelebrated = false;
    }
  }

  function toggle(el){
    if(!el || !el.classList.contains('hw-item')) return;
    const key = el.dataset.key;
    const now = !el.classList.contains('done');
    el.classList.toggle('done', now);
    el.setAttribute('aria-checked', now ? 'true' : 'false');
    setDone(key, now);
    updateProgress(true);
  }

  /* ============ 事件绑定 ============ */
  tbody.addEventListener('click', e => {
    const item = e.target.closest('.hw-item');
    if(item) toggle(item);
  });

  tbody.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('.hw-item');
    if(item){ e.preventDefault(); toggle(item); }
  });

  /* ============ 恭喜弹窗 ============ */
  let lastFocus = null;

  function lockScroll(on){
    if(on){
      const sw = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.overflow = 'hidden';
      if(sw > 0) document.body.style.paddingRight = sw + 'px';
    }else{
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  }

  function openCongrats(count){
    if(congrats.classList.contains('show')) return;
    lastFocus = document.activeElement;

    if(isDemoMode){
      congrats.classList.add('easter');
      congratsTitle.textContent = '完成了...?';
      congratsText.textContent  = '真牛啊，你怎么做到的...\n滚吧，不诚实的孩子';
      congratsBtn.textContent   = '奴知晓了';
    }else{
      congrats.classList.remove('easter');
      congratsTitle.textContent = '今日作业...已清零!好样的伙计!';
      congratsText.textContent  =
        `WONDERFUL！${count} 项全清了。合上本子，剩下的时间归你。`;
      congratsBtn.textContent   = '朕知晓了';
    }

    congrats.classList.add('show');
    lockScroll(true);
    congratsBtn.focus();
  }

  function closeCongrats(){
    if(!congrats.classList.contains('show')) return;
    congrats.classList.remove('show');
    lockScroll(false);
    if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  congratsBtn.addEventListener('click', closeCongrats);

  congrats.addEventListener('click', e => {
    if(e.target === congrats) closeCongrats();
  });

  congrats.addEventListener('keydown', e => {
    if(e.key === 'Tab'){ e.preventDefault(); congratsBtn.focus(); }
  });

  /* ============ 更新日志（悬浮窗） ============
     数据目录和 data/hwk/ 同级：/class/data/hwk-log/
       · index.json —— 目录：一个数组，也可以写成 { "entries": [...] }；
                       新的写在**最前面**；每条要么在索引里直接写全，
                       要么只写个 file 指向同目录下的日志文件
       · 每条日志一个文件 —— 写好就不再动（历史只增不改）
     页面**只读**：从不写、从不改，历史条目永远是原样。
     条目字段：date / title / version / tags[] / summary / sections[{heading, items[]}] / note
     行内支持 **粗体**、*斜体*、`代码`（复用正文那套轻量 Markdown）。 */
  const LOG_DIR   = './data/hwk-log/';
  const LOG_INDEX = LOG_DIR + 'index.json';

  const logWin    = document.getElementById('logWin');
  const logList   = document.getElementById('logList');
  const logDetail = document.getElementById('logDetail');
  const logCount  = document.getElementById('logCount');
  const logBtn    = document.getElementById('logBtn');
  const logClose  = document.getElementById('logClose');

  let logEntries  = null;   /* 目录（懒加载一次，之后不再请求） */
  let logActive   = 0;      /* 现在看的是第几条 */
  let logLastFocus = null;

  /* 和数据文件一样宽容：允许多余的逗号（手写的 JSON 常犯） */
  async function fetchJson(url){
    const res = await fetch(url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = (await res.text()).replace(/,\s*([}\]])/g, '$1');
    return JSON.parse(text);
  }

  async function loadLogIndex(){
    if(logEntries) return logEntries;
    const json = await fetchJson(LOG_INDEX);
    const list = Array.isArray(json) ? json
               : (json && Array.isArray(json.entries) ? json.entries : []);
    logEntries = list.filter(e => e && typeof e === 'object');
    return logEntries;
  }

  /* 索引里只写了 file 的，按需把那一条读进来（只在内存里合并，不写回文件） */
  async function loadLogEntry(entry){
    if(entry.sections || entry.body || !entry.file) return entry;
    const one = await fetchJson(LOG_DIR + entry.file);
    return Object.assign({}, entry, one && typeof one === 'object' ? one : {});
  }

  function renderLogEntry(e){
    const out = [];
    out.push(`<h3 class="log-h">${esc(e.title || '（无标题）')}</h3>`);

    const meta = [];
    if(e.version) meta.push(`<span class="log-ver">${esc(e.version)}</span>`);
    if(e.date)    meta.push(`<span>${esc(e.date)}</span>`);
    (Array.isArray(e.tags) ? e.tags : []).forEach(t => meta.push(`<span class="log-tag">${esc(t)}</span>`));
    if(meta.length) out.push(`<div class="log-meta">${meta.join('')}</div>`);

    if(e.summary) out.push(`<p class="log-sum">${parseInlineMD(String(e.summary))}</p>`);

    const secs = Array.isArray(e.sections) ? e.sections : [];
    secs.forEach(sec => {
      if(!sec || typeof sec !== 'object') return;
      const items = Array.isArray(sec.items) ? sec.items
                  : (sec.items === undefined || sec.items === null ? [] : [sec.items]);
      out.push('<section class="log-sec">');
      if(sec.heading) out.push(`<h4>${esc(sec.heading)}</h4>`);
      if(items.length){
        out.push('<ul>' + items.map(it => `<li>${parseInlineMD(String(it))}</li>`).join('') + '</ul>');
      }
      out.push('</section>');
    });

    /* 没写 sections 的，也可以直接给一段 body（空行分段，段内换行当空格） */
    if(!secs.length && e.body){
      String(e.body).split(/\n{2,}/).map(s => s.trim()).filter(Boolean)
        .forEach(p => out.push(`<p class="log-sum">${parseInlineMD(p.replace(/\s*\n\s*/g, ' '))}</p>`));
    }

    if(e.note) out.push(`<p class="log-note">${parseInlineMD(String(e.note))}</p>`);
    return out.join('');
  }

  async function selectLog(i){
    const list = logEntries || [];
    if(!list.length) return;
    logActive = Math.max(0, Math.min(i, list.length - 1));

    Array.prototype.forEach.call(logList.children, (el, k) => {
      el.setAttribute('aria-selected', k === logActive ? 'true' : 'false');
    });
    const cur = logList.children[logActive];
    if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest', inline:'nearest' });

    logDetail.innerHTML = '<p class="log-state">读取中…</p>';
    try{
      const entry = await loadLogEntry(list[logActive]);
      logDetail.innerHTML = renderLogEntry(entry);
      logDetail.scrollTop = 0;
    }catch(err){
      logDetail.innerHTML =
        `<p class="log-state">这条日志读不出来：${esc(err.message)}<br>` +
        `看看 ${esc(LOG_DIR + (list[logActive].file || 'index.json'))} 还在不在。</p>`;
    }
  }

  async function openLog(){
    logLastFocus = document.activeElement;
    logWin.classList.add('show');
    lockScroll(true);
    logClose.focus();
    if(logEntries) return;                       /* 已经读过了，直接看 */

    logDetail.innerHTML = '<p class="log-state">读取中…</p>';
    try{
      const list = await loadLogIndex();
      logCount.textContent = list.length ? list.length + ' 条' : '';
      if(!list.length){
        logList.innerHTML = '';
        logDetail.innerHTML =
          `<p class="log-state">还没有日志。<br>把条目写进 <code>${esc(LOG_DIR)}index.json</code>，这里就会列出来。</p>`;
        return;
      }
      logList.innerHTML = list.map((e, i) => `
        <button class="log-item" type="button" role="tab" aria-controls="logDetail"
                aria-selected="${i === 0 ? 'true' : 'false'}">
          <span class="d">${esc(e.date || '')}</span>
          <span>${esc(e.title || '（无标题）')}</span>
        </button>`).join('');
      Array.prototype.forEach.call(logList.children, (el, i) => {
        el.addEventListener('click', () => selectLog(i));
      });
      selectLog(0);
    }catch(err){
      logList.innerHTML = '';
      logCount.textContent = '';
      logDetail.innerHTML =
        `<p class="log-state">没读到 <code>${esc(LOG_INDEX)}</code>：${esc(err.message)}<br>` +
        `（用 file:// 直接打开页面时读不到，跑 部署.cmd serve 或看线上）</p>`;
    }
  }

  function closeLog(){
    if(!logWin.classList.contains('show')) return;
    logWin.classList.remove('show');
    lockScroll(false);
    if(logLastFocus && document.contains(logLastFocus)) logLastFocus.focus();
  }

  if(logBtn)   logBtn.addEventListener('click', openLog);
  if(logClose) logClose.addEventListener('click', closeLog);
  if(logWin)   logWin.addEventListener('click', e => { if(e.target === logWin) closeLog(); });
  if(logList)  logList.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if(!dir) return;
    e.preventDefault();
    selectLog(logActive + dir);
    const el = logList.children[logActive];
    if(el && el.focus) el.focus();
  });

  /* ============ 时光机（全部历史作业） ============
     数据在 GitHub 仓库的 class/data/hwk/（部署后才有）。三级降级，哪一级挂掉都往下走：

       ① 目录：GitHub Contents API（3 秒超时；未认证只有 60 次/小时）
              → jsDelivr 上的 index.json（国内快）
              → 同源 ./data/hwk/index.json（本地开发 / 热铁盒那条线）
       ② 每一份作业：raw.githubusercontent.com（3 秒超时）→ jsDelivr → 同源
       ③ 全挂 → 窗口里说一句「时光机暂时迷路了」，今天这份作业完全不受影响

     缓存：localStorage['hwk-index-v2']，5 分钟 TTL —— 这 5 分钟里反复开关不再打 API。
     内容片（科目条目 / 笔记）**按需**拉：选中哪天拉哪天，不一次性拉全部历史的正文。
     文件并发 8 个一批；列表先画 50 条，剩下的用「加载更多」。 */
  const TM = {
    owner:'JinSuperOfficial',
    repo:'jinsuperofficial.github.io',
    branch:'main',
    path:'class/data/hwk',
    timeout:3000,
    ttl:5 * 60 * 1000,
    cacheKey:'hwk-index-v2',
    concurrency:8,
    page:50,
    local:'./data/hwk/'
  };
  const TM_API = `https://api.github.com/repos/${TM.owner}/${TM.repo}/contents/${TM.path}`;
  const TM_CDN = `https://cdn.jsdelivr.net/gh/${TM.owner}/${TM.repo}@${TM.branch}/${TM.path}/`;

  const tmWin    = document.getElementById('tmWin');
  const tmList   = document.getElementById('tmList');
  const tmDetail = document.getElementById('tmDetail');
  const tmCount  = document.getElementById('tmCount');
  const tmMore   = document.getElementById('tmMore');
  const tmBtn    = document.getElementById('tmBtn');
  const tmClose  = document.getElementById('tmClose');

  let tmAll       = null;   /* 全部历史（新的在前） */
  let tmShown     = 0;      /* 列表已经画了几条 */
  let tmActive    = -1;     /* 现在看的是第几条 */
  let tmLastFocus = null;
  let tmCacheHit  = false;
  let tmSeq       = 0;      /* 切日期的令牌：慢请求回来时如果已经不是它了，就别盖上去 */
  const tmPieces  = {};     /* 内容片缓存：基准 + id → 内容 */

  function tmSupported(){
    return typeof window.fetch === 'function' && typeof window.Promise === 'function';
  }

  /* 带超时的 fetch：3 秒没回就 abort。老内核不认 AbortController 就退化成普通 fetch */
  function tmFetch(url, options){
    const opt = options || {};
    if(typeof window.AbortController !== 'function') return fetch(url, opt);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), TM.timeout);
    return fetch(url, Object.assign({}, opt, { signal: ctl.signal })).then(
      res => { clearTimeout(timer); return res; },
      err => { clearTimeout(timer); throw err; }
    );
  }

  async function tmJson(url, options){
    const res = await tmFetch(url, options);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return parseLooseJson(await res.text());
  }

  function tmSort(list){
    return list.slice().sort((a, b) =>
      String(b.date || b.id).localeCompare(String(a.date || a.id)) || String(b.id).localeCompare(String(a.id)));
  }

  /* 从某个基准读 index.json：裸数组、{entries:[]} 都认 */
  async function tmIndexFrom(base, label){
    try{
      const json = await tmJson(base + 'index.json');
      const list = Array.isArray(json) ? json
                 : (json && Array.isArray(json.entries) ? json.entries : null);
      if(!list) throw new Error('index.json 不是列表');
      const files = list
        .map(e => (typeof e === 'string' ? { name:e } : e))
        .filter(e => e && isHwkName(e.name))
        .map(e => ({
          id: String(e.id || e.name.replace(/^hwk-/, '').replace(/\.json$/, '')),
          name: e.name,
          date: String(e.date || ''),
          title: String(e.title || ''),
          base: base
        }));
      if(!files.length) throw new Error('index.json 里没有 hwk-*.json');
      console.log(`[时光机] 目录来自${label}：${files.length} 条`);
      return tmSort(files);
    }catch(err){
      console.warn(`[时光机] ${label}的目录没读通：${err.message}`);
      return null;
    }
  }

  async function tmListFiles(){
    /* 0. 缓存：5 分钟内不再打 API */
    try{
      const raw = localStorage.getItem(TM.cacheKey);
      const cached = raw ? JSON.parse(raw) : null;
      if(cached && cached.ts && (Date.now() - cached.ts) < TM.ttl &&
         Array.isArray(cached.data) && cached.data.length){
        tmCacheHit = true;
        return cached.data;
      }
    }catch(e){}

    let data = null;
    /* 1. GitHub Contents API（超时 3 秒） */
    try{
      const items = await tmJson(TM_API, { headers:{ 'Accept':'application/vnd.github+json' } });
      if(!Array.isArray(items)) throw new Error('返回的不是目录列表');
      data = items
        .filter(it => it && it.type === 'file' && isHwkName(it.name))
        .map(it => {
          const base = String(it.download_url || '').replace(/[^/]*$/, '');
          return {
            id: it.name.replace(/^hwk-/, '').replace(/\.json$/, ''),
            name: it.name,
            date: '',                                 /* 目录接口不给正文，日期要等文件拉回来 */
            title: '',
            download_url: it.download_url,
            base: base || null
          };
        });
    }catch(err){
      console.warn('[时光机] GitHub API 没读通（超时 / 限流 / 网络），改用 CDN 索引：' + err.message);
    }
    /* 2. 国内 CDN 上的 index.json */
    if(!data) data = await tmIndexFrom(TM_CDN, 'CDN');
    /* 3. 同源（本地开发 / 热铁盒） */
    if(!data) data = await tmIndexFrom(TM.local, '同源 data/hwk/');
    if(!data) throw new Error('三个来源的目录都没读到');

    data = tmSort(data.map(it => Object.assign({}, it, {
      download_url: it.download_url || (it.base || TM_CDN) + it.name
    })));
    try{ localStorage.setItem(TM.cacheKey, JSON.stringify({ ts:Date.now(), data:data })); }catch(e){}
    return data;
  }

  /* 并发 8 个一批把每份作业拉下来：raw → CDN → 同源；单份全挂就跳过，不拖累别的 */
  async function tmFetchAll(){
    const files = await tmListFiles();
    const out = [];
    for(let i = 0; i < files.length; i += TM.concurrency){
      const batch = files.slice(i, i + TM.concurrency);
      const got = await Promise.all(batch.map(async f => {
        const tries = [];
        if(f.download_url){
          tries.push({ url:f.download_url, base:f.base || String(f.download_url).replace(/[^/]*$/, '') });
        }
        tries.push({ url:TM_CDN + f.name,   base:TM_CDN });
        tries.push({ url:TM.local + f.name, base:TM.local });
        for(const t of tries){
          try{
            const one = await tmJson(t.url);
            if(one && typeof one === 'object') return Object.assign({}, one, { __base:t.base, __name:f.name });
          }catch(err){ /* 往下一档 */ }
        }
        console.warn('[时光机] 这一份三个来源都没读到：' + f.name);
        return null;
      }));
      got.forEach(g => { if(g) out.push(g); });
    }
    return tmSort(out);
  }

  /* 内容片：选中哪天拉哪天 */
  async function tmPiece(base, id){
    if(!id) return null;
    const key = (base || '') + id;
    if(key in tmPieces) return tmPieces[key];
    const urls = [];
    [base ? base + id + '.json' : null, TM_CDN + id + '.json', TM.local + id + '.json'].forEach(u => {
      if(u && urls.indexOf(u) < 0) urls.push(u);
    });
    let out = null;
    for(const u of urls){
      try{
        const one = await tmJson(u);
        if(one && typeof one === 'object'){ out = one; break; }
      }catch(e){ /* 往下一档 */ }
    }
    tmPieces[key] = out;
    return out;
  }

  /* 和主页同一套配色：固定 5 科查表，其他科目按它在这次作业里的顺序取拓展色 */
  function tmColors(names){
    const map = {};
    let extra = 0;
    names.forEach(name => {
      const base = BASE_SUBJECTS.find(s => s.name === name);
      if(base){ map[name] = base.color; return; }
      map[name] = EXTRA_COLORS[extra % EXTRA_COLORS.length];
      extra++;
    });
    return map;
  }

  /* 一天的样子：标题 + 日期编号背景，然后一科一科列（和表格一个观感，只是不能勾） */
  function tmRenderDay(rec, pieces){
    const out = [];
    out.push(`<h3 class="log-h">${esc(rec.title || ('作业 ' + (rec.date || rec.id)))}</h3>`);

    const meta = [];
    if(rec.date) meta.push(`<span>${esc(rec.date)}</span>`);
    if(rec.id)   meta.push(`<span class="log-tag">${esc(rec.id)}</span>`);
    const bgRaw = bgValue(rec.bg);
    if(bgRaw) meta.push(`<span class="log-tag">背景：${esc(BG_LABEL[normalizeBg(bgRaw)] || String(bgRaw))}</span>`);
    out.push(`<div class="log-meta">${meta.join('')}</div>`);

    /* 科目：老的 subjects+内容片写法，或者直接把正文写在记录里的新写法（默认） */
    const subjectMap = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects : null;
    const names = subjectMap
      ? Object.keys(subjectMap)
      : Object.keys(rec).filter(k => INLINE_RESERVED.indexOf(k) < 0 && k !== '笔记' &&
                                    k.slice(0, 2) !== '__' && typeof rec[k] === 'string');
    const colors = tmColors(names);

    if(!names.length){
      out.push('<p class="tm-none">这份作业里没写科目。</p>');
    }else{
      out.push('<ul class="tm-subj">');
      names.forEach(name => {
        const text = subjectMap
          ? ((pieces && pieces[subjectMap[name]] && typeof pieces[subjectMap[name]].text === 'string') ? pieces[subjectMap[name]].text : '')
          : String(rec[name] || '');
        const list = toList(text);
        out.push(`<li class="tm-subj-row">
          <span class="tm-subj-name" style="--c:${colors[name]}">${subjectIcon(name)}${esc(name)}</span>`);
        out.push(list.length
          ? `<ul class="tm-items">${list.map(it => `<li>${parseInlineMD(it)}</li>`).join('')}</ul>`
          : '<p class="tm-none">这天这一科没写</p>');
        out.push('</li>');
      });
      out.push('</ul>');
    }

    /* 笔记：老的 notesId 内容片，或者记录里的 "笔记" */
    const note = rec.notesId
      ? (pieces ? pieces[rec.notesId] : null)
      : (typeof rec['笔记'] === 'string' ? { text: rec['笔记'] } : null);
    if(note && typeof note.text === 'string' && note.text.trim() !== ''){
      out.push(`<div class="log-note tm-note"><span class="tm-note-label">Notes</span>${parseBlockMD(note.text)}</div>`);
    }
    return out.join('');
  }

  async function tmPiecesFor(rec){
    if(!rec.subjects) return null;              /* 内联写法（默认）：正文就在记录里，不用再拉文件 */
    const subjects = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects : {};
    const ids = [];
    Object.keys(subjects).forEach(k => { if(typeof subjects[k] === 'string') ids.push(subjects[k]); });
    if(typeof rec.notesId === 'string') ids.push(rec.notesId);
    const uniq = ids.filter((v, i) => v && ids.indexOf(v) === i);
    const pieces = {};
    await Promise.all(uniq.map(async id => { pieces[id] = await tmPiece(rec.__base, id); }));
    return pieces;
  }

  async function tmSelect(i){
    const list = tmAll || [];
    if(!list.length) return;
    tmActive = Math.max(0, Math.min(i, list.length - 1));

    Array.prototype.forEach.call(tmList.children, (el, k) => {
      el.setAttribute('aria-selected', k === tmActive ? 'true' : 'false');
    });
    const cur = tmList.children[tmActive];
    if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest', inline:'nearest' });

    const token = ++tmSeq;
    tmDetail.innerHTML = '<p class="log-state">正在翻这一天的记录…</p>';
    try{
      const rec = list[tmActive];
      const pieces = await tmPiecesFor(rec);
      if(token !== tmSeq) return;                    /* 用户已经翻到别的日期了 */
      tmDetail.innerHTML = tmRenderDay(rec, pieces);
      tmDetail.scrollTop = 0;
    }catch(err){
      if(token !== tmSeq) return;
      tmDetail.innerHTML = `<p class="log-state">这一天的记录没读出来：${esc(err.message)}</p>`;
    }
  }

  function tmRenderList(){
    const list = tmAll || [];
    tmShown = Math.min(Math.max(tmShown, TM.page), list.length);
    tmList.innerHTML = list.slice(0, tmShown).map((h, i) => `
      <button class="log-item" type="button" role="tab" aria-controls="tmDetail"
              aria-selected="${i === tmActive ? 'true' : 'false'}">
        <span class="d">${esc(h.date || '')}</span>
        <span>${esc(h.title || h.id)}</span>
      </button>`).join('');
    Array.prototype.forEach.call(tmList.children, (el, i) => {
      el.addEventListener('click', () => tmSelect(i));
    });
    const left = list.length - tmShown;
    if(tmMore){
      tmMore.hidden = left <= 0;
      tmMore.textContent = left > 0 ? `加载更多（还有 ${left} 条）` : '';
    }
  }

  async function openTimeline(){
    tmLastFocus = document.activeElement;
    tmWin.classList.add('show');
    lockScroll(true);
    tmClose.focus();
    if(tmAll && tmAll.length){                        /* 已经读过了，直接看 */
      tmCount.textContent = tmAll.length + ' 条 · 已缓存';
      tmRenderList();
      return;
    }
    tmList.innerHTML = '';
    tmCount.textContent = '';
    tmDetail.innerHTML = '<p class="log-state">正在穿越，整理过去的记录…</p>';

    try{
      tmAll = await tmFetchAll();
      if(!tmAll.length){
        tmDetail.innerHTML = '<p class="log-state">时光机里空荡荡的，去丢点文件吧。</p>';
        return;
      }
      tmShown  = 0;
      tmActive = 0;
      tmRenderList();
      tmCount.textContent = tmAll.length + ' 条' + (tmCacheHit ? ' · 来自本地缓存' : '');
      tmSelect(0);
    }catch(err){
      /* 三种来源都挂了：这是「预料之内的降级」，不是崩溃 —— warn 一声就够，
         窗口里已经明说「迷路了」，主页面（今天这份作业）照常。 */
      console.warn('[时光机] 三个来源都没读到：' + err.message);
      tmList.innerHTML = '';
      tmCount.textContent = '';
      tmDetail.innerHTML = '<p class="log-state">时光机暂时迷路了，稍后再试。</p>';
    }
  }

  function closeTimeline(){
    if(!tmWin.classList.contains('show')) return;
    tmWin.classList.remove('show');
    lockScroll(false);
    if(tmLastFocus && document.contains(tmLastFocus) && tmLastFocus.focus) tmLastFocus.focus();
    else if(tmBtn) tmBtn.focus();                     /* 触发元素没了 / 不是焦点元素，就把焦点还给按钮 */
  }

  if(tmBtn)   tmBtn.addEventListener('click', openTimeline);
  if(tmClose) tmClose.addEventListener('click', closeTimeline);
  if(tmWin)   tmWin.addEventListener('click', e => { if(e.target === tmWin) closeTimeline(); });
  if(tmMore)  tmMore.addEventListener('click', () => { tmShown += TM.page; tmRenderList(); });
  if(tmList)  tmList.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if(!dir) return;
    e.preventDefault();
    tmSelect(tmActive + dir);
    const el = tmList.children[tmActive];
    if(el && el.focus) el.focus();
  });
  /* 焦点别跑出浮层：Tab 在弹窗里循环 */
  if(tmWin) tmWin.addEventListener('keydown', e => {
    if(e.key !== 'Tab') return;
    const items = tmWin.querySelectorAll('button:not([disabled]):not([hidden]), [href], [tabindex]:not([tabindex="-1"])');
    if(!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    closeLog();
    closeTimeline();
    closeCongrats();
  });

  /* ============ 系统配色切换监听 ============ */
  function onSchemeChange(){
    lastStep = -1;
    const items = tbody.querySelectorAll('.hw-item');
    if(items.length){
      applyTint(tbody.querySelectorAll('.hw-item.done').length, items.length);
    }else{
      applyTint(0, 1);
    }
  }
  if(darkQuery.addEventListener){
    darkQuery.addEventListener('change', onSchemeChange);
  }else if(darkQuery.addListener){
    darkQuery.addListener(onSchemeChange);
  }

  /* ============ 启动 ============ */
  /* 时光机：不支持 fetch / Promise 的浏览器直接把按钮藏掉（主页功能一点不受影响） */
  if(tmBtn && !tmSupported()) tmBtn.hidden = true;

  /* 便签标签上的那枚便签图标：SVG 路径只写在 JS 一处，这里插进去，别在 HTML 里抄第二份 */
  const noteLabelEl = document.getElementById('noteLabel');
  if(noteLabelEl) noteLabelEl.insertAdjacentHTML('afterbegin', subjectIcon('笔记'));

  applyBg();                                       /* 按记忆的档位先铺好底纹（含彩蛋层），别等数据 */
  initReveal();                                    /* 首屏那几块（head / card / foot）先排队入场 */
  sbLayout();                                      /* 顶栏从哪冒出来：按头部的实际高度算 */
  railLayout();                                    /* 首帧先算一次滚动条（数据还没到，刻度是空的） */
  runFrame();                                      /* 把 thumb / 顶栏 / 视差对一次初始位置 */
  window.addEventListener('resize', (() => {       /* 视口变了重算「拼几张」 */
    let t = null;
    return () => { clearTimeout(t); t = setTimeout(paintPageBg, 180); };
  })());

  loadData().then(({ data, demo, egg }) => {
    isDemoMode = demo;
    render(data, egg);

    if(demo){
      noticeText.innerHTML =
        '没读到 <code>data/hwk/index.json</code>，下面是示例内容。' +
        '把当天记录放进 <code>data/hwk/</code>（拆分脚本 build/migrate-hwk.mjs）刷新即可。';
      notice.classList.add('show');
      revealNow(notice);                           /* 提示条是 display:none 起步的，直接放行更稳 */
    }
  }).catch(err => {
    isDemoMode = true;
    render(DEMO);
    noticeText.textContent = '读取作业数据出错，已显示示例内容：' + err.message;
    notice.classList.add('show');
    revealNow(notice);
  });

})();
</script>

</body>
</html>
