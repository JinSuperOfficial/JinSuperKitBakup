<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../lib/theme.js"></script>
<title>811 工具箱 · 八年(11)班</title>
<style>
  /* 圆角规范：.Skills/theme-plus/references/circle_angle.md
     默认 rounded-md / rounded-lg，窗口最多 rounded-xl，禁止 rounded-2xl / rounded-3xl
     以及按钮/输入框/卡片的 rounded-full；只有状态点、开关才用胶囊。 */
  :root{
    color-scheme: light dark;

    /* ---------- 圆角 token ---------- */
    --radius-xs:4px;
    --radius-sm:6px;
    --radius-md:8px;
    --radius-lg:10px;
    --radius-xl:12px;
    --radius-pill:999px;

    --radius-control:var(--radius-md);
    --radius-card:var(--radius-lg);
    --radius-badge:var(--radius-sm);

    /* ---------- 亮色基准（默认主题色 = DeepSeek 蓝，见文件末尾的 [data-accent] 覆盖） ---------- */
    color-scheme:light;
    --bg:#F8F3EC;
    --paper:#FFFCF7;
    --ink:#2E2A26;
    --ink-soft:#6B635A;
    --oak:#8D6959;
    --olive:#8E9867;
    --clay:#D97757;
    --line:rgba(46,42,38,.12);
    --line-strong:rgba(46,42,38,.18);
    --accent:#3964FE; --accent-rgb:57,100,254;
    --accent-soft:rgba(57,100,254,.10);
    --glow-1:hsl(222 76% 62% / .18);
    --glow-2:hsl(84 24% 62% / .16);
    --shadow-1:rgba(46,42,38,.05);
    --shadow-2:rgba(46,42,38,.34);

    /* 窗口专用 */
    --titlebar-tint:linear-gradient(to bottom, rgba(46,42,38,.015), rgba(46,42,38,.05));
    --window-shadow:
      0 0 0 1px var(--shadow-1),
      0 1px 2px rgba(46,42,38,.04),
      0 18px 38px -20px rgba(46,42,38,.22),
      0 42px 72px -44px rgba(46,42,38,.28);
    --window-highlight:inset 0 1px 0 rgba(255,255,255,.55);

    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }

  /* 暗色（theme.js 在 <html> 上写 data-appearance；没 JS 就停在亮色基准） */
  :root[data-appearance="dark"]{
      color-scheme:dark;
      --bg:#14120E;
      --paper:#1E1B17;
      --ink:#EDE7DF;
      --ink-soft:#A29A8E;
      --oak:#B89B85;
      --olive:#A8B57C;
      --clay:#E88B6D;
      --line:rgba(237,231,223,.12);
      --line-strong:rgba(237,231,223,.20);
      --accent:#E88B6D; --accent-rgb:232,139,109;
      --accent-soft:rgba(217,119,87,.16);
      --glow-1:hsl(28 44% 52% / .26);
      --glow-2:hsl(84 26% 46% / .22);
      --shadow-1:rgba(0,0,0,.40);
      --shadow-2:rgba(0,0,0,.70);

      --titlebar-tint:linear-gradient(to bottom, rgba(255,255,255,.012), rgba(0,0,0,.14));
      --window-shadow:
        0 0 0 1px rgba(255,255,255,.045),
        0 1px 2px rgba(0,0,0,.35),
        0 22px 44px -20px rgba(0,0,0,.55),
        0 48px 84px -44px rgba(0,0,0,.65);
      --window-highlight:inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---------- 主题色：手动切「现在的颜色」时把蓝换回暖橘 ---------- */
  :root[data-accent="amber"]{
    --accent:#B0552F; --accent-rgb:176,85,47;
    --accent-soft:rgba(217,119,87,.10);
    --glow-1:hsl(28 40% 68% / .20);
  }
  :root[data-appearance="dark"][data-accent="amber"]{
    --accent:#E88B6D; --accent-rgb:232,139,109;
    --accent-soft:rgba(217,119,87,.16);
    --glow-1:hsl(28 44% 52% / .26);
  }
  /* 选了蓝色时，「暖橘点缀」也一起换成蓝（--clay 是它的旧名字） */
  :root[data-accent="blue"]{ --clay:#3964FE; }
  :root[data-appearance="dark"][data-accent="blue"]{ --clay:#5686FE; }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    background:
      radial-gradient(880px 520px at 12% -8%, var(--glow-1), transparent 62%),
      radial-gradient(760px 480px at 92% 4%, var(--glow-2), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:clamp(24px,5vw,64px) clamp(14px,4vw,40px) clamp(40px,8vw,88px);
    transition:background .5s ease, color .3s ease;
  }

  .page{max-width:820px;margin:0 auto}

  /* ---------- 窗口外壳 ---------- */
  .window{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    box-shadow:var(--window-shadow);
    overflow:hidden;
  }
  .window::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    box-shadow:var(--window-highlight);
  }

  /* ---------- 标题栏 ---------- */
  .titlebar{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
    height:44px;
    padding:0 14px;
    border-bottom:1px solid var(--line);
    background-image:var(--titlebar-tint);
    user-select:none;
  }

  .traffic{display:flex;align-items:center;gap:8px;justify-self:start}
  .traffic .dot{
    width:12px;height:12px;
    border-radius:50%;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);
  }
  .traffic .close{background:#FF5F57}
  .traffic .min{background:#FEBC2E}
  .traffic .max{background:#28C840}

  .titlebar-title{
    justify-self:center;
    font-family:var(--serif);
    font-size:13px;
    font-weight:500;
    letter-spacing:.08em;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .titlebar-actions{
    justify-self:end;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .ghost-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:26px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--ink-soft);
    font-size:12px;
    letter-spacing:.04em;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .22s ease, color .22s ease, background .22s ease;
  }
  .ghost-btn svg{width:13px;height:13px;flex:none}
  .ghost-btn:hover{
    border-color:var(--clay);
    color:var(--ink);
    background:var(--accent-soft);
  }
  .ghost-btn:focus-visible{outline:2px solid var(--clay);outline-offset:2px}

  /* ---------- 窗口内容 ---------- */
  .window-body{
    padding:clamp(26px,4.2vw,40px) clamp(20px,3.4vw,32px) clamp(22px,3.2vw,28px);
  }

  .head{margin-bottom:clamp(20px,3.2vw,28px)}

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--oak);
  }
  .kicker::before{
    content:"";
    width:24px;height:1px;
    background:var(--clay);
    flex:none;
  }

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(26px,4.6vw,36px);
    line-height:1.25;
    letter-spacing:-.005em;
  }

  .subtitle{
    margin-top:10px;
    padding-left:13px;
    border-left:2px solid var(--clay);
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(14px,2vw,16px);
    line-height:1.65;
    letter-spacing:.03em;
    color:var(--ink-soft);
  }

  /* ---------- 工具卡片 ---------- */
  .grid{
    display:grid;
    gap:10px;
    margin-top:clamp(20px,3.2vw,26px);
  }

  .card{
    display:grid;
    grid-template-columns:42px 1fr 18px;
    align-items:center;
    gap:15px;
    padding:15px clamp(14px,2.4vw,20px);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    color:inherit;
    text-decoration:none;
    box-shadow:0 1px 2px var(--shadow-1);
    transition:border-color .22s ease, background .22s ease, transform .15s ease, box-shadow .22s ease;
  }
  .card:hover{
    border-color:var(--clay);
    background:color-mix(in srgb, var(--paper) 94%, var(--clay) 6%);
    transform:translateY(-2px);
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 12px 26px -18px var(--shadow-2);
  }
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

  .card-ico{
    width:42px;height:42px;
    display:grid;
    place-items:center;
    border-radius:var(--radius-control);
    background:var(--accent-soft);
    border:1px solid var(--line);
    color:var(--accent);
    transition:background .22s ease, border-color .22s ease;
  }
  .card-ico svg{width:20px;height:20px}
  .card:hover .card-ico{border-color:var(--clay)}

  .card-body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .card-title{
    font-family:var(--serif);
    font-size:17px;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .card-desc{
    font-size:13px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .card-go{
    color:var(--ink-soft);
    opacity:.45;
    transition:opacity .22s ease, transform .22s ease, color .22s ease;
  }
  .card-go svg{width:17px;height:17px;display:block}
  .card:hover .card-go{opacity:1;color:var(--accent);transform:translateX(2px)}

  /* ---------- 页脚 ---------- */
  .foot{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:clamp(22px,3.4vw,30px);
    padding-top:clamp(16px,2.4vw,20px);
    border-top:1px solid var(--line);
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .foot a{
    color:var(--ink-soft);
    text-decoration:none;
    border-radius:var(--radius-xs);
    transition:color .18s ease;
  }
  .foot a:hover{color:var(--accent)}
  .foot .sep{width:1px;height:12px;background:var(--line)}

  @supports (corner-shape: squircle){
    .card,
    .card-ico,
    .ghost-btn{
      corner-shape:squircle;
    }
  }

  @media (prefers-reduced-motion: reduce){
    body{transition:none}
    .card,.card-ico,.card-go,.ghost-btn,.foot a{transition:none}
    .card:hover{transform:none}
    .card:hover .card-go{transform:none}
  }

  @media (max-width:560px){
    .titlebar{height:42px;padding:0 12px;grid-template-columns:auto 1fr auto}
    .titlebar-title{justify-self:start;margin-left:4px;font-size:12.5px}
    .traffic{gap:6px}
    .traffic .dot{width:11px;height:11px}
    .card{grid-template-columns:38px 1fr;gap:13px;padding:14px}
    .card-ico{width:38px;height:38px}
    .card-ico svg{width:18px;height:18px}
    .card-go{display:none}
    .card-title{font-size:16px}
  }

  /* ============================================================
     响应式：桌面 / 平板 / 手机
     ============================================================
     断点（与全站一致，只写在下面这一段里）：
       桌面       ≥ 1024px  —— 下面一律不碰，视觉与交互和改造前逐像素一致
       平板   768 – 1023px  —— 紧凑版
       手机        ≤ 767px  —— 重点适配
       手机窄屏    ≤ 400px  —— 小屏微调

     规矩：
       ① 全部 max-width 覆盖，而且都排在本页原有规则之后 —— 桌面一条都不命中。
       ② 不写死颜色，一律走上面的 token。
       ③ 触摸目标 ≥ 48px；触屏没有 hover，hover 与 active 成对写。
       ④ 正文 ≥ 16px（卡片说明算正文），顺带避开 iOS 对小块文字自动放大整页。
       ⑤ 右上角那组按钮是 /lib/theme.js 运行时注入的，它的 <style> 插在本页
          <style> 之后 —— 同权重会被它反压。所以这里统一用 `body .theme-ctl …`
          抬一档权重（不改 theme.js 本身），手机上再把按钮做成 48px 的方块、
          顶部留一条安全带，别让它压在窗口标题栏上。
       ⑥ 贴边的东西用 env(safe-area-inset-*) 让开刘海与 Home 指示条。
       ============================================================ */

  /* ---------- 平板：留白收一档，卡片两列 ----------
     两列时卡片窄了一半，图标与内距同步收一分，说明文字才不至于一行挤两个字。 */
  @media (max-width:1023px){
    body{
      padding-left:max(clamp(14px,4vw,40px), env(safe-area-inset-left), 24px);
      padding-right:max(clamp(14px,4vw,40px), env(safe-area-inset-right), 24px);
    }
    html{overflow-x:hidden; overflow-x:clip}   /* 无横向滚动：不小心溢出了也不给左右拖 */
    img,video{max-width:100%;height:auto}

    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-empty{grid-column:1 / -1}      /* 清单没读出来时的那段提示：别只占半栏 */
    .card{grid-template-columns:36px minmax(0,1fr) 16px; gap:12px; padding:14px}
    .card-ico{width:36px;height:36px}
    .card-ico svg{width:18px;height:18px}
    .card-desc{line-height:1.6}
  }

  /* ---------- 手机 ---------- */
  @media (max-width:767px){
    /* 顶部安全带 = 10px 贴边 + 48px 按钮 + 8px 呼吸：窗口整体落在按钮下面，谁也不压谁 */
    body{
      padding:
        calc(66px + env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        calc(40px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      font-size:16px;
    }

    .window-body{
      padding:22px max(16px, env(safe-area-inset-right)) 20px
              max(16px, env(safe-area-inset-left));
    }

    /* 标题栏：两个触摸目标（红绿灯只是装饰，工具站按钮提到 48px），栏高跟着让一步 */
    .titlebar{
      height:auto;
      min-height:56px;
      padding:0 12px;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:8px;
    }
    .titlebar-title{justify-self:start;margin-left:4px;font-size:13px}
    .traffic{gap:6px}
    .traffic .dot{width:11px;height:11px}
    .ghost-btn{height:48px;padding:0 12px;font-size:13px}

    .kicker{font-size:12px}
    h1{font-size:clamp(25px,7.2vw,32px);line-height:1.3}
    .subtitle{font-size:16px;line-height:1.72}

    /* 卡片：一列到底。≤560 那档本来就把箭头收掉、卡片内部收成两格，这里把值一并
       写全 —— 否则这一段（源码在后）会在 401–560px 把那档又顶回「图标 + 正文 + 箭头」。 */
    .grid{grid-template-columns:minmax(0,1fr);gap:8px}
    .card{
      grid-template-columns:42px minmax(0,1fr);
      gap:14px;
      padding:15px 16px;
      min-height:48px;                    /* 整张卡都是命中区，高于 48px 就行 */
      -webkit-tap-highlight-color:transparent;
    }
    .card-ico{width:42px;height:42px}
    .card-ico svg{width:20px;height:20px}
    .card-go{display:none}
    .card-title{font-size:17px}
    .card-desc{font-size:16px;line-height:1.72}
    /* 触屏没有 hover：悬停位移去掉，补偿一个按下去的反应 */
    .card:hover{
      transform:none;
      border-color:var(--line);
      background:var(--paper);
      box-shadow:0 1px 2px var(--shadow-1);
    }
    .card:active{transform:scale(.992);border-color:var(--clay)}

    /* 页脚链接拉成 48px 高的整行：行距交给 min-height，不留空档 */
    .foot{gap:2px 12px;font-size:13px}
    .foot a{display:inline-flex;align-items:center;min-height:48px}

    /* ---------- theme.js 注入的右上角按钮组 ---------- */
    body .theme-ctl{
      top:max(10px, env(safe-area-inset-top));
      right:max(10px, env(safe-area-inset-right));
      flex-wrap:wrap;                     /* 真放不下就换行，别顶出屏幕 */
      justify-content:flex-end;
      gap:8px;
      max-width:calc(100vw - 20px);
    }
    body .theme-ctl button{
      min-width:48px;min-height:48px;     /* 触摸目标 */
      padding:0 12px;
      justify-content:center;
    }
    body .theme-ctl button span{display:none}              /* 触屏只留图形，文字会把右上角拉成一条 */
    body .theme-ctl button span.sw{display:inline-block}   /* 但颜色样块不能跟着被藏掉 */
    body .theme-ctl .sw{width:14px;height:14px}
  }

  /* ---------- 手机窄屏 ---------- */
  @media (max-width:400px){
    body{
      padding:
        calc(64px + env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        calc(36px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    .window-body{
      padding:18px max(14px, env(safe-area-inset-right)) 18px
              max(14px, env(safe-area-inset-left));
    }
    .titlebar-title{display:none}         /* 320px 上三格挤不下：留红绿灯 + 工具站按钮就够 */
    h1{font-size:24px}
    .grid{gap:6px}
    .card{padding:14px}
    .foot{justify-content:flex-start}
    body .theme-ctl{gap:6px}
  }
</style>
</head>

  <a class="card">

  </a>
</template>

<script src="/lib/manifest.js"></script>
<script>
(function(){
  'use strict';

  const M = window.JSManifest;
  const grid = document.getElementById('tool-grid');

  function showEmpty(text){
    M.showEmpty(grid, text);
  }

  M.loadCollection('/class/tools.json', { collection: 'class' }).then(function (col){
    M.logProblems(col.problems, 'class');

    if (!col.ok){
      showEmpty('清单没加载出来，检查 tools.json 路径或用本地服务器打开。');
      return;
    }
    if (!col.items.length){ showEmpty('暂无工具'); return; }

    M.renderCards(grid, col.items, { template: '#tpl-tool-card' });
  });
})();
</script>

</body>
</html>
