# android/gradle.properties
# ---------------------------------------------------------------
# 构建期的全局开关。改这里之前先看 project.md 的「移动端」一节。

# JVM 参数：Gradle 守护进程 + Kotlin 编译各给一点，CI 上 2G 也够
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# 并行 + 缓存 + 配置缓存：CI 上省时间；本机跑一次就热了
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 别让 Gradle 自己乱抓 JDK：CI 与本机都用 JAVA_HOME 指的那个（17）

# AndroidX 是必须的（androidx.webkit / activity-compose 都在这儿）
android.useAndroidX=true
# R 类不做传递依赖，编译快一点、APK 小一点
android.nonTransitiveRClass=true
# 只有一种语言：不做资源语言拆分（我们用不到）
android.defaults.buildfeatures.buildconfig=false
