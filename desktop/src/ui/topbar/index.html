<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JinSuper 百宝箱 · topbar</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="topbar.css">
</head>
<body>
  <header class="bar" id="bar">
    <!-- 品牌 -->
    <div class="brand" title="JinSuper 百宝箱">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 8.2 12 4l8 4.2v7.6L12 20l-8-4.2V8.2Z"/>
        <path d="M12 12v8M4 8.2 12 12l8-3.8"/>
      </svg>
      <span class="brand-name">百宝箱</span>
    </div>

    <!-- 导航 -->
    <nav class="nav" id="nav">
      <button class="tb" data-act="back" id="btnBack" title="上一页（Alt+←）">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12 15 18.5"/></svg>
        <span>上一页</span>
      </button>

      <button class="tb" data-nav="home" title="百宝箱首页">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.4 12 4.5l8 6.9"/><path d="M6.6 10.4V20h10.8v-9.6"/></svg>
        <span>主页</span>
      </button>

      <button class="tb" data-nav="skills" title="Skills 里的全部小工具">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
        <span>工具站</span>
      </button>

      <button class="tb" data-nav="class" title="811 专区">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="11.5" rx="1.8"/><path d="M8.4 8V6.6a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2V8"/><path d="M3 12.6h18"/><path d="M10.4 12.6h3.2v2.2h-3.2z"/></svg>
        <span>班级工具箱</span>
      </button>

      <button class="tb" data-nav="blog" title="JinSuper 奇思妙想">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h9.6A2.4 2.4 0 0 1 17 6.9V20H7.2A2.2 2.2 0 0 1 5 17.8V4.5Z"/><path d="M17 17.4h1.6A1.4 1.4 0 0 0 20 16V6.9"/><path d="M8.4 8.6h5.2M8.4 12h5.2"/></svg>
        <span>博客</span>
      </button>
    </nav>

    <!-- 当前页标题（拖动区） -->
    <div class="dragzone" id="dragzone" title="双击最大化 / 还原">
      <span class="page-title" id="pageTitle"></span>
    </div>

    <!-- 来源徽章 -->
    <button class="chip" id="chip" data-act="openSettings" title="切换网页来源 / 打开设置">
      <span class="dot" id="chipDot"></span>
      <span id="chipText">主站</span>
    </button>

    <!-- 设置 -->
    <button class="tb ghost" data-act="openSettings" title="设置（Ctrl+,）">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h8.4M17.4 7.5H20M4 16.5h2.6M11.4 16.5H20"/><circle cx="15" cy="7.5" r="2.3"/><circle cx="9" cy="16.5" r="2.3"/></svg>
      <span>设置</span>
    </button>

    <!-- 退出 -->
    <button class="tb quit" data-act="quit" title="退出应用（Ctrl+Q）">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.8v7.4"/><path d="M7.4 6.6a6.6 6.6 0 1 0 9.2 0"/></svg>
      <span>退出</span>
    </button>

    <!-- 窗口按钮 -->
    <div class="winbtns">
      <button class="winbtn" data-act="minimize" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 12.4h12"/></svg>
      </button>
      <button class="winbtn" data-act="maximize" id="btnMax" title="最大化 / 还原" aria-label="最大化">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true" id="maxIcon"><rect x="6" y="6" width="12" height="12" rx="1.6"/></svg>
      </button>
      <button class="winbtn close" data-act="closeWindow" title="关闭窗口" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>

    <div class="progress" id="progress" hidden></div>
  </header>

  <script src="topbar.js"></script>
</body>
</html>
