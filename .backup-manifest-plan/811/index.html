<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>811 工具箱 · 八年(11)班</title>
<style>
  /* 圆角规范：.Skills/theme-plus/references/circle_angle.md
     默认 rounded-md / rounded-lg，窗口最多 rounded-xl，禁止 rounded-2xl / rounded-3xl
     以及按钮/输入框/卡片的 rounded-full；只有状态点、开关才用胶囊。 */
  :root{
    color-scheme: light dark;

    /* ---------- 圆角 token ---------- */
    --radius-xs:4px;
    --radius-sm:6px;
    --radius-md:8px;
    --radius-lg:10px;
    --radius-xl:12px;
    --radius-pill:999px;

    --radius-control:var(--radius-md);
    --radius-card:var(--radius-lg);
    --radius-badge:var(--radius-sm);

    /* ---------- 浅色模式基准 ---------- */
    --bg:#F8F3EC;
    --paper:#FFFCF7;
    --ink:#2E2A26;
    --ink-soft:#6B635A;
    --oak:#8D6959;
    --olive:#8E9867;
    --clay:#D97757;
    --line:rgba(46,42,38,.12);
    --accent:#B0552F;
    --accent-soft:rgba(217,119,87,.10);
    --glow-1:hsl(28 40% 68% / .20);
    --glow-2:hsl(84 24% 62% / .16);
    --shadow-1:rgba(46,42,38,.05);
    --shadow-2:rgba(46,42,38,.34);

    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14120E;
      --paper:#1E1B17;
      --ink:#EDE7DF;
      --ink-soft:#A29A8E;
      --oak:#B89B85;
      --olive:#A8B57C;
      --clay:#E88B6D;
      --line:rgba(237,231,223,.14);
      --accent:#E88B6D;
      --accent-soft:rgba(217,119,87,.16);
      --glow-1:hsl(28 44% 52% / .26);
      --glow-2:hsl(84 26% 46% / .22);
      --shadow-1:rgba(0,0,0,.40);
      --shadow-2:rgba(0,0,0,.70);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    background:
      radial-gradient(880px 520px at 12% -8%, var(--glow-1), transparent 62%),
      radial-gradient(760px 480px at 92% 4%, var(--glow-2), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:clamp(28px,6vw,76px) clamp(16px,5vw,40px) clamp(48px,8vw,100px);
    transition:background .5s ease, color .3s ease;
  }

  .page{max-width:820px;margin:0 auto}

  /* ---------- 头部 ---------- */
  .head{margin-bottom:clamp(22px,3.6vw,34px)}

  .head-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--oak);
  }
  .kicker::before{
    content:"";
    width:26px;height:1px;
    background:var(--clay);
    flex:none;
  }

  .ghost-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    min-height:34px;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-control);
    background:transparent;
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:.03em;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .22s ease, color .22s ease, background .22s ease, transform .15s ease;
  }
  .ghost-btn svg{width:15px;height:15px;flex:none}
  .ghost-btn:hover{
    border-color:var(--clay);
    color:var(--ink);
    background:var(--accent-soft);
    transform:translateY(-1px);
  }
  .ghost-btn:active{transform:translateY(0) scale(.985)}
  .ghost-btn:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(27px,5.4vw,42px);
    line-height:1.26;
    letter-spacing:-.01em;
  }

  .subtitle{
    margin-top:12px;
    padding-left:13px;
    border-left:2px solid var(--clay);
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(14px,2.2vw,17px);
    line-height:1.65;
    letter-spacing:.03em;
    color:var(--ink-soft);
  }

  /* ---------- 工具卡片 ---------- */
  .grid{
    display:grid;
    gap:12px;
    margin-top:clamp(22px,3.6vw,32px);
  }

  .card{
    display:grid;
    grid-template-columns:44px 1fr 18px;
    align-items:center;
    gap:16px;
    padding:18px clamp(16px,2.6vw,22px);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    color:inherit;
    text-decoration:none;
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 20px 40px -32px var(--shadow-2);
    transition:border-color .22s ease, background .22s ease, transform .15s ease, box-shadow .22s ease;
  }
  .card:hover{
    border-color:var(--clay);
    transform:translateY(-2px);
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 26px 46px -30px var(--shadow-2);
  }
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

  .card-ico{
    width:44px;height:44px;
    display:grid;
    place-items:center;
    border-radius:var(--radius-control);
    background:var(--accent-soft);
    border:1px solid var(--line);
    color:var(--accent);
    transition:background .22s ease, border-color .22s ease;
  }
  .card-ico svg{width:21px;height:21px}
  .card:hover .card-ico{border-color:var(--clay)}

  .card-body{min-width:0;display:flex;flex-direction:column;gap:3px}
  .card-title{
    font-family:var(--serif);
    font-size:18px;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .card-desc{
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .card-go{
    color:var(--ink-soft);
    opacity:.5;
    transition:opacity .22s ease, transform .22s ease, color .22s ease;
  }
  .card-go svg{width:18px;height:18px;display:block}
  .card:hover .card-go{opacity:1;color:var(--accent);transform:translateX(2px)}

  /* ---------- 页脚 ---------- */
  .foot{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:clamp(22px,3.6vw,30px);
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .foot a{
    color:var(--ink-soft);
    text-decoration:none;
    border-radius:var(--radius-xs);
    transition:color .18s ease;
  }
  .foot a:hover{color:var(--accent)}
  .foot .sep{width:1px;height:12px;background:var(--line)}

  @supports (corner-shape: squircle){
    .card,
    .card-ico,
    .ghost-btn{
      corner-shape:squircle;
    }
  }

  @media (prefers-reduced-motion: reduce){
    body{transition:none}
    .card,.card-ico,.card-go,.ghost-btn,.foot a{transition:none}
    .card:hover{transform:none}
    .card:hover .card-go{transform:none}
    .ghost-btn:hover{transform:none}
  }

  @media (max-width:560px){
    .card{grid-template-columns:38px 1fr;gap:13px;padding:16px}
    .card-ico{width:38px;height:38px}
    .card-ico svg{width:19px;height:19px}
    .card-go{display:none}
    .card-title{font-size:17px}
  }

  .grid-empty{font-size:14px;letter-spacing:.04em;color:var(--ink-soft)}
</style>
</head>
<body>

<main class="page">

  <header class="head">
    <div class="head-top">
      <p class="kicker">811 · Studio</p>
      <a class="ghost-btn" href="/Skills/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        <span>工具站</span>
      </a>
    </div>

    <h1>811 工具箱</h1>
    <p class="subtitle">八年(11)班的日常都收在这儿：作业、课表，往后新做的小玩意也放这里。</p>
  </header>

  <section class="grid" id="tool-grid"></section>

  <footer class="foot">
    <a href="/">百宝箱首页</a>
    <span class="sep"></span>
    <a href="/Skills/">工具站</a>
    <span class="sep"></span>
    <a href="/p/docs.html">文档站</a>
  </footer>

</main>

<template id="tpl-tool-card">
  <a class="card">
    <span class="card-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"></svg>
    </span>
    <span class="card-body">
      <span class="card-title"></span>
      <span class="card-desc"></span>
    </span>
    <span class="card-go" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13"/><path d="m13 6 6 6-6 6"/>
      </svg>
    </span>
  </a>
</template>

<script>
(function(){
  'use strict';

  /* 图标注册表：值就是 <svg> 里的内容；没登记的 icon 走 default */
  const ICONS = {
    clipboardCheck: '<path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/>' +
                    '<path d="M8 6H6.5A1.5 1.5 0 0 0 5 7.5v12A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-12A1.5 1.5 0 0 0 17.5 6H16"/>' +
                    '<path d="m9 13.5 2 2 4-4"/>',
    calendar:       '<rect x="3.5" y="4.5" width="17" height="16" rx="2"/>' +
                    '<path d="M3.5 9.5h17M8.5 9.5v11M15 9.5v11"/>',
    default:        '<circle cx="12" cy="12" r="8"/>'
  };

  const grid = document.getElementById('tool-grid');
  const tpl  = document.getElementById('tpl-tool-card');

  function showEmpty(text){
    const p = document.createElement('p');
    p.className = 'grid-empty';
    p.textContent = text;
    grid.replaceChildren(p);
  }

  function render(list){
    const items = list
      .filter(it => it && typeof it === 'object' && !it.hidden)
      .filter(it => typeof it.id === 'string'    && it.id.trim()
                 && typeof it.title === 'string' && it.title.trim()
                 && typeof it.href === 'string'  && it.href.trim())
      .sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));

    if (!items.length){ showEmpty('暂无工具'); return; }

    const seen = new Set();
    const cards = [];

    for (const it of items){
      const id = it.id.trim();
      if (seen.has(id)) continue;          /* id 必须唯一，重复的只留第一条 */
      seen.add(id);

      const card = tpl.content.firstElementChild.cloneNode(true);
      const icon = ICONS[it.icon] || ICONS.default;

      card.href = it.href.trim();
      card.dataset.id = id;
      card.querySelector('.card-ico svg').innerHTML = icon;
      card.querySelector('.card-title').textContent = it.title;
      card.querySelector('.card-desc').textContent = it.desc == null ? '' : String(it.desc);

      cards.push(card);
    }

    grid.replaceChildren(...cards);
  }

  fetch('./tools.json', { cache: 'no-store' })
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(data => {
      if (!Array.isArray(data)) throw new Error('tools.json 顶层应该是数组');
      render(data);
    })
    .catch(err => {
      console.warn('[811] 工具清单没读出来：', err);
      showEmpty('清单没加载出来，检查 tools.json 路径或用本地服务器打开。');
    });
})();
</script>

</body>
</html>
